<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karteikarten</title>
<style>
  :root{
    --bg:#f4f5f7;
    --card-front:#2563eb;
    --card-front-2:#1d4ed8;
    --card-back:#ffffff;
    --text-dark:#1f2937;
    --text-light:#ffffff;
    --accent:#2563eb;
    --muted:#6b7280;
    --border:#e5e7eb;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#111318;
      --card-back:#1c1f26;
      --text-dark:#f1f3f5;
      --muted:#9aa1ac;
      --border:#2b2f38;
    }
  }
  :root[data-theme="dark"]{
    --bg:#111318;
    --card-back:#1c1f26;
    --text-dark:#f1f3f5;
    --muted:#9aa1ac;
    --border:#2b2f38;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text-dark);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:24px 16px 40px;
  }

  h1{
    font-size:1.4rem;
    margin:8px 0 4px;
    text-align:center;
  }
  .subtitle{
    color:var(--muted);
    font-size:0.9rem;
    margin-bottom:20px;
    text-align:center;
  }

  .progress-wrap{
    width:100%;
    max-width:520px;
    margin-bottom:18px;
  }
  .progress-bar{
    width:100%;
    height:6px;
    background:var(--border);
    border-radius:99px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--accent);
    border-radius:99px;
    transition:width .3s ease;
  }
  .progress-label{
    display:flex;
    justify-content:space-between;
    font-size:0.8rem;
    color:var(--muted);
    margin-top:6px;
  }

  .card-stage{
    width:100%;
    max-width:520px;
    perspective:1600px;
  }

  .card{
    position:relative;
    width:100%;
    min-height:340px;
    cursor:pointer;
    transform-style:preserve-3d;
    transition:transform .5s cubic-bezier(.4,.2,.2,1);
  }
  .card.flipped{
    transform:rotateY(180deg);
  }

  .face{
    position:absolute;
    inset:0;
    -webkit-backface-visibility:hidden;
    backface-visibility:hidden;
    border-radius:18px;
    padding:28px 24px;
    display:flex;
    flex-direction:column;
    box-shadow:0 8px 24px rgba(0,0,0,0.12);
    overflow-y:auto;
  }

  .face-front{
    background:linear-gradient(145deg, var(--card-front), var(--card-front-2));
    color:var(--text-light);
    justify-content:center;
    align-items:center;
    text-align:center;
  }
  .face-front .tag{
    position:absolute;
    top:16px;
    left:20px;
    font-size:0.75rem;
    letter-spacing:.05em;
    opacity:0.75;
    text-transform:uppercase;
  }
  .face-front .q-text{
    font-size:1.25rem;
    font-weight:600;
    line-height:1.4;
  }
  .face-front .hint{
    margin-top:18px;
    font-size:0.8rem;
    opacity:0.7;
  }

  .face-back{
    background:var(--card-back);
    color:var(--text-dark);
    transform:rotateY(180deg);
    border:1px solid var(--border);
    justify-content:flex-start;
  }
  .face-back .tag{
    font-size:0.75rem;
    letter-spacing:.05em;
    color:var(--accent);
    text-transform:uppercase;
    margin-bottom:10px;
    font-weight:600;
  }
  .a-text{
    font-size:1rem;
    line-height:1.55;
    white-space:pre-wrap;
  }
  .a-text strong{font-weight:700;}

  .controls{
    width:100%;
    max-width:520px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:22px;
  }
  button{
    font-family:inherit;
    border:none;
    border-radius:12px;
    padding:12px 18px;
    font-size:0.95rem;
    font-weight:600;
    cursor:pointer;
    transition:transform .15s ease, opacity .15s ease;
  }
  button:active{transform:scale(0.96);}
  .btn-nav{
    background:var(--card-back);
    color:var(--text-dark);
    border:1px solid var(--border);
    flex:1;
  }
  .btn-nav:disabled{
    opacity:0.4;
    cursor:not-allowed;
  }
  .btn-flip{
    background:var(--accent);
    color:#fff;
    flex:2;
  }

  .shuffle-row{
    width:100%;
    max-width:520px;
    display:flex;
    justify-content:center;
    margin-top:14px;
  }
  .btn-shuffle{
    background:transparent;
    color:var(--muted);
    border:1px solid var(--border);
    font-size:0.85rem;
    padding:8px 16px;
  }

  .done-msg{
    text-align:center;
    color:var(--muted);
    font-size:0.85rem;
    margin-top:10px;
    min-height:1.2em;
  }

  @media (max-width:480px){
    .card{min-height:380px;}
    .face{padding:22px 18px;}
    .face-front .q-text{font-size:1.1rem;}
    .a-text{font-size:0.95rem;}
  }
</style>
</head>
<body>

<h1>📚 Karteikarten</h1>
<div class="subtitle">Frage antippen, um die Antwort zu sehen</div>

<div class="progress-wrap">
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-label">
    <span id="progressText">Karte 1 von 33</span>
    <span id="progressPct">3%</span>
  </div>
</div>

<div class="card-stage">
  <div class="card" id="card">
    <div class="face face-front">
      <div class="tag" id="tagFront">Frage</div>
      <div class="q-text" id="questionText"></div>
      <div class="hint">Tippen für Antwort</div>
    </div>
    <div class="face face-back">
      <div class="tag">Antwort</div>
      <div class="a-text" id="answerText"></div>
    </div>
  </div>
</div>

<div class="controls">
  <button class="btn-nav" id="prevBtn">← Zurück</button>
  <button class="btn-flip" id="flipBtn">Umdrehen</button>
  <button class="btn-nav" id="nextBtn">Weiter →</button>
</div>

<div class="shuffle-row">
  <button class="btn-shuffle" id="shuffleBtn">🔀 Mischen</button>
  <button class="btn-shuffle" id="resetBtn" style="margin-left:8px;">↺ Von vorne</button>
</div>

<div class="done-msg" id="doneMsg"></div>

<script>
const cards = [
{q:"Was bedeutet „anwendbares Recht“?", a:"Bei einem Vertrag mit ausländischen Geschäftspartnern muss geklärt werden, welches nationale Recht für den Vertrag gilt.\n\nBeispiel:\n🇩🇪 Deutsches Unternehmen ↔ 🇻🇳 Unternehmen aus Vietnam\n→ Welches Recht gilt?\n→ Deutsches Recht? Vietnamesisches Recht? CISG?\n\nMerksatz:\n👉 Anwendbares Recht = Nach welchem Recht wird der Streit beurteilt?"},
{q:"Was ist das CISG?", a:"Das UN-Kaufrecht (CISG) ist ein internationales Abkommen über den internationalen Warenkauf.\n\nEs regelt insbesondere:\n• Pflichten von Käufer und Verkäufer\n• Lieferung\n• Vertragsmäßigkeit der Ware\n• Mängel\n• Rechte bei Pflichtverletzungen\n• Schadensersatz"},
{q:"Wann kommt das CISG zur Anwendung?", a:"Nach Art. 1 Abs. 1 lit. a CISG, wenn\n• Käufer und Verkäufer ihre Niederlassungen in verschiedenen Staaten haben und\n• beide Staaten Vertragsstaaten des CISG sind.\n\nBeispiel Aufgabe:\n🇩🇪 Deutschland + 🇻🇳 Vietnam\n→ beide CISG-Vertragsstaaten\n→ CISG grundsätzlich anwendbar\n\nPrüfungssatz:\nGemäß Art. 1 Abs. 1 lit. a CISG ist das UN-Kaufrecht anwendbar, da beide Vertragsparteien ihre Niederlassungen in verschiedenen Vertragsstaaten haben."},
{q:"Kann man das CISG ausschließen?", a:"Ja.\n\nNach Art. 6 CISG können die Vertragsparteien die Anwendung des CISG ausschließen oder von einzelnen Bestimmungen abweichen.\n\nBeispiel:\n„Es gilt deutsches Recht unter Ausschluss des UN-Kaufrechts (CISG).“\n\n⚠️ Wichtig:\nDeutsches Recht + CISG ausgeschlossen ist etwas anderes als nur „deutsches Recht“."},
{q:"Was bedeutet Art. 35 CISG?", a:"Der Verkäufer muss Ware liefern, die vertragsgemäß ist.\n\nDie Ware muss insbesondere:\n• der vereinbarten Beschaffenheit entsprechen,\n• für den vereinbarten Zweck geeignet sein,\n• grundsätzlich für den gewöhnlichen Gebrauch geeignet sein.\n\nMerksatz:\n👉 Art. 35 = Ware muss passen."},
{q:"Was regelt Art. 36 CISG?", a:"Der Verkäufer haftet für Vertragswidrigkeiten, die bereits bei Gefahrübergang bestanden haben.\n\nMerksatz:\n👉 Art. 35 = Was muss geliefert werden?\n👉 Art. 36 = Wann muss der Mangel vorhanden sein?"},
{q:"Was muss der Käufer bei einer Lieferung nach CISG machen?", a:"Nach Art. 38 CISG muss der Käufer die Ware innerhalb einer so kurzen Frist untersuchen, wie es die Umstände erlauben."},
{q:"Was muss der Käufer tun, wenn er einen Mangel entdeckt?", a:"Nach Art. 39 CISG muss der Käufer dem Verkäufer den Mangel innerhalb einer angemessenen Frist anzeigen.\n\nSonst verliert er grundsätzlich seine Rechte wegen der Vertragswidrigkeit.\n\nZusätzlich gilt grundsätzlich eine absolute Zweijahresfrist nach Art. 39 Abs. 2 CISG, sofern keine Garantie etwas anderes vorsieht.\n\nMerksatz:\n👉 Art. 38 = prüfen\n👉 Art. 39 = rügen"},
{q:"Welche Rechte hat der Käufer bei einer mangelhaften Lieferung?", a:"Das CISG sieht verschiedene Rechtsbehelfe vor, insbesondere:\n• Nacherfüllung / Nachbesserung\n• Ersatzlieferung\n• Preisminderung\n• Schadensersatz\n• Vertragsaufhebung bei wesentlicher Vertragsverletzung\n\nWichtige Artikel:\nArt. 45 ff. CISG"},
{q:"Wann spricht man von einer wesentlichen Vertragsverletzung?", a:"Art. 25 CISG\n\nEine Vertragsverletzung ist wesentlich, wenn dem Vertragspartner dadurch im Wesentlichen das entzogen wird, was er nach dem Vertrag erwarten durfte.\n\nDas ist wichtig, weil dann beispielsweise eine Vertragsaufhebung nach Art. 49 CISG möglich sein kann.\n\nMerksatz:\n👉 Art. 25 = wesentlich?\n👉 Art. 49 = Vertrag aufheben?"},
{q:"Welche Vorschriften regeln Schadensersatz nach CISG?", a:"Vor allem Art. 74–77 CISG.\n\nErfasst werden können grundsätzlich Schäden, die durch die Vertragsverletzung entstanden sind, einschließlich bestimmter Folgeschäden und entgangenen Gewinns.\n\nMerksatz:\n👉 Art. 74 ff. = Geld für entstandenen Schaden"},
{q:"Was bedeutet „Durchsetzbarkeit von Ansprüchen“?", a:"Anspruch haben ≠ Anspruch durchsetzen können.\n\nBeispiel:\nDas deutsche Unternehmen hat möglicherweise einen Anspruch gegen den vietnamesischen Lieferanten.\n\nAber:\nWenn ein deutsches Urteil in Vietnam nicht anerkannt bzw. vollstreckt wird, kann die Durchsetzung schwierig sein.\n\nMerksatz:\n👉 Recht bekommen = Anspruch\n👉 Recht tatsächlich bekommen = Durchsetzbarkeit"},
{q:"Was ist das New Yorker Übereinkommen?", a:"Das New Yorker Übereinkommen von 1958 erleichtert die Anerkennung und Vollstreckung ausländischer Schiedssprüche.\n\nWichtig:\n• Art. II → schriftliche Schiedsvereinbarung\n• Art. III → Anerkennung und Vollstreckung von Schiedssprüchen\n• Art. V → mögliche Gründe, warum Vollstreckung verweigert werden kann\n\nGanz wichtig:\n👉 New Yorker Übereinkommen = Schiedsverfahren\nNicht normale deutsche Gerichtsurteile."},
{q:"Warum ist eine Schiedsvereinbarung bei internationalen Verträgen wichtig?", a:"Die Parteien vereinbaren bereits im Vertrag, dass Streitigkeiten durch ein Schiedsgericht entschieden werden.\n\nDas kann die spätere internationale Durchsetzung erleichtern, insbesondere zwischen Staaten, die dem New Yorker Übereinkommen angehören.\n\nBeispiel:\n„Alle Streitigkeiten aus oder im Zusammenhang mit diesem Vertrag werden endgültig durch ein Schiedsgericht nach den Regeln der ICC entschieden.“"},
{q:"Was bedeutet ICC?", a:"International Chamber of Commerce\n= Internationale Handelskammer.\n\nDie ICC stellt unter anderem Regeln für internationale Schiedsverfahren bereit.\n\nAußerdem kennt man die ICC besonders durch die Incoterms®.\n\n⚠️ Nicht verwechseln:\nICC → Organisation / Schiedsregeln\nNew Yorker Übereinkommen → Anerkennung und Vollstreckung von Schiedssprüchen"},
{q:"Was regelt die Rome-I-Verordnung?", a:"Die Rom-I-Verordnung (EG) Nr. 593/2008 regelt das auf vertragliche Schuldverhältnisse anzuwendende Recht.\n\nAlso:\nWelches nationale Recht gilt für den Vertrag?"},
{q:"Was ist eine Rechtswahl?", a:"Die Vertragsparteien legen selbst fest, welches Recht auf ihren Vertrag angewendet werden soll.\n\nGrundlage:\n👉 Art. 3 Rom-I-Verordnung\n\nBeispiel:\n„Es gilt deutsches Recht unter Ausschluss des CISG.“\n\nDas schafft mehr Rechtssicherheit."},
{q:"Was passiert, wenn die Parteien keine Rechtswahl getroffen haben?", a:"Dann greifen die Regelungen der Art. 4 Rom-I-Verordnung.\n\nBeim Warenkauf ist grundsätzlich das Recht des Staates maßgeblich, in dem der Verkäufer seinen gewöhnlichen Aufenthalt hat.\n\nMerksatz:\n👉 Keine Rechtswahl → Art. 4 Rom-I prüfen."},
{q:"Welches Recht ist bei einem deutschen Lieferanten grundsätzlich relevant?", a:"Bei einem rein deutschen Geschäft grundsätzlich das deutsche BGB, insbesondere das Kaufrecht.\n\nWichtige Vorschriften:\n§ 433 BGB → Pflichten Verkäufer\n§ 434 BGB → Sachmangel\n§ 437 BGB → Rechte Käufer"},
{q:"Was sagt § 433 BGB?", a:"Der Verkäufer muss dem Käufer die Sache frei von Sach- und Rechtsmängeln verschaffen.\n\nMerksatz:\n👉 § 433 = Verkäufer muss mangelfrei liefern."},
{q:"Was ist ein Sachmangel nach § 434 BGB?", a:"Eine Sache ist mangelhaft, wenn sie nicht die erforderliche bzw. vereinbarte Beschaffenheit besitzt.\n\nIm Fall:\n❌ CE-Kennzeichnung nicht ordnungsgemäß\n→ kann einen Sachmangel darstellen, insbesondere wenn dadurch die vereinbarte bzw. erforderliche Beschaffenheit nicht gegeben ist."},
{q:"Warum ist die CE-Kennzeichnung in der Aufgabe wichtig?", a:"Die CE-Kennzeichnung dokumentiert die Konformität eines Produkts mit den einschlägigen EU-Anforderungen.\n\nIst die Kennzeichnung nicht ordnungsgemäß, kann das bedeuten:\n• Ware entspricht nicht den Anforderungen\n• Ware kann möglicherweise nicht ordnungsgemäß in Verkehr gebracht werden\n• Vertragsgemäßheit kann betroffen sein\n\n➡️ Im Fall daher Sachmangel prüfen."},
{q:"Welche Rechte hat der Käufer bei einem Sachmangel?", a:"§ 437 BGB\n\nDer Käufer kann – abhängig von den Voraussetzungen – verlangen:\n1. Nacherfüllung → § 439 BGB\n2. Rücktritt → §§ 440, 323 BGB\n3. Minderung → § 441 BGB\n4. Schadensersatz → §§ 280 ff. BGB\n5. Aufwendungsersatz → § 284 BGB\n\nSuper-Merksatz:\n437 = Werkzeugkasten des Käufers"},
{q:"Was bedeutet Nacherfüllung?", a:"Der Käufer kann grundsätzlich wählen zwischen:\n• Nachbesserung\n• Ersatzlieferung\n\nDer Verkäufer trägt grundsätzlich die notwendigen Kosten der Nacherfüllung.\n\nMerksatz:\n👉 § 439 = Fehler beseitigen"},
{q:"Wann kann der Käufer vom Vertrag zurücktreten?", a:"Unter den gesetzlichen Voraussetzungen, insbesondere nach §§ 440, 323 BGB.\n\nGrundsätzlich muss dem Verkäufer zunächst die Möglichkeit gegeben werden, den Mangel innerhalb einer angemessenen Frist zu beseitigen.\n\nMerksatz:\n👉 Erst Chance zur Nacherfüllung → dann ggf. Rücktritt."},
{q:"Was bedeutet Minderung?", a:"Der Käufer behält die Ware, zahlt aber wegen des Mangels weniger.\n\nGrundlage:\n👉 § 441 BGB"},
{q:"Welche Vorschrift ist für Schadensersatz besonders wichtig?", a:"👉 § 280 BGB\n\nGrundidee:\nEine Pflichtverletzung verursacht einen Schaden.\n\nDann kann unter den gesetzlichen Voraussetzungen Schadensersatz verlangt werden."},
{q:"Wann ist § 281 BGB wichtig?", a:"Wenn der Käufer Schadensersatz statt der Leistung verlangt.\n\nGrundsätzlich muss dem Verkäufer zunächst eine angemessene Frist zur Leistung/Nacherfüllung gesetzt werden."},
{q:"Welche Kosten könnten beim deutschen Lieferanten als Schaden relevant sein?", a:"Im Fall:\n• Kosten für Kundenreklamationen\n• Kosten für Schadensdokumentation\n• Lagerkosten\n\nDiese können grundsätzlich als Schadenspositionen in Betracht kommen, wenn sie durch die Pflichtverletzung verursacht wurden und die weiteren Voraussetzungen des Schadensersatzrechts erfüllt sind."},
{q:"Was ist § 377 HGB?", a:"Die Untersuchungs- und Rügepflicht beim Handelskauf.\n\nBei einem beiderseitigen Handelsgeschäft muss der Käufer:\n1. Ware unverzüglich untersuchen\n2. erkennbare Mängel unverzüglich rügen\n3. versteckte Mängel unverzüglich nach Entdeckung anzeigen\n\nSonst gilt die Ware grundsätzlich als genehmigt.\n\nMerksatz:\n👉 § 377 = Gucken & Rügen"},
{q:"Was sollte man bei internationalen Verträgen regeln?", a:"Die wichtigsten Punkte:\n\n1. Rechtswahl – Welches Recht gilt? → Art. 3 Rom-I\n2. CISG – Soll das CISG gelten oder ausgeschlossen werden? → Art. 6 CISG\n3. Schiedsvereinbarung – Wie werden Streitigkeiten entschieden? → z. B. ICC, New Yorker Übereinkommen\n4. Qualität – Welche Eigenschaften muss die Ware haben? → genaue technische Spezifikationen\n5. Dokumente – Welche Zertifikate, Nachweise und Unterlagen müssen geliefert werden?\n6. Prüfung & Rüge – Wie und wann wird die Ware geprüft?\n7. Incoterms – Wer trägt Kosten, Risiko, Transport, Versicherung, Zoll?"},
{q:"Was regeln Incoterms?", a:"Incoterms regeln bei internationalen Lieferungen insbesondere die Verteilung von:\n• Lieferung\n• Kosten\n• Transport\n• Risiko\n• Versicherung\n• Zoll-/Export-/Importpflichten\n• bestimmte Dokumentationspflichten\n\nMerksatz:\n👉 Incoterms = Wer macht was, wer zahlt was und wer trägt welches Risiko?"},
{q:"Wie gehe ich bei einem solchen Fall in der IHK vor?", a:"🇻🇳 AUSLÄNDISCHER LIEFERANT\n1. Internationaler Vertrag?\n2. CISG prüfen → Art. 1\n3. Rechtswahl vorhanden? → Art. 3 Rom-I / Art. 6 CISG\n4. Mangel? → Art. 35/36 CISG\n5. Prüfung/Rüge? → Art. 38/39 CISG\n6. Rechte? → Art. 45 ff. CISG\n7. Schadensersatz? → Art. 74 ff. CISG\n8. Durchsetzbarkeit? → Gerichtsurteil oder Schiedsverfahren? → New Yorker Übereinkommen bei Schiedsspruch\n\n🇩🇪 DEUTSCHER LIEFERANT\n1. Kaufvertrag\n2. Sachmangel? → § 434 BGB\n3. Käuferrechte? → § 437 BGB\n4. Nacherfüllung? → § 439 BGB\n5. Rücktritt/Minderung? → §§ 440, 323, 441 BGB\n6. Schadensersatz? → §§ 280 ff. BGB\n7. Handelsgeschäft? → § 377 HGB"}
];

let order = cards.map((_, i) => i);
let pos = 0;
let flipped = false;

const cardEl = document.getElementById('card');
const questionText = document.getElementById('questionText');
const answerText = document.getElementById('answerText');
const progressFill = document.getElementById('progressFill');
const progressText = document.getElementById('progressText');
const progressPct = document.getElementById('progressPct');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const flipBtn = document.getElementById('flipBtn');
const shuffleBtn = document.getElementById('shuffleBtn');
const resetBtn = document.getElementById('resetBtn');
const doneMsg = document.getElementById('doneMsg');

function render(){
  const idx = order[pos];
  questionText.textContent = cards[idx].q;
  answerText.textContent = cards[idx].a;
  cardEl.classList.remove('flipped');
  flipped = false;

  const total = cards.length;
  progressFill.style.width = ((pos+1)/total*100) + '%';
  progressText.textContent = `Karte ${pos+1} von ${total}`;
  progressPct.textContent = Math.round((pos+1)/total*100) + '%';

  prevBtn.disabled = pos === 0;
  nextBtn.disabled = pos === total - 1;

  doneMsg.textContent = (pos === total - 1) ? "🎉 Letzte Karte erreicht – gut gemacht!" : "";
}

function flip(){
  flipped = !flipped;
  cardEl.classList.toggle('flipped', flipped);
}

cardEl.addEventListener('click', flip);
flipBtn.addEventListener('click', (e) => { e.stopPropagation(); flip(); });

prevBtn.addEventListener('click', () => {
  if (pos > 0){ pos--; render(); }
});
nextBtn.addEventListener('click', () => {
  if (pos < cards.length - 1){ pos++; render(); }
});

shuffleBtn.addEventListener('click', () => {
  for (let i = order.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  pos = 0;
  render();
});

resetBtn.addEventListener('click', () => {
  order = cards.map((_, i) => i);
  pos = 0;
  render();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') nextBtn.click();
  if (e.key === 'ArrowLeft') prevBtn.click();
  if (e.key === ' ') { e.preventDefault(); flip(); }
});

render();
</script>
</body>
</html>
