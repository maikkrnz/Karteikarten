    {q:"Was ist Lieferantenintegration?", a:"Lieferantenintegration bedeutet, den Lieferanten stärker in die Prozesse und Zusammenarbeit des Unternehmens einzubinden.\n\nMögliche Bereiche:\n• gemeinsame Planung\n• Datenaustausch\n• elektronische Schnittstellen\n• gemeinsame Qualitätsmaßnahmen\n• gemeinsame Entwicklungsprojekte\n• frühzeitige Einbindung in Planungen\n\nBeispiel:\nEin wichtiger Lieferant erhält frühzeitig Absatzprognosen und kann seine Produktion und Lieferkapazitäten entsprechend planen.\n\nMerksatz:\n👉 INTEGRATION = GEMEINSAM PLANEN, INFORMIEREN UND PROZESSE VERKNÜPFEN."},
    {q:"Was ist ein Lieferantenaudit?", a:"Bei einem Lieferantenaudit wird ein Lieferant systematisch überprüft, beispielsweise hinsichtlich:\n• Qualität\n• Prozesse\n• Organisation\n• Anforderungen\n• Zertifizierungen\n• Nachhaltigkeit\n\nZiel:\nFeststellen, ob vereinbarte oder geforderte Standards eingehalten werden und wo Verbesserungsbedarf besteht.\n\nBeispiel:\nEin wichtiger Lieferant verursacht wiederholt Qualitätsprobleme. Das Unternehmen führt ein Audit durch und untersucht die Produktions- und Qualitätsprozesse.\n\nMerksatz:\n👉 AUDIT = SYSTEMATISCH PRÜFEN, OB ANFORDERUNGEN EINGEHALTEN WERDEN."},
    {q:"Welche Kennzahlen sind für die Lieferantenbewertung wichtig?", a:"Wichtige Kennzahlen:\n1. Termintreue\n2. ppm / Fehlerquote\n3. Reklamationsquote\n4. Liefermengentreue\n5. Lieferzeit\n6. Preisentwicklung\n\nBeispiel:\nVorgabe: maximal 100 ppm.\nLieferant: 322 ppm.\n→ Zielvorgabe wird überschritten.\n\nMögliche Maßnahmen:\n• Ursachenanalyse\n• Korrekturmaßnahmen entwickeln\n• Maßnahmen mit dem Lieferanten vereinbaren\n• Ergebnisse regelmäßig kontrollieren\n• ggf. Bonus-/Malus-System bei vereinbarten Qualitätsanforderungen\n\nMerksatz:\n👉 KENNZAHLEN MACHEN LIEFERANTENLEISTUNG MESSBAR."},
    {q:"Was bedeutet Termintreue?", a:"Die Termintreue zeigt, welcher Anteil der Lieferungen bzw. Lieferpositionen termingerecht eingegangen ist.\n\nFormel:\nTermintreue = termingerechte Lieferungen / Gesamtzahl der Lieferungen × 100\n\nBeispiel:\n100 Lieferungen insgesamt\n92 termingerecht\n\nTermintreue = 92 / 100 × 100 = 92 %\n\nMerksatz:\n👉 TERMINTREUE = PÜNKTLICHE LIEFERUNGEN ÷ GESAMTLIEFERUNGEN × 100."},
    {q:"Was bedeutet ppm und wie wird ein Lieferant bewertet?", a:"ppm ist eine Kennzahl zur Darstellung der Fehlerquote.\n\nBeispiel aus der Prüfung:\nErmittelte Gesamtquote: ungefähr 322 ppm\nVorgabe: maximal 100 ppm\n→ Lieferant liegt über dem zulässigen Grenzwert.\n\nMögliche Maßnahmen:\n1. Ursachenanalyse\n2. Korrekturmaßnahmen entwickeln\n3. Maßnahmen mit dem Lieferanten vereinbaren\n4. Ergebnisse regelmäßig kontrollieren\n5. ggf. Bonus-/Malus-System\n\nMerksatz:\n👉 PPM ÜBER GRENZWERT = URSACHE SUCHEN → MASSNAHMEN → KONTROLLE."},
    {q:"Welche Maßnahmen können aus einer Lieferantenbewertung abgeleitet werden?", a:"Mögliche Maßnahmen:\n• Lieferantenentwicklung\n• Gespräche und Zielvereinbarungen\n• Qualitätsverbesserungsmaßnahmen\n• Audits\n• intensivere Betreuung\n• strategische Kooperation\n• Anpassung des Bestellvolumens\n• Lieferantenwechsel\n• Auslistung eines Lieferanten\n\nBeispiel:\nGute Qualität, aber schlechte Termintreue:\n→ Ursachen untersuchen\n→ Verbesserungsmaßnahmen vereinbaren\n→ Termintreue regelmäßig kontrollieren.\n\nMerksatz:\n👉 BEWERTUNG OHNE MASSNAHME BRINGT WENIG – AUS DEN ERGEBNISSEN MÜSSEN ENTSCHEIDUNGEN FOLGEN."},
    {q:"Welche Bedeutung haben Nachhaltigkeit, CSR und LkSG im Lieferantenmanagement?", a:"Gründe für nachhaltiges Lieferantenmanagement:\n• Qualitätsanforderungen bzw. Qualitätssiegel\n• eigener Code of Conduct\n• Anforderungen an soziale Verantwortung und Menschenrechte\n• gesetzliche bzw. politische Berichtspflichten, z. B. LkSG\n\nMögliche Maßnahmen:\n• Lieferantenanforderungen festlegen\n• Code of Conduct für Lieferanten\n• Lieferantenselbstauskünfte\n• Nachhaltigkeitskriterien in die Lieferantenbewertung aufnehmen\n• Audits\n• Korrekturmaßnahmen\n• Dokumentation und Kontrolle\n\nEinfach erklärt:\nEin Lieferant wird nicht nur nach Preis und Leistung beurteilt. Auch soziale, ökologische und rechtliche Anforderungen können entscheidend sein.\n\nBeispiel:\nEin günstiger Lieferant erfüllt die Preisvorgaben, verstößt aber gegen festgelegte soziale Standards. Dies muss bei Bewertung und Zusammenarbeit berücksichtigt werden.\n\nMerksatz:\n👉 NACHHALTIGES LIEFERANTENMANAGEMENT = PREIS + QUALITÄT + LIEFERUNG + SOZIALES + UMWELT + COMPLIANCE."},
    {q:"Wie sieht der komplette Lieferantenmanagement-Prozess aus?", a:"Prüfungsgerechte Reihenfolge:\n1. Lieferanten identifizieren\n2. Anforderungen festlegen\n3. Präqualifikation / Eignung prüfen\n4. Lieferanten auswählen\n5. Lieferanten bewerten\n6. Lieferanten klassifizieren\n7. Lieferanten entwickeln\n8. Lieferanten integrieren\n9. Leistung laufend kontrollieren\n\nBeispiel:\nLieferanten recherchieren → Anforderungsprofil erstellen → Eignung prüfen → Angebote vergleichen → Nutzwertanalyse → Auswahl → Bewertung → Entwicklung → Integration → laufendes Controlling.\n\nMerksatz:\n👉 VOM ERSTEN KONTAKT BIS ZUR LAUFENDEN KONTROLLE: ALLES SYSTEMATISCH STEUERN."},
    {q:"Typische IHK-Fallstrategie bei einer Lieferantenaufgabe", a:"Wenn in der Prüfung ein problematischer Lieferant vorkommt:\n\n1. WAS IST DAS PROBLEM?\n   Preis, Qualität, Lieferung, Service, Nachhaltigkeit oder Risiko?\n\n2. WIE MESSE ICH DAS PROBLEM?\n   Kennzahl bestimmen, z. B. Termintreue oder ppm.\n\n3. WIE BEWERTE ICH DEN LIEFERANTEN?\n   Kriterien festlegen und ggf. gewichten.\n\n4. WELCHE URSACHE HAT DAS PROBLEM?\n   Ursachenanalyse durchführen.\n\n5. WELCHE MASSNAHME IST SINNVOLL?\n   Lieferantenentwicklung, Audit, Zielvereinbarung usw.\n\n6. WIE KONTROLLIERE ICH DEN ERFOLG?\n   Kennzahl erneut messen und regelmäßig überprüfen.\n\n7. WENN KEINE VERBESSERUNG EINTRITT:\n   Alternativlieferanten prüfen bzw. Lieferantenwechsel vorbereiten.\n\nMerksatz:\n👉 PROBLEM → KENNZAHL → BEWERTUNG → URSACHE → MASSNAHME → KONTROLLE."},
    {q:"Die 10 wichtigsten Punkte für die Prüfung (Lieferantenmanagement)", a:"1. Lieferantenmanagement ist ein systematischer Prozess.\n2. Lieferanten sollen objektiv und nachvollziehbar bewertet werden.\n3. Nicht nur der Preis zählt.\n4. Qualität und Termintreue sind zentrale Bewertungskriterien.\n5. Kriterien können unterschiedlich gewichtet werden.\n6. Die Nutzwertanalyse ermöglicht einen strukturierten Lieferantenvergleich.\n7. Präqualifikation prüft die grundsätzliche Eignung eines Lieferanten.\n8. Lieferantenentwicklung soll die Leistung gezielt verbessern.\n9. Aus der Lieferantenbewertung müssen konkrete Maßnahmen folgen.\n10. Nachhaltigkeit, soziale Standards, Menschenrechte und Compliance können Teil der Lieferantenbewertung sein.\n\nPrüfungs-Merksatz:\n👉 DEN RICHTIGEN LIEFERANTEN AUSWÄHLEN, OBJEKTIV BEWERTEN, KLASSIFIZIEREN, ENTWICKELN, INTEGRIEREN UND KONTROLLIEREN."}
  ],
  "ABC / XYZ / Portfolioanalyse": [
    {q:"Was ist die ABC-Analyse?", a:"Die ABC-Analyse ist ein Verfahren zur Klassifizierung von Materialien nach ihrer wirtschaftlichen Bedeutung.\n\nDabei wird betrachtet, welchen Anteil ein Artikel am gesamten Einkaufswert hat.\n\n• A-Artikel: hoher Wertanteil\n• B-Artikel: mittlerer Wertanteil\n• C-Artikel: geringer Wertanteil\n\nDas Ziel ist, die Aufmerksamkeit und den Bearbeitungsaufwand auf die wertmäßig wichtigen Artikel zu konzentrieren.\n\nBeispiel aus einer Prüfung:\nBei einer Stückliste wurde beispielsweise ein Hydraulikzylinder mit:\n• 6 Stück\n• 4.000 € Einkaufspreis\nbewertet.\n\nRechnung:\n6 × 4.000 € = 24.000 € Einkaufswert\n\nDer Artikel hatte dadurch einen hohen Anteil am gesamten Einkaufsvolumen und wurde als A-Artikel klassifiziert.\n\nMerksatz:\n👉 ABC = Wertigkeit\nA = hoher Wert → B = mittlerer Wert → C = geringer Wert"},
    {q:"Wie führt man eine ABC-Analyse durch?", a:"Grundsätzlich gehst du immer in dieser Reihenfolge vor:\n\n1. Einkaufswert je Artikel berechnen\nMenge × Einkaufspreis = Einkaufswert\n\n2. Gesamten Einkaufswert ermitteln\nAlle Artikelwerte werden addiert.\n\n3. Prozentualen Wertanteil berechnen\nEinkaufswert des Artikels ÷ Gesamteinkaufswert × 100\n\n4. Artikel nach Wert absteigend sortieren\nDer Artikel mit dem höchsten Einkaufswert steht oben.\n\n5. Prozentwerte kumulieren\nDie einzelnen Prozentanteile werden fortlaufend addiert.\n\n6. ABC-Klasse bestimmen\nAnhand der gewählten bzw. begründeten Grenzen erfolgt die Einteilung in A, B und C.\n\nWichtig für die Prüfung: Die Klassifizierung muss nachvollziehbar begründet werden.\n\nBeispiel:\nGesamteinkaufswert: 100.000 €\n\nArtikel 1: 30.000 € → 30 %\nArtikel 2: 20.000 € → 20 %\n\nKumuliert:\n• Artikel 1: 30 %\n• Artikel 1 + 2: 50 %\n\nDadurch lässt sich erkennen, welche Artikel den größten Teil des Einkaufswertes ausmachen.\n\nMerksatz:\n👉 Berechnen → Prozentanteil → Sortieren → Kumulieren → Klassifizieren"},
    {q:"Was ist die XYZ-Analyse?", a:"Die XYZ-Analyse ergänzt die ABC-Analyse.\n\nWährend ABC die Wertigkeit eines Artikels betrachtet, untersucht XYZ die Regelmäßigkeit bzw. Planbarkeit des Verbrauchs.\n\nX-Artikel\nDer Verbrauch ist relativ konstant.\n→ sehr gut planbar\n\nY-Artikel\nDer Verbrauch schwankt.\n→ teilweise planbar, beispielsweise durch Trends oder saisonale Entwicklungen\n\nZ-Artikel\nDer Verbrauch ist stark unregelmäßig.\n→ schlecht planbar\n\nBeispiel:\nEin Unternehmen benötigt jeden Monat ungefähr 1.000 Schrauben:\n950 → 1.020 → 980 → 1.050\n→ X-Artikel\n\nEin Saisonartikel wird im Sommer deutlich stärker benötigt als im Winter:\n→ Y-Artikel\n\nEin Ersatzteil wird völlig unregelmäßig benötigt:\n100 → 0 → 500 → 20 → 0\n→ Z-Artikel\n\nMerksatz:\n👉 XYZ = Planbarkeit des Verbrauchs\nX = konstant → Y = schwankend → Z = unregelmäßig"},
    {q:"Warum kombiniert man ABC und XYZ?", a:"Die beiden Analysen beantworten unterschiedliche Fragen:\n\nABC:\nWie wichtig ist der Artikel finanziell?\n\nXYZ:\nWie gut kann ich den Bedarf planen?\n\nDurch die Kombination erhält man eine bessere Grundlage für die Bedarfsermittlung und Disposition.\n\nBeispiele:\nAX: hoher Wert + gut planbarer Verbrauch\nAZ: hoher Wert + schlecht planbarer Verbrauch\nCX: niedriger Wert + gut planbarer Verbrauch\nCZ: niedriger Wert + schlecht planbarer Verbrauch\n\nBeispiel:\nEin teurer Motor wird jeden Monat regelmäßig benötigt:\n→ A + X = AX\n\nEine teure Spezialkomponente wird dagegen nur unregelmäßig benötigt:\n→ A + Z = AZ\n\nDer zweite Artikel ist wesentlich schwieriger zu disponieren.\n\nMerksatz:\n👉 ABC sagt: Wie wichtig?\nXYZ sagt: Wie planbar?"},
    {q:"Welche Dispositionsverfahren eignen sich für X-, Y- und Z-Artikel?", a:"Die XYZ-Klassifizierung kann genutzt werden, um die passende Bedarfsermittlung auszuwählen.\n\nX-Artikel\nDa der Verbrauch regelmäßig ist, eignen sich beispielsweise:\n• arithmetisches Mittel\n• genaue Bedarfsplanung\n• ggf. optimale Bestellmenge\n\nY-Artikel\nDa der Verbrauch schwankt:\n• gleitende Mittelwerte\n• Forecast\n• Abrufmengen mit Lieferanten vereinbaren\n\nZ-Artikel\nDa der Verbrauch schlecht vorhersehbar ist:\n• bedarfsbezogene Beschaffung\n• auftragsbezogene Beschaffung\n• Sicherheitsbestände je nach Bedeutung und Risiko prüfen\n\nMerksatz:\n👉 X = einfach planen\nY = Prognose nutzen\nZ = Bedarf schwer vorhersehbar"},
    {q:"Wie sollten A- und C-Artikel disponiert werden?", a:"Hier kommt die wirtschaftliche Bedeutung der ABC-Analyse ins Spiel.\n\nA-Artikel\nA-Artikel haben einen hohen Einkaufswert.\nDaher sollte besonders genau geplant werden.\n\nGeeignete Maßnahmen können sein:\n• deterministische Bedarfsermittlung\n• Rahmenverträge\n• Abrufverträge\n• geringe Bestände\n• langfristige Verträge\n• Skonto nutzen\n\nC-Artikel\nC-Artikel haben einen geringen Einkaufswert.\nHier ist es häufig wichtiger, die Prozesskosten und den Verwaltungsaufwand zu reduzieren.\n\nMögliche Maßnahmen:\n• höhere Bestände\n• Sammellieferungen\n• Sammelrechnungen\n• vereinfachte Bestellprozesse\n• stochastische oder heuristische Bedarfsermittlung\n\nBeispiel:\nA-Artikel:\nTeurer Motor → genau planen und möglichst geringe Lagerbestände.\n\nC-Artikel:\nSchrauben → größere Mengen bestellen und Bestellvorgänge bündeln.\n\nMerksatz:\n👉 A = Materialkosten beachten\nC = Prozesskosten beachten"},
    {q:"Warum sind C-Teile trotz ihres geringen Wertes interessant?", a:"C-Teile haben zwar einen geringen Einkaufswert, können aber einen hohen Bearbeitungsaufwand verursachen.\n\nBeispielsweise kann eine einzelne Bestellung nur 20 € wert sein, aber trotzdem entstehen:\n• Bestellaufwand\n• Lieferantenkommunikation\n• Wareneingang\n• Rechnungsprüfung\n• Zahlungsabwicklung\n\nDadurch können die Prozesskosten im Verhältnis zum Warenwert sehr hoch sein.\n\nDeshalb unter anderem:\n• Zusammenfassung verschiedener Artikel zu Materialgruppen\n• Abrufverträge\n• einen Dienstleister für möglichst viele C-Teile\n• Fremdbevorratungsverträge\n\nBeispiel:\nStatt Schrauben, Muttern, Unterlegscheiben und Kleinteile bei fünf verschiedenen Lieferanten zu bestellen:\n→ möglichst bündeln\n→ einen Lieferanten einsetzen\n→ Rahmen-/Abrufvertrag verwenden.\n\nMerksatz:\n👉 C-Teile sind billig – aber die Bestellung kann teuer sein."},
    {q:"Was ist eine Portfolioanalyse im Einkauf?", a:"Die Portfolioanalyse betrachtet Beschaffungsobjekte anhand von zwei Dimensionen.\n\nBeim Versorgungsrisikoportfolio sind dies:\n1. wirtschaftliche Bedeutung / Einkaufsvolumen\n2. Versorgungsrisiko\n\nDamit kann entschieden werden, welche Beschaffungsstrategie für einen Artikel sinnvoll ist.\n\nMerksatz:\n👉 Portfolio = zwei Dimensionen → passende Beschaffungsstrategie"},
    {q:"Welche vier Felder gibt es im Versorgungsrisikoportfolio?", a:"Unkritische Produkte\nNiedrige wirtschaftliche Bedeutung + niedriges Versorgungsrisiko\n→ einfache Beschaffung\nBeispiel: Standard-Büromaterial mit vielen verfügbaren Lieferanten.\nMerksatz: Unkritisch = einfach beschaffen\n\nHebelprodukte\nHohe wirtschaftliche Bedeutung + niedriges Versorgungsrisiko\n→ gute Verhandlungsposition\nMögliche Maßnahmen:\n• Preise verhandeln\n• Mengen bündeln\n• Angebote vergleichen\n• Lieferanten wechseln\nBeispiel: Ein großer Mengenartikel mit vielen verfügbaren Lieferanten.\nMerksatz: Hebel = Verhandlungsmacht nutzen\n\nEngpassprodukte\nNiedrige wirtschaftliche Bedeutung + hohes Versorgungsrisiko\n→ Versorgung absichern\nMögliche Maßnahmen:\n• Alternativlieferanten suchen\n• Sicherheitsbestand prüfen\n• langfristige Lieferbeziehungen\n• Versorgung überwachen\nBeispiel: Eine günstige Spezialschraube, die nur ein Lieferant herstellen kann.\nMerksatz: Engpass = Versorgung sichern\n\nStrategische Produkte\nHohe wirtschaftliche Bedeutung + hohes Versorgungsrisiko\n→ strategische Zusammenarbeit\nMögliche Maßnahmen:\n• langfristige Verträge\n• Kooperation\n• Lieferantenentwicklung\n• gemeinsame Entwicklung\n• strategische Partnerschaften\n• Versorgungssicherheit erhöhen\nBeispiel: Ein teures Spezialbauteil, das nur wenige Lieferanten herstellen können.\nMerksatz: Strategisch = gemeinsam langfristig absichern"},
    {q:"Wie hängen ABC-Analyse und Versorgungsrisikoportfolio zusammen?", a:"Die ABC-Analyse kann eine wichtige Grundlage für das Portfolio bilden.\n\nSie zeigt zunächst:\nWelche Artikel sind wirtschaftlich besonders bedeutend?\n\nAnschließend wird zusätzlich das Versorgungsrisiko betrachtet.\n\nDadurch kann beispielsweise ein A-Artikel entweder:\n• ein Hebelprodukt oder\n• ein strategisches Produkt\nsein.\n\nEin C-Artikel kann dagegen beispielsweise:\n• unkritisch oder\n• Engpassprodukt\nsein.\n\nBeispiel:\nArtikel A:\nHoher Einkaufswert + viele Lieferanten\n→ Hebelprodukt\n\nArtikel B:\nHoher Einkaufswert + nur ein Lieferant\n→ strategisches Produkt\n\nMerksatz:\n👉 ABC zeigt die wirtschaftliche Bedeutung – das Portfolio ergänzt das Versorgungsrisiko."},
    {q:"Welche Beschaffungsstrategie ergibt sich aus dem Portfolio?", a:"Die Grundlogik solltest du für die Prüfung unbedingt beherrschen:\n\nUnkritische Produkte → Beschaffung vereinfachen\nHebelprodukte → Verhandlungspotenzial nutzen\nEngpassprodukte → Versorgung absichern\nStrategische Produkte → langfristige Kooperation\n\nSuper-Merksatz:\n👉 UNKritisch = EINFACH\nHEBEL = VERHANDELN\nENGPASS = ABSICHERN\nSTRATEGISCH = KOOPERIEREN"},
    {q:"Wie führt man eine ABC-Analyse durch?", a:"Zuerst wird für jeden Artikel der Einkaufswert aus Menge × Einkaufspreis berechnet. Anschließend wird der prozentuale Anteil am Gesamteinkaufswert ermittelt. Die Artikel werden nach ihrem Wert absteigend sortiert, die Prozentwerte kumuliert und anschließend in A-, B- und C-Artikel eingeteilt.\n\nBeispiel:\nIn einer Prüfung hatte ein Hydraulikzylinder einen Einkaufswert von 24.000 € und dadurch einen hohen Anteil am Gesamteinkaufswert. Er wurde als A-Artikel klassifiziert.\n\nMerksatz:\n👉 Berechnen → Sortieren → Kumulieren → Klassifizieren."},
    {q:"Was unterscheidet A-, B- und C-Artikel?", a:"A-Artikel haben einen hohen Wertanteil, B-Artikel einen mittleren Wertanteil und C-Artikel einen geringen Wertanteil am gesamten Einkaufsvolumen.\n\nBeispiel:\nEin teurer Motor kann ein A-Artikel sein, während Schrauben mit geringem Einkaufswert typische C-Artikel sein können.\n\nMerksatz:\n👉 ABC = Wertigkeit."},
    {q:"Was untersucht die XYZ-Analyse?", a:"Die XYZ-Analyse untersucht die Regelmäßigkeit und Planbarkeit des Verbrauchs.\n\nBeispiel:\nEin Artikel mit einem konstanten Monatsverbrauch ist ein X-Artikel. Ein stark schwankender und schlecht vorhersehbarer Artikel ist ein Z-Artikel.\n\nMerksatz:\n👉 XYZ = Planbarkeit."},
    {q:"Was bedeuten X-, Y- und Z-Artikel?", a:"X-Artikel haben einen konstanten und gut planbaren Verbrauch. Y-Artikel haben einen schwankenden, teilweise planbaren Verbrauch. Z-Artikel haben einen unregelmäßigen und schlecht planbaren Verbrauch.\n\nBeispiel:\n1.000 → 1.020 → 980 Stück = X.\n500 → 1.500 → 800 Stück = eher Y.\n0 → 2.000 → 50 Stück = Z.\n\nMerksatz:\n👉 X = konstant, Y = schwankend, Z = unregelmäßig."},
    {q:"Warum kombiniert man ABC- und XYZ-Analyse?", a:"Die ABC-Analyse zeigt die wirtschaftliche Bedeutung eines Artikels, während die XYZ-Analyse die Planbarkeit des Verbrauchs zeigt. Die Kombination ermöglicht eine gezieltere Disposition.\n\nBeispiel:\nEin teurer und regelmäßig benötigter Artikel ist ein AX-Artikel. Ein teurer und unregelmäßig benötigter Artikel ist ein AZ-Artikel.\n\nMerksatz:\n👉 ABC = Wie wichtig? XYZ = Wie planbar?"},
    {q:"Welches Dispositionsverfahren eignet sich für X-Artikel?", a:"Da X-Artikel einen relativ konstanten Verbrauch haben, kann beispielsweise das arithmetische Mittel zur Bedarfsermittlung verwendet werden. Auch die optimale Bestellmenge kann berücksichtigt werden.\n\nBeispiel:\nEin Artikel wird monatlich ungefähr 1.000 Stück benötigt. Aus den vergangenen Perioden kann ein Durchschnittsbedarf ermittelt werden.\n\nMerksatz:\n👉 X = regelmäßig → Durchschnitt nutzen."},
    {q:"Welche Dispositionsmöglichkeiten eignen sich für Y-Artikel?", a:"Für Y-Artikel eignen sich beispielsweise gleitende Mittelwerte sowie Forecasts oder die Vereinbarung von Abrufmengen mit Lieferanten.\n\nBeispiel:\nBei einem saisonal schwankenden Artikel können vergangene Verbrauchswerte und aktuelle Entwicklungen für eine Prognose verwendet werden.\n\nMerksatz:\n👉 Y = schwankend → Prognose nutzen."},
    {q:"Wie sollten A-Artikel grundsätzlich disponiert werden?", a:"A-Artikel sollten besonders genau geplant werden. Geeignet sind beispielsweise deterministische Bedarfsermittlung, Rahmenverträge, Abrufverträge, geringe Bestände und langfristige Verträge.\n\nBeispiel:\nEin teurer Motor wird über einen Rahmenvertrag vereinbart und bedarfsgerecht abgerufen.\n\nMerksatz:\n👉 A = hoher Wert → genau planen."},
    {q:"Wie sollten C-Artikel grundsätzlich disponiert werden?", a:"Bei C-Artikeln sollte der Beschaffungsprozess möglichst einfach und kostengünstig gestaltet werden. Geeignet sind beispielsweise Sammellieferungen, Sammelrechnungen, höhere Bestände und vereinfachte Bestellprozesse.\n\nBeispiel:\nSchrauben werden in größeren Mengen gesammelt bestellt, anstatt viele kleine Einzelbestellungen durchzuführen.\n\nMerksatz:\n👉 C = geringer Wert → Prozess vereinfachen."},
    {q:"Warum ist das C-Teile-Management wichtig?", a:"C-Teile haben zwar einen geringen Einkaufswert, können aber durch viele Bestellungen hohe Prozesskosten verursachen. Deshalb sollten Beschaffungsprozesse vereinfacht und gebündelt werden.\n\nBeispiel:\nMehrere Kleinteile werden über einen Lieferanten mittels Abrufvertrag beschafft.\n\nMerksatz:\n👉 C-Teile sind billig – die Beschaffung kann trotzdem teuer sein."},
    {q:"Welche zwei Dimensionen werden beim Versorgungsrisikoportfolio betrachtet?", a:"Das Einkaufsvolumen bzw. der Ergebniseinfluss und das Versorgungsrisiko.\n\nBeispiel:\nEin Artikel mit hohem Einkaufsvolumen und hohem Versorgungsrisiko ist ein strategisches Produkt.\n\nMerksatz:\n👉 Portfolio = wirtschaftliche Bedeutung + Versorgungsrisiko."},
    {q:"Was sind unkritische Produkte und welche Strategie eignet sich?", a:"Unkritische Produkte haben eine geringe wirtschaftliche Bedeutung und ein geringes Versorgungsrisiko. Die Beschaffung sollte möglichst einfach und kostengünstig gestaltet werden.\n\nBeispiel:\nNormale Büromaterialien mit vielen verfügbaren Lieferanten.\n\nMerksatz:\n👉 Unkritisch = einfach beschaffen."},
    {q:"Was sind Hebelprodukte und welche Strategie eignet sich?", a:"Hebelprodukte haben eine hohe wirtschaftliche Bedeutung und ein geringes Versorgungsrisiko. Die gute Verhandlungsposition sollte genutzt werden, beispielsweise durch Preisverhandlungen und Lieferantenvergleiche.\n\nBeispiel:\nEin Unternehmen kauft große Mengen eines Standardmaterials bei mehreren möglichen Lieferanten.\n\nMerksatz:\n👉 Hebel = Verhandlungsmacht nutzen."},
    {q:"Was sind Engpassprodukte und welche Strategie eignet sich?", a:"Engpassprodukte haben eine geringe wirtschaftliche Bedeutung, aber ein hohes Versorgungsrisiko. Die Versorgung sollte durch geeignete Maßnahmen abgesichert werden.\n\nBeispiel:\nEine günstige Spezialkomponente ist nur bei einem Lieferanten erhältlich.\n\nMerksatz:\n👉 Engpass = Versorgung sichern."},
    {q:"Was sind strategische Produkte und welche Strategie eignet sich?", a:"Strategische Produkte haben eine hohe wirtschaftliche Bedeutung und ein hohes Versorgungsrisiko. Hier eignen sich langfristige Verträge, Kooperationen, Lieferantenentwicklung und strategische Partnerschaften.\n\nBeispiel:\nEin teures Spezialbauteil wird nur von wenigen Lieferanten angeboten und ist für die Produktion unverzichtbar.\n\nMerksatz:\n👉 Strategisch = langfristig kooperieren."},
    {q:"Wie lauten die vier Grundstrategien des Versorgungsrisikoportfolios?", a:"Unkritische Produkte → Beschaffung vereinfachen.\nHebelprodukte → Verhandlungspotenzial nutzen.\nEngpassprodukte → Versorgung absichern.\nStrategische Produkte → langfristig kooperieren.\n\nBeispiel:\nEin unkritischer Artikel wird möglichst einfach beschafft, während ein strategischer Artikel über eine langfristige Lieferantenbeziehung abgesichert wird.\n\nMerksatz:\n👉 Unkritisch = einfach | Hebel = verhandeln | Engpass = absichern | Strategisch = kooperieren."}
  ],
  "Verhandlungsführung": [
    {q:"Was ist das Ziel einer professionellen Verhandlung?", a:"Eine Verhandlung soll eine für das eigene Unternehmen wirtschaftlich sinnvolle Vereinbarung erreichen und gleichzeitig die Geschäftsbeziehung berücksichtigen.\n\nTypische Ziele im Einkauf sind:\n• Preis verbessern bzw. Preiserhöhungen vermeiden\n• Qualität verbessern\n• Lieferzuverlässigkeit erhöhen\n• Lieferbedingungen verbessern\n• Zahlungsbedingungen verbessern\n• Rahmenvertrag abschließen\n• langfristige Zusammenarbeit sichern\n• zusätzliche Leistungen vereinbaren\n• Risiken reduzieren\n\nIn einer Prüfung sollten die Ziele konkret und situationsbezogen formuliert werden.\n\nBeispiel aus der Prüfung:\nBei der E-Technik KG waren mögliche Ziele:\n• Preiserhöhung vermeiden\n• Qualitätsabweichungen reduzieren\n• Lieferzuverlässigkeit erhöhen\n\nDie Ziele wurden anschließend mit konkreten Argumenten unterlegt.\n\nMerksatz:\n👉 ZIEL = Was will ich am Ende der Verhandlung erreicht haben?"},
    {q:"Wie bereitet man eine Verhandlung vor?", a:"Die Vorbereitung lässt sich sehr gut in drei Bereiche aufteilen:\n\nInhaltlich\n• Verhandlungsziele festlegen\n• Ausgangsforderung bestimmen\n• Argumente sammeln\n• mögliche Gegenargumente überlegen\n• Ziele des Lieferanten analysieren\n• eigene Verhandlungsmacht einschätzen\n• Verhandlungsmacht des Lieferanten einschätzen\n• Alternativen vorbereiten\n• Verhandlungsstil/-strategie festlegen\n\nPersonell\n• Wer nimmt teil?\n• Wer ist der Verhandlungspartner?\n• Welche Interessen und Bedürfnisse hat er?\n• Welche Erfahrungen hat er?\n• Welchen Verhandlungsstil bevorzugt er?\n• Welche Verhaltensmuster sind bekannt?\n• Gibt es gemeinsame Interessen?\n\nOrganisatorisch\n• Ort\n• Termin\n• Dauer\n• Teilnehmer\n• Unterlagen\n• Technik\n• Protokollführung\n• Agenda\n• ggf. Bewirtung\n\nMerksatz:\n👉 VORBEREITUNG = INHALTLICH + PERSONELL + ORGANISATORISCH"},
    {q:"Welche Informationen sollte man vor einer Verhandlung über den Lieferanten sammeln?", a:"Zum Beispiel:\n• Marktstärke des Lieferanten\n• Unternehmensdaten\n• wirtschaftliche Situation\n• Kapazitätsauslastung\n• Abhängigkeit des Lieferanten von deinem Unternehmen\n• alternative Kunden des Lieferanten\n• eigene Einkaufsmacht\n• mögliche Interessen des Lieferanten\n• mögliche Ziele des Lieferanten\n• bisherige Geschäftsbeziehung\n• bekannte Verhaltensmuster des Verhandlungspartners\n\nAußerdem:\n• Branchenkonjunktur\n• Rohstoffpreisentwicklung\n• Wettbewerber\n• Marktpreise\n\nBeispiel:\nWenn du weißt, dass der Lieferant stark von deinem Auftragsvolumen abhängig ist, hast du möglicherweise eine stärkere Verhandlungsposition.\n\nMerksatz:\n👉 WISSEN = VERHANDLUNGSMACHT"},
    {q:"Was gehört zu einer Verhandlungscheckliste?", a:"Eine gute Checkliste kann beispielsweise enthalten:\n\nInhaltlich:\n• Ziele\n• Ausgangsforderung\n• Argumente\n• mögliche Einwände\n• Ziele des Lieferanten\n• Verhandlungsmacht\n• Alternativen\n• Verhandlungsstrategie\n\nPersonell:\n• eigene Teilnehmer\n• Teilnehmer des Lieferanten\n• Interessen und Bedürfnisse\n• Verhalten und Verhandlungsstil\n\nOrganisatorisch:\n• Ort\n• Termin\n• Dauer\n• Unterlagen\n• Technik\n• Protokoll\n\nMarktdaten:\n• Branchenentwicklung\n• Rohstoffpreise\n• Wettbewerber\n• Marktpreise\n\nMerksatz:\n👉 VORHER ALLES KLÄREN – DANN IM GESPRÄCH NICHT ÜBERRASCHT WERDEN."},
    {q:"Wie erstellt man eine Agenda für eine Verhandlung?", a:"Eine Agenda strukturiert den Ablauf der Verhandlung.\n\nTypischer Aufbau:\n1. Begrüßung und Vorstellung\n2. Ziel und Anlass der Verhandlung\n3. Darstellung der aktuellen Situation\n4. Sichtweisen beider Parteien\n5. relevante Daten und Fakten\n6. Probleme bzw. Änderungsbedarf\n7. eigentliche Verhandlung/Lösungsfindung\n8. Vereinbarung\n9. nächste Schritte\n10. Protokollierung und Verabschiedung\n\nMerksatz:\n👉 ERST SITUATION → DANN PROBLEM → DANN LÖSUNG → DANN VEREINBARUNG"},
    {q:"Wie formuliert man gute Verhandlungsziele?", a:"Ziele sollten:\n• konkret\n• realistisch\n• nachvollziehbar\n• messbar\n• situationsbezogen\nsein.\n\nBeispiel:\nNicht:\n„Wir wollen einen besseren Preis.“\n\nBesser:\n„Wir wollen die angekündigte Preiserhöhung vermeiden.“\n\nOder:\n„Wir streben einen maximalen Einkaufspreis von 785.000 € an.“\n\nMerksatz:\n👉 JE KONKRETER DAS ZIEL, DESTO BESSER DIE VERHANDLUNGSFÜHRUNG."},
    {q:"Wie entwickelt man einen Argumentationsleitfaden?", a:"Ein Argumentationsleitfaden legt fest, mit welchen Argumenten du deine Ziele erreichen möchtest.\n\nDabei solltest du:\n1. Ziel nennen\n2. Argument dafür entwickeln\n3. Daten/Fakten verwenden\n4. Nutzen für den Lieferanten herausstellen\n5. mögliche Einwände berücksichtigen\n6. Gegenargument vorbereiten\n7. Alternative Lösung anbieten\n\nBeispiel:\nZiel: Preiserhöhung vermeiden\n\nArgumentation:\n• eigene Nachkalkulation der Kostenelemente vorlegen\n• tatsächliche Kostenentwicklung prüfen\n• auf zusätzliche Kosten durch Qualitätsprobleme hinweisen\n• auf Lieferprobleme hinweisen\n• gemeinsame Optimierungsmöglichkeiten suchen\n• alternative Rohstoffe oder Produkte prüfen\n\nMerksatz:\n👉 ARGUMENT = FAKT + BEGRÜNDUNG + NUTZEN"},
    {q:"Wie geht man mit Gegenargumenten des Lieferanten um?", a:"Gegenargumente sollten vor der Verhandlung vorbereitet werden.\n\nBeispiel:\nLieferant:\n„Unsere Materialkosten sind um 10 % gestiegen.“\n\nEinkäufer:\n„Welche Kostenelemente haben sich konkret in welchem Umfang erhöht?“\n\nDanach können objektive Daten, Marktpreise oder eigene Kalkulationen herangezogen werden.\n\nWichtig ist: nicht sofort persönlich oder emotional reagieren, sondern auf die Sachebene zurückführen.\n\nMerksatz:\n👉 EINWAND NICHT ABWEHREN – HINTERFRAGEN UND SACHLICH BEARBEITEN."},
    {q:"Welche Verhandlungsstile gibt es?", a:"In den Prüfungen werden insbesondere drei Stile unterschieden:\n\nWeich\n• Beziehung steht im Vordergrund\n• Vertrauen\n• Bereitschaft zu Zugeständnissen\n• Konflikte werden eher vermieden\n• eigene Position wird leichter aufgegeben\n\nHart\n• Gegnerorientierung\n• eigene Position durchsetzen\n• starker Druck\n• Misstrauen\n• Drohungen möglich\n• Sieg-Niederlage-Denken\n\nSachbezogen / interessenbezogen\n• Menschen und Probleme trennen\n• Interessen statt Positionen betrachten\n• gemeinsame Lösungen suchen\n• objektive Kriterien verwenden\n• langfristige Zusammenarbeit ermöglichen\n\nMerksatz:\n👉 WEICH = BEZIEHUNG | HART = POSITION | SACHBEZOGEN = INTERESSEN"},
    {q:"Was ist die sachbezogene Verhandlung nach dem Harvard-Konzept?", a:"Das Harvard-Konzept basiert auf vier Grundprinzipien:\n\n1. Menschen und Probleme voneinander trennen\nDie Person ist nicht das Problem.\n\n2. Interessen statt Positionen betrachten\nNicht:\n„Ich will 5 % Rabatt.“\nSondern:\n„Warum benötigen Sie diesen Preis? Welche Interessen stehen dahinter?“\n\n3. Möglichkeiten zum beiderseitigen Vorteil entwickeln\nGemeinsam nach Lösungen suchen, von denen beide profitieren.\n\n4. Objektive Kriterien verwenden\nZum Beispiel:\n• Marktpreise\n• Branchenindizes\n• Destatis-Daten\n• Marktberichte\n• Rohstoffpreisentwicklung\n\nMerksatz:\n👉 HARVARD = MENSCHEN TRENNEN → INTERESSEN → WIN-WIN → OBJEKTIVE KRITERIEN"},
    {q:"Was ist der Unterschied zwischen Position und Interesse?", a:"Position = Was will jemand?\nInteresse = Warum will er es?\n\nBeispiel:\nLieferant:\n„Eine Preissenkung ist nicht möglich.“\nDas ist die Position.\n\nMöglicherweise steckt dahinter:\n„Wir benötigen eine bestimmte Marge, weil unsere Produktionskosten gestiegen sind.“\nDas ist das Interesse.\n\nWenn du das Interesse kennst, kannst du nach Alternativen suchen.\nZum Beispiel:\n• längere Vertragslaufzeit\n• größere Mengen\n• bessere Planung\n• Zahlungsbedingungen\n• Prozessoptimierung\n\nMerksatz:\n👉 POSITION = WAS? | INTERESSE = WARUM?"},
    {q:"Wie begegnet man einem harten, positionsbezogenen Verhandlungspartner?", a:"Positionsbezogener Argumentation begegnet man mit sachbezogener Argumentation.\n\nDabei:\n• ruhig bleiben\n• nicht auf persönliche Angriffe eingehen\n• Interessen herausarbeiten\n• Fragen stellen\n• Gemeinsamkeiten suchen\n• objektive Kriterien verwenden\n• Alternativen entwickeln\n• langfristige Zusammenarbeit berücksichtigen\n\nBeispiel:\nLieferant:\n„10 % mehr oder wir liefern nicht.“\n\nNicht:\n„Dann können wir ja auch woanders kaufen!“\n\nBesser:\n„Lassen Sie uns zunächst die einzelnen Kostenelemente betrachten und anhand objektiver Marktdaten prüfen, welcher Teil der Erhöhung tatsächlich gerechtfertigt ist.“\n\nMerksatz:\n👉 HARTER PARTNER → SACHLICH BLEIBEN"},
    {q:"Was ist die Steigerungsmethode?", a:"Bei der Steigerungsmethode werden die Argumente schrittweise aufgebaut:\n\n👉 schwächstes Argument → stärkeres Argument → stärkstes Argument\n\nMan beginnt also nicht direkt mit dem stärksten Argument.\n\nBeispiel Preisverhandlung:\n1. langfristige Geschäftsbeziehung\n2. größere Mengen\n3. Wettbewerbsangebote\n4. Marktpreise\n5. konkrete Alternative zu einem anderen Lieferanten\n\nMerksatz:\n👉 STEIGERUNG = SCHWACH → STÄRKER → STÄRKSTES ARGUMENT"},
    {q:"Was ist die Salamitaktik?", a:"Bei der Salamitaktik wird das große Verhandlungsziel in viele kleine Teilziele zerlegt.\n\nMan verhandelt also Schritt für Schritt.\n\nBeispiel:\nZiel: 8 % Einsparung\n\nNicht sofort:\n„Geben Sie uns 8 % Rabatt.“\n\nSondern beispielsweise:\n• 2 % über Mengenbündelung\n• 1 % über Zahlungsbedingungen\n• 2 % über Logistikoptimierung\n• 1 % über Vertragslaufzeit\n• 2 % über Preisnachlass\n\nZusammen ergeben die kleinen Schritte das Gesamtziel.\n\nMerksatz:\n👉 SALAMI = GROSSES ZIEL IN KLEINE SCHEIBEN SCHNEIDEN."},
    {q:"Welche weiteren Verhandlungsansätze kann man einsetzen?", a:"Die Prüfungen zeigen, dass man nicht nur über den Preis verhandeln sollte.\n\nMögliche Hebel:\n• langfristige Lieferantenbeziehung\n• größere Mengen\n• Rahmenvertrag\n• Lieferbedingungen\n• Zahlungsbedingungen\n• EDI-Anbindung\n• Katalogsystem\n• Abrufaufträge\n• Qualität\n• Lieferzeiten\n• alternative Rohstoffe\n• alternative Produkte\n• Prozessoptimierung\n• gemeinsame Entwicklung\n• Businessplan\n\nMerksatz:\n👉 NICHT NUR ÜBER PREIS VERHANDELN – DAS GESAMTPAKET NUTZEN."},
    {q:"Wie kann man bei einer Preiserhöhung argumentieren?", a:"Eine Preiserhöhung sollte nicht einfach akzeptiert, sondern sachlich analysiert werden.\n\nMögliche Argumente:\n• Kostenentwicklung überprüfen\n• Materialkosten analysieren\n• Lohnkosten analysieren\n• Marktpreise vergleichen\n• Wettbewerbsangebote heranziehen\n• eigene Mehrkosten durch schlechte Qualität berücksichtigen\n• Lieferprobleme berücksichtigen\n• Mengensteigerungen anbieten\n• längere Vertragslaufzeit anbieten\n• alternative Rohstoffe prüfen\n• Prozesse gemeinsam optimieren\n\nMerksatz:\n👉 PREISERHÖHUNG = KOSTEN PRÜFEN → MARKT VERGLEICHEN → GEGENLEISTUNG ANBIETEN"},
    {q:"Was sollte man bei einer langfristigen Lieferantenbeziehung beachten?", a:"Bei einer langfristigen Beziehung ist nicht immer die kurzfristig härteste Preisforderung sinnvoll.\n\nMan kann beispielsweise anbieten:\n• langfristigen Vertrag\n• Mengenplanung\n• Forecasts\n• gemeinsame Prozessoptimierung\n• EDI-Anbindung\n• gemeinsame Produktentwicklung\n• Businessplan\n• Mengenbündelung\n\nDafür können bessere Preise oder Konditionen vereinbart werden.\n\nMerksatz:\n👉 LANGFRISTIGE BEZIEHUNG = NICHT NUR PREIS, SONDERN GESAMTNUTZEN."},
    {q:"Was gehört nach der Verhandlung?", a:"Eine Verhandlung ist nicht beendet, sobald beide Seiten „Ja“ sagen.\n\nWichtig sind:\n• Ergebnis schriftlich festhalten\n• Vereinbarungen dokumentieren\n• Verantwortlichkeiten festlegen\n• nächste Schritte definieren\n• Termine festlegen\n• Vertrag anpassen\n• Umsetzung kontrollieren\n\nMerksatz:\n👉 VERHANDELT ≠ ERLEDIGT – ERGEBNIS DOKUMENTIEREN!"},
    {q:"Was sind typische Ziele einer Verhandlung im Einkauf?", a:"Typische Ziele sind die Verbesserung von Preisen und Konditionen, die Vermeidung von Preiserhöhungen, Verbesserung von Qualität und Lieferzuverlässigkeit, Abschluss von Rahmenverträgen sowie die Sicherung einer langfristigen Zusammenarbeit.\n\nBeispiel:\nPreiserhöhung vermeiden, Qualitätsabweichungen reduzieren und Lieferzuverlässigkeit erhöhen.\n\nMerksatz:\n👉 ZIEL = Was soll nach der Verhandlung besser sein?"},
    {q:"Wie bereitet man eine Verhandlung systematisch vor?", a:"Die Vorbereitung erfolgt inhaltlich, personell und organisatorisch. Inhaltlich werden Ziele, Argumente, Gegenargumente, Alternativen und Strategie vorbereitet. Personell werden Teilnehmer, Interessen und Verhaltensweisen analysiert. Organisatorisch werden Ort, Termin, Dauer, Unterlagen und Ablauf festgelegt.\n\nBeispiel:\nVor einer Lieferantenverhandlung werden Preisziel, Argumente, Lieferantenziele, Teilnehmer, Termin und Agenda festgelegt.\n\nMerksatz:\n👉 INHALTLICH + PERSONELL + ORGANISATORISCH"},
    {q:"Welche Informationen sollte ein Einkäufer vor einer Verhandlung über den Lieferanten sammeln?", a:"Zum Beispiel Marktstärke, Unternehmensdaten, Kapazitätsauslastung, wirtschaftliche Situation, Interessen und Ziele des Lieferanten, Verhandlungserfahrung, Verhandlungsstil sowie die eigene und die fremde Verhandlungsmacht.\n\nBeispiel:\nIst der Lieferant stark von den Aufträgen des eigenen Unternehmens abhängig, kann dies die eigene Verhandlungsposition stärken.\n\nMerksatz:\n👉 WISSEN SCHAFFT VERHANDLUNGSMACHT."},
    {q:"Welche Inhalte sollte eine Verhandlungscheckliste enthalten?", a:"Verhandlungsziele, Ausgangsforderung, Argumente, mögliche Einwände, Ziele des Lieferanten, Verhandlungsmacht, Alternativen, Verhandlungsstrategie, Teilnehmer, Termin, Ort, Unterlagen und relevante Marktdaten.\n\nBeispiel:\nVor einer Preisverhandlung werden Wettbewerbsangebote, Rohstoffpreise und mögliche Gegenargumente vorbereitet.\n\nMerksatz:\n👉 VORBEREITEN, WAS IM GESPRÄCH PASSIEREN KÖNNTE."},
    {q:"Wie sollte eine Agenda für eine Lieferantenverhandlung aufgebaut sein?", a:"Begrüßung und Vorstellung, Ziel und Anlass, Situationsdarstellung, relevante Daten und Probleme, Sichtweisen der Parteien, Lösungsfindung, Vereinbarung, nächste Schritte und Protokollierung.\n\nBeispiel:\n09:00 Begrüßung → 09:15 Situationsdarstellung → 10:30 Lösungsfindung → 12:30 Vertragsvereinbarung → 13:00 Protokollierung.\n\nMerksatz:\n👉 SITUATION → PROBLEM → LÖSUNG → VEREINBARUNG"},
    {q:"Wie formuliert man gute Verhandlungsziele?", a:"Ziele sollten konkret, realistisch, nachvollziehbar und möglichst messbar formuliert werden.\n\nBeispiel:\nNicht „besseren Preis erzielen“, sondern „einen maximalen Einkaufspreis von 785.000 € vereinbaren“.\n\nMerksatz:\n👉 KONKRETES ZIEL STATT ALLGEMEINER WUNSCH."},
    {q:"Wie erstellt man einen Argumentationsleitfaden für eine Verhandlung?", a:"Zunächst wird das Ziel festgelegt. Danach werden passende Argumente, Fakten und Vorteile für den Lieferanten bestimmt. Zusätzlich werden mögliche Einwände und passende Gegenargumente vorbereitet.\n\nBeispiel:\nZiel: Preiserhöhung vermeiden → Kostenentwicklung prüfen → Marktpreise vergleichen → eigene Mehrkosten durch Qualitätsprobleme aufzeigen → gemeinsame Lösung anbieten.\n\nMerksatz:\n👉 ZIEL → ARGUMENT → FAKT → NUTZEN → EINWAND → LÖSUNG"},
    {q:"Wie sollte man mit Einwänden des Verhandlungspartners umgehen?", a:"Einwände sollten sachlich aufgenommen, hinterfragt und anhand von Fakten geprüft werden. Anschließend sollte eine passende Gegenargumentation oder alternative Lösung entwickelt werden.\n\nBeispiel:\nLieferant: „Die Materialkosten sind um 10 % gestiegen.“\nEinkäufer: „Welche Materialkosten sind konkret um welchen Betrag gestiegen?“\n\nMerksatz:\n👉 EINWAND HINTERFRAGEN STATT EMOTIONAL ABWEHREN."},
    {q:"Welche Verhandlungsstile gibt es?", a:"Man unterscheidet insbesondere weiches, hartes und sachbezogenes bzw. interessenbezogenes Verhandeln.\n\nBeispiel:\nWeich = Beziehung im Vordergrund.\nHart = eigene Position durchsetzen.\nSachbezogen = Interessen analysieren und gemeinsame Lösungen suchen.\n\nMerksatz:\n👉 WEICH = BEZIEHUNG | HART = POSITION | SACHBEZOGEN = INTERESSE"},
    {q:"Was sind die vier Grundprinzipien des Harvard-Konzepts?", a:"1. Menschen und Probleme voneinander trennen.\n2. Interessen statt Positionen betrachten.\n3. Möglichkeiten zum beiderseitigen Vorteil entwickeln.\n4. Objektive Kriterien verwenden.\n\nBeispiel:\nStatt über „5 % Rabatt“ zu streiten, werden die Interessen hinter dem Preis analysiert und anhand von Marktpreisen eine Lösung entwickelt.\n\nMerksatz:\n👉 MENSCHEN – INTERESSEN – WIN-WIN – OBJEKTIV"},
    {q:"Was ist der Unterschied zwischen Position und Interesse?", a:"Die Position beschreibt, was jemand fordert. Das Interesse beschreibt, warum er diese Forderung stellt.\n\nBeispiel:\nPosition: „Ich kann den Preis nicht senken.“\nInteresse: „Ich muss eine bestimmte Marge erreichen.“\n\nMerksatz:\n👉 POSITION = WAS? | INTERESSE = WARUM?"},
    {q:"Wie begegnet man einem harten, positionsbezogenen Verhandlungspartner?", a:"Mit sachbezogener Argumentation. Man trennt Personen und Probleme, hinterfragt Interessen, verwendet objektive Kriterien, bleibt sachlich und entwickelt alternative Lösungen.\n\nBeispiel:\nEine geforderte Preiserhöhung wird anhand von Rohstoffpreisen, Branchenwerten und eigenen Kosten analysiert.\n\nMerksatz:\n👉 HARTER PARTNER → SACHLICH BLEIBEN."},
    {q:"Was ist die Steigerungsmethode?", a:"Bei der Steigerungsmethode werden Argumente schrittweise aufgebaut. Man beginnt mit dem schwächeren Argument und endet mit dem stärksten Argument.\n\nBeispiel:\nLangfristige Zusammenarbeit → Mengensteigerung → Wettbewerbsangebote → Marktpreise → konkrete Alternativen.\n\nMerksatz:\n👉 SCHWACH → STÄRKER → STÄRKSTES ARGUMENT"},
    {q:"Was ist die Salamitaktik?", a:"Das Gesamtziel wird in mehrere kleine Teilziele zerlegt und schrittweise verhandelt.\n\nBeispiel:\n8 % Einsparung werden über Mengenbündelung, Zahlungsbedingungen, Logistikoptimierung und Preisnachlass erreicht.\n\nMerksatz:\n👉 GROSSES ZIEL IN KLEINE SCHEIBEN ZERLEGEN."},
    {q:"Welche weiteren Verhandlungsansätze können neben dem Preis eingesetzt werden?", a:"Zum Beispiel langfristige Verträge, Mengenbündelung, Rahmenverträge, bessere Zahlungsbedingungen, Lieferbedingungen, EDI-Anbindung, Qualitätsverbesserungen, Prozessoptimierung oder gemeinsame Produktentwicklung.\n\nBeispiel:\nDer Lieferant erhält einen langfristigen Vertrag und bessere Mengenplanung und gewährt dafür einen günstigeren Einkaufspreis.\n\nMerksatz:\n👉 NICHT NUR PREIS – DAS GESAMTPAKET VERHANDELN."},
    {q:"Wie kann man auf eine angekündigte Preiserhöhung reagieren?", a:"Die Kostenentwicklung des Lieferanten prüfen, Marktpreise und Wettbewerbsangebote vergleichen, eigene Mehrkosten durch Qualitäts- oder Lieferprobleme berücksichtigen und Gegenleistungen bzw. alternative Lösungen anbieten.\n\nBeispiel:\nStatt 10 % Preiserhöhung zu akzeptieren, werden Materialkosten, Lohnkosten, Qualitätsprobleme und Lieferverzögerungen analysiert.\n\nMerksatz:\n👉 KOSTEN PRÜFEN → MARKT VERGLEICHEN → LÖSUNG VERHANDELN"},
    {q:"Welche Vorteile kann eine langfristige Lieferantenbeziehung in einer Verhandlung bieten?", a:"Eine langfristige Beziehung kann dem Lieferanten Planungssicherheit geben. Im Gegenzug können bessere Preise, Konditionen oder zusätzliche Leistungen vereinbart werden.\n\nBeispiel:\nDer Einkäufer bietet einen zweijährigen Rahmenvertrag an und verhandelt dafür bessere Einkaufspreise.\n\nMerksatz:\n👉 PLANUNGSSICHERHEIT GEGEN BESSERE KONDITIONEN."},
    {q:"Was ist nach Abschluss einer Verhandlung zu beachten?", a:"Das Ergebnis muss schriftlich festgehalten werden. Außerdem sollten Verantwortlichkeiten, nächste Schritte, Termine und die Umsetzung der Vereinbarungen dokumentiert werden.\n\nBeispiel:\nNach der Verhandlung werden der neue Preis, Liefermengen, Lieferzeiten und Verantwortlichkeiten schriftlich im Rahmenvertrag festgehalten.\n\nMerksatz:\n👉 VERHANDELT ≠ ERLEDIGT – DOKUMENTIEREN!"}
  ]
};

const FAV_KEY = "ffe_favorites_v1";
const categoryNames = Object.keys(data);

let currentCategory = null;
let cards = [];
let order = [];
let pos = 0;
let flipped = false;

const homeView = document.getElementById("homeView");
const studyView = document.getElementById("studyView");
const catList = document.getElementById("catList");
const backBtn = document.getElementById("backBtn");
const studyCatName = document.getElementById("studyCatName");
const cardEl = document.getElementById("card");
const cardStage = document.getElementById("cardStage");
const questionText = document.getElementById("questionText");
const answerText = document.getElementById("answerText");
const progressFill = document.getElementById("progressFill");
const progressText = document.getElementById("progressText");
const progressPct = document.getElementById("progressPct");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const shuffleBtn = document.getElementById("shuffleBtn");
const resetBtn = document.getElementById("resetBtn");
const doneMsg = document.getElementById("doneMsg");
const starBtnFront = document.getElementById("starBtnFront");
const starBtnBack = document.getElementById("starBtnBack");
const emptyFav = document.getElementById("emptyFav");
const controls = document.getElementById("controls");
const shuffleRow = document.getElementById("shuffleRow");

function loadFavorites(){
  try{
    const raw = localStorage.getItem(FAV_KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
function saveFavorites(list){
  localStorage.setItem(FAV_KEY, JSON.stringify(list));
}
function favKey(card){
  return card.q;
}
function isFavorite(card){
  if(!card) return false;
  return loadFavorites().some(f => f.q === card.q);
}
function toggleFavorite(card){
  let list = loadFavorites();
  const idx = list.findIndex(f => f.q === card.q);
  if(idx >= 0){
    list.splice(idx, 1);
  }else{
    list.push({q: card.q, a: card.a, source: currentCategory === "Favoriten" ? (card.source || "") : currentCategory});
  }
  saveFavorites(list);
  updateStar();
  // if currently in Favoriten and we removed the last/current, re-render
  if(currentCategory === "Favoriten"){
    openCategory("Favoriten");
  }
}

function buildHome(){
  catList.innerHTML = "";
  categoryNames.forEach(name => {
    const btn = document.createElement("button");
    btn.className = "cat-tile";
    btn.innerHTML = `<span class="cat-label">${name}</span><span class="cat-count">${data[name].length}</span>`;
    btn.addEventListener("click", () => openCategory(name));
    catList.appendChild(btn);
  });

  const hr = document.createElement("hr");
  hr.className = "cat-divider";
  catList.appendChild(hr);

  const favCount = loadFavorites().length;
  const favBtn = document.createElement("button");
  favBtn.className = "cat-tile favorites";
  favBtn.innerHTML = `<span class="cat-label">Favoriten</span><span class="cat-count">${favCount}</span>`;
  favBtn.addEventListener("click", () => openCategory("Favoriten"));
  catList.appendChild(favBtn);
}

function openCategory(name){
  currentCategory = name;
  if(name === "Favoriten"){
    cards = loadFavorites();
  }else{
    cards = data[name];
  }
  order = cards.map((_, i) => i);
  pos = 0;
  flipped = false;

  homeView.classList.add("hidden");
  studyView.classList.add("active");
  studyCatName.textContent = name;

  if(cards.length === 0){
    cardStage.style.display = "none";
    controls.style.display = "none";
    shuffleRow.style.display = "none";
    emptyFav.style.display = "block";
    progressFill.style.width = "0%";
    progressText.textContent = "0 Karten";
    progressPct.textContent = "";
    doneMsg.textContent = "";
    return;
  }

  cardStage.style.display = "";
  controls.style.display = "";
  shuffleRow.style.display = "";
  emptyFav.style.display = "none";
  render();
}

function goHome(){
  currentCategory = null;
  studyView.classList.remove("active");
  homeView.classList.remove("hidden");
  buildHome();
}

function updateStar(){
  if(!cards.length) return;
  const card = cards[order[pos]];
  const active = isFavorite(card);
  [starBtnFront, starBtnBack].forEach(btn => {
    btn.classList.toggle("active", active);
    btn.textContent = active ? "★" : "☆";
  });
}

function render(){
  if(!cards.length) return;
  const idx = order[pos];
  const card = cards[idx];
  questionText.textContent = card.q;
  answerText.textContent = card.a;
  cardEl.classList.remove("flipped");
  flipped = false;

  const total = cards.length;
  progressFill.style.width = ((pos+1)/total*100) + "%";
  progressText.textContent = `Karte ${pos+1} von ${total}`;
  progressPct.textContent = Math.round((pos+1)/total*100) + "%";

  prevBtn.disabled = pos === 0;
  nextBtn.disabled = pos === total - 1;
  doneMsg.textContent = (pos === total - 1) ? "🎉 Letzte Karte erreicht – gut gemacht!" : "";

  updateStar();
}

function flip(){
  if(!cards.length) return;
  flipped = !flipped;
  cardEl.classList.toggle("flipped", flipped);
}

backBtn.addEventListener("click", goHome);

function onStarClick(e){
  e.stopPropagation();
  if(!cards.length) return;
  toggleFavorite(cards[order[pos]]);
}
starBtnFront.addEventListener("click", onStarClick);
starBtnBack.addEventListener("click", onStarClick);

cardEl.addEventListener("click", (e) => {
  if(e.target.closest(".star-btn")) return;
  flip();
});

prevBtn.addEventListener("click", () => {
  if(pos > 0){ pos--; render(); }
});
nextBtn.addEventListener("click", () => {
  if(pos < cards.length - 1){ pos++; render(); }
});

shuffleBtn.addEventListener("click", () => {
  for(let i = order.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  pos = 0;
  render();
});

resetBtn.addEventListener("click", () => {
  order = cards.map((_, i) => i);
  pos = 0;
  render();
});

document.addEventListener("keydown", (e) => {
  if(!studyView.classList.contains("active")) return;
  if(e.key === "ArrowRight") nextBtn.click();
  if(e.key === "ArrowLeft") prevBtn.click();
  if(e.key === " ") { e.preventDefault(); flip(); }
  if(e.key === "Escape") goHome();
});

buildHome();
</script>
</body>
</html>
