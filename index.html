<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fachwirt für Einkauf</title>
<style>
  :root{
    --bg:#f4f5f7;
    --card-front:#2563eb;
    --card-front-2:#1d4ed8;
    --card-back:#ffffff;
    --text-dark:#1f2937;
    --text-light:#ffffff;
    --accent:#2563eb;
    --muted:#6b7280;
    --border:#e5e7eb;
    --star:#fbbf24;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#111318;
      --card-back:#1c1f26;
      --text-dark:#f1f3f5;
      --muted:#9aa1ac;
      --border:#2b2f38;
    }
  }
  :root[data-theme="dark"]{
    --bg:#111318;
    --card-back:#1c1f26;
    --text-dark:#f1f3f5;
    --muted:#9aa1ac;
    --border:#2b2f38;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text-dark);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:24px 16px 40px;
  }

  h1{
    font-size:1.4rem;
    margin:8px 0 4px;
    text-align:center;
  }
  .subtitle{
    color:var(--muted);
    font-size:0.9rem;
    margin-bottom:20px;
    text-align:center;
  }

  /* ===== HOME VIEW ===== */
  #homeView{
    width:100%;
    max-width:520px;
    display:flex;
    flex-direction:column;
    align-items:stretch;
  }
  #homeView.hidden{display:none;}

  .cat-list{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .cat-tile{
    font-family:inherit;
    border:1px solid var(--border);
    background:var(--card-back);
    color:var(--text-dark);
    border-radius:14px;
    padding:18px 20px;
    font-size:1rem;
    font-weight:600;
    cursor:pointer;
    text-align:left;
    display:flex;
    align-items:center;
    justify-content:space-between;
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    box-shadow:0 2px 8px rgba(0,0,0,0.06);
    min-height:64px;
  }
  .cat-tile:active{transform:scale(0.98);}
  .cat-tile:hover{border-color:var(--accent);}
  .cat-tile .cat-count{
    font-size:0.8rem;
    font-weight:500;
    color:var(--muted);
    background:var(--bg);
    padding:4px 10px;
    border-radius:999px;
  }
  .cat-divider{
    border:none;
    border-top:1px solid var(--border);
    margin:8px 0 4px;
  }
  .cat-tile.favorites{
    border-style:dashed;
  }
  .cat-tile.favorites .cat-label::before{
    content:"★ ";
    color:var(--star);
  }

  /* ===== STUDY VIEW ===== */
  #studyView{
    width:100%;
    max-width:520px;
    display:none;
    flex-direction:column;
    align-items:center;
  }
  #studyView.active{display:flex;}

  .study-header{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
    gap:12px;
  }
  .btn-back{
    font-family:inherit;
    border:1px solid var(--border);
    background:var(--card-back);
    color:var(--text-dark);
    border-radius:10px;
    padding:8px 14px;
    font-size:0.9rem;
    font-weight:600;
    cursor:pointer;
    flex-shrink:0;
  }
  .btn-back:active{transform:scale(0.96);}
  .study-cat-name{
    font-size:0.95rem;
    font-weight:600;
    color:var(--muted);
    text-align:right;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .progress-wrap{
    width:100%;
    margin-bottom:18px;
  }
  .progress-bar{
    width:100%;
    height:6px;
    background:var(--border);
    border-radius:99px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--accent);
    border-radius:99px;
    transition:width .3s ease;
  }
  .progress-label{
    display:flex;
    justify-content:space-between;
    font-size:0.8rem;
    color:var(--muted);
    margin-top:6px;
  }

  .card-stage{
    width:100%;
    perspective:1600px;
  }

  .card{
    position:relative;
    width:100%;
    min-height:340px;
    cursor:pointer;
    transform-style:preserve-3d;
    transition:transform .5s cubic-bezier(.4,.2,.2,1);
  }
  .card.flipped{
    transform:rotateY(180deg);
  }

  .face{
    position:absolute;
    inset:0;
    -webkit-backface-visibility:hidden;
    backface-visibility:hidden;
    border-radius:18px;
    padding:28px 24px;
    display:flex;
    flex-direction:column;
    box-shadow:0 8px 24px rgba(0,0,0,0.12);
    overflow-y:auto;
  }

  .face-front{
    background:linear-gradient(145deg, var(--card-front), var(--card-front-2));
    color:var(--text-light);
    justify-content:center;
    align-items:center;
    text-align:center;
  }
  .face-front .tag{
    position:absolute;
    top:16px;
    left:20px;
    font-size:0.75rem;
    letter-spacing:.05em;
    opacity:0.75;
    text-transform:uppercase;
  }
  .face-front .q-text{
    font-size:1.25rem;
    font-weight:600;
    line-height:1.4;
  }
  .face-front .hint{
    margin-top:18px;
    font-size:0.8rem;
    opacity:0.7;
  }

  .face-back{
    background:var(--card-back);
    color:var(--text-dark);
    transform:rotateY(180deg);
    border:1px solid var(--border);
    justify-content:flex-start;
  }
  .face-back .tag{
    font-size:0.75rem;
    letter-spacing:.05em;
    color:var(--accent);
    text-transform:uppercase;
    margin-bottom:10px;
    font-weight:600;
  }
  .a-text{
    font-size:1rem;
    line-height:1.55;
    white-space:pre-wrap;
  }

  /* Star button – inside each face, always top-right */
  .star-btn{
    position:absolute;
    top:12px;
    right:14px;
    z-index:5;
    width:40px;
    height:40px;
    border:none;
    border-radius:50%;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.35rem;
    line-height:1;
    padding:0;
    transition:color .15s ease, background .15s ease, transform .15s ease;
  }
  .face-front .star-btn{
    background:rgba(0,0,0,0.25);
    color:rgba(255,255,255,0.7);
  }
  .face-front .star-btn:hover{background:rgba(0,0,0,0.4);}
  .face-front .star-btn.active{
    color:var(--star);
    background:rgba(0,0,0,0.35);
  }
  .face-back .star-btn{
    background:rgba(0,0,0,0.06);
    color:var(--muted);
  }
  .face-back .star-btn:hover{background:rgba(0,0,0,0.1);}
  .face-back .star-btn.active{
    color:var(--star);
    background:rgba(251,191,36,0.15);
  }
  .star-btn:active{transform:scale(0.9);}

  .controls{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:22px;
  }
  button{
    font-family:inherit;
    border:none;
    border-radius:12px;
    padding:12px 18px;
    font-size:0.95rem;
    font-weight:600;
    cursor:pointer;
    transition:transform .15s ease, opacity .15s ease;
  }
  button:active{transform:scale(0.96);}
  .btn-nav{
    background:var(--card-back);
    color:var(--text-dark);
    border:1px solid var(--border);
    flex:1;
  }
  .btn-nav:disabled{
    opacity:0.4;
    cursor:not-allowed;
  }

  .shuffle-row{
    width:100%;
    display:flex;
    justify-content:center;
    margin-top:14px;
    gap:8px;
  }
  .btn-shuffle{
    background:transparent;
    color:var(--muted);
    border:1px solid var(--border);
    font-size:0.85rem;
    padding:8px 16px;
  }

  .done-msg{
    text-align:center;
    color:var(--muted);
    font-size:0.85rem;
    margin-top:10px;
    min-height:1.2em;
  }

  .empty-fav{
    text-align:center;
    color:var(--muted);
    padding:40px 20px;
    font-size:0.95rem;
    line-height:1.5;
  }

  @media (max-width:480px){
    .card{min-height:380px;}
    .face{padding:22px 18px;}
    .face-front .q-text{font-size:1.1rem;}
    .a-text{font-size:0.95rem;}
  }
</style>
</head>
<body>

<!-- ========== HOME ========== -->
<div id="homeView">
  <h1>📚 Fachwirt für Einkauf</h1>
  <div class="subtitle">Kategorie wählen</div>
  <div class="cat-list" id="catList"><div id="catLoading" style="text-align:center;padding:24px;color:var(--muted);font-size:0.95rem;">Kategorien werden geladen…<br><span style="font-size:0.8rem;">Falls nichts erscheint: Datei in Safari öffnen (Teilen → In Safari öffnen).</span></div></div>
</div>

<!-- ========== STUDY ========== -->
<div id="studyView">
  <div class="study-header">
    <button class="btn-back" id="backBtn">← Zurück</button>
    <div class="study-cat-name" id="studyCatName"></div>
  </div>

  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label">
      <span id="progressText">Karte 1 von 1</span>
      <span id="progressPct">0%</span>
    </div>
  </div>

  <div class="card-stage" id="cardStage">
    <div class="card" id="card">
      <div class="face face-front">
        <button class="star-btn" id="starBtnFront" title="Als Favorit speichern" aria-label="Favorit">☆</button>
        <div class="tag">Frage</div>
        <div class="q-text" id="questionText"></div>
        <div class="hint">Tippen für Antwort</div>
      </div>
      <div class="face face-back">
        <button class="star-btn" id="starBtnBack" title="Als Favorit speichern" aria-label="Favorit">☆</button>
        <div class="tag">Antwort</div>
        <div class="a-text" id="answerText"></div>
      </div>
    </div>
  </div>

  <div class="empty-fav" id="emptyFav" style="display:none;">
    Noch keine Favoriten.<br>Tippe auf den Stern bei einer Karte, um sie hier zu speichern.
  </div>

  <div class="controls" id="controls">
    <button class="btn-nav" id="prevBtn">← Zurück</button>
    <button class="btn-nav" id="nextBtn">Weiter →</button>
  </div>

  <div class="shuffle-row" id="shuffleRow">
    <button class="btn-shuffle" id="shuffleBtn">🔀 Mischen</button>
    <button class="btn-shuffle" id="resetBtn">↺ Von vorne</button>
  </div>

  <div class="done-msg" id="doneMsg"></div>
</div>

<script>
const data = {
  "Recht": [
    {
      "q": "Was versteht man unter dem CISG bzw. UN-Kaufrecht?",
      "a": "Das CISG (UN-Kaufrecht) ist ein internationales Regelwerk für Verträge über den internationalen Warenkauf.\n\nEs regelt insbesondere:\n\n• Vertragsschluss\n• Pflichten von Käufer und Verkäufer\n• Lieferung\n• Kaufpreiszahlung\n• Mängel\n• Vertragsverletzungen\n• Rechtsbehelfe\n• Schadensersatz\n\nBeispiel:\nEin deutsches Unternehmen kauft Waren bei einem französischen Unternehmen.\n\nMerksatz:\n👉 CISG = internationales Kaufrecht für Waren."
    },
    {
      "q": "Wann findet das UN-Kaufrecht grundsätzlich Anwendung?",
      "a": "Sind beide Vertragsparteien in Staaten ansässig, die das UN-Kaufrecht ratifiziert haben, gilt das CISG für den internationalen Warenkauf, sofern es nicht ausdrücklich ausgeschlossen wurde.\n\nBeispiel:\nDeutschland und Frankreich sind CISG-Vertragsstaaten → grundsätzlich CISG.\n\nMerksatz:\n👉 CISG gilt grundsätzlich – Ausschluss muss vereinbart werden."
    },
    {
      "q": "Was regelt Art. 1 CISG?",
      "a": "Art. 1 CISG regelt den Anwendungsbereich des UN-Kaufrechts.\n\nFür die Prüfung wichtig: Liegen die Niederlassungen der Vertragsparteien in verschiedenen CISG-Vertragsstaaten, kann das CISG unmittelbar Anwendung finden.\n\nBeispiel:\nDeutscher Käufer + französischer Verkäufer → grundsätzlich CISG.\n\nMerksatz:\n👉 Art. 1 = Wann gilt CISG?"
    },
    {
      "q": "Was regelt Art. 6 CISG?",
      "a": "Die Vertragsparteien können die Anwendung des CISG ausschließen oder von einzelnen Bestimmungen des CISG abweichen.\n\nBeispiel:\n„Es gilt deutsches Recht unter Ausschluss des CISG.“\n\nMerksatz:\n👉 Art. 6 = CISG kann ausgeschlossen werden."
    },
    {
      "q": "Ein deutscher Käufer möchte mit einem französischen Lieferanten einen Vertrag abschließen. Beide sind sich über das anzuwendende Recht nicht einig. Wie ist die rechtliche Ausgangssituation?",
      "a": "Beide Länder sind Mitglied des UN-Kaufrechtsabkommens. Daher gilt grundsätzlich das CISG, sofern es nicht ausdrücklich ausgeschlossen wird.\n\nMögliche Vertragsgestaltung:\n\n• Vertrag unter Anwendung des CISG\n• oder Vereinbarung eines nationalen Rechts unter Ausschluss des CISG\n\nBeispiel:\n„Es gilt deutsches Recht unter Ausschluss des CISG.“\n\nMerksatz:\n👉 Rechtswahl immer zusammen mit CISG-Ausschluss betrachten."
    },
    {
      "q": "Welche Aufgabe hat das Internationale Privatrecht (IPR)?",
      "a": "Das Internationale Privatrecht bestimmt, welche Rechtsordnung bei einem Sachverhalt mit Auslandsbezug anzuwenden ist.\n\nBeispiel:\nSoll deutsches oder französisches Recht für einen internationalen Kaufvertrag gelten?\n\nMerksatz:\n👉 IPR = Welches Recht gilt?"
    },
    {
      "q": "Welche Bedeutung hat die Rom-I-Verordnung?",
      "a": "Die Rom-I-Verordnung regelt innerhalb der EU das anzuwendende Recht bei vertraglichen Schuldverhältnissen mit internationalem Bezug.\n\nDie Parteien können grundsätzlich eine freie Rechtswahl vereinbaren.\n\nMerksatz:\n👉 Rom I = anwendbares Vertragsrecht."
    },
    {
      "q": "Was regelt Art. 3 Rom I?",
      "a": "Die Vertragsparteien können grundsätzlich das anzuwendende Recht frei wählen.\n\nBeispiel:\n„Es gilt deutsches Recht.“\n\nMerksatz:\n👉 Art. 3 Rom I = freie Rechtswahl."
    },
    {
      "q": "Was passiert, wenn keine Rechtswahl getroffen wurde?",
      "a": "Dann greifen die Regelungen des Art. 4 Rom I zur Bestimmung des anzuwendenden Rechts.\n\nIn der 221e-Musterlösung wird für den dort beschriebenen Fall das Recht des Landes des Lieferers genannt.\n\nMerksatz:\n👉 Keine Rechtswahl → Art. 4 Rom I prüfen."
    },
    {
      "q": "Wie ist die Rechtslage bei einem Lieferanten aus einem CISG-Mitgliedstaat?",
      "a": "Ist der Staat Mitglied des CISG, gilt grundsätzlich das UN-Kaufrecht, sofern dessen Anwendung nicht vertraglich ausgeschlossen wurde.\n\nBeispiel aus der Prüfung:\nVietnam → CISG gilt grundsätzlich.\n\nMerksatz:\n👉 CISG-Mitglied = CISG grundsätzlich beachten."
    },
    {
      "q": "Wie kommt ein Kaufvertrag nach dem CISG grundsätzlich zustande?",
      "a": "Durch Angebot und Annahme.\n\nMerksatz:\n👉 Angebot + Annahme = Vertrag."
    },
    {
      "q": "Was regelt Art. 14 CISG?",
      "a": "Ein Angebot muss nach dem Skript bestimmt sein.\n\nBeispiel:\nEin Angebot enthält konkrete Angaben zu Ware und Preis.\n\nMerksatz:\n👉 Art. 14 = Angebot."
    },
    {
      "q": "Was regelt Art. 16 CISG?",
      "a": "Art. 16 CISG betrifft den Widerruf eines Angebots.\n\nMerksatz:\n👉 Art. 16 = Widerruf des Angebots."
    },
    {
      "q": "Was regelt Art. 18 CISG?",
      "a": "Art. 18 CISG regelt die Annahme eines Angebots. Die Annahme kann auch konkludent erfolgen.\n\nBeispiel:\nDer Käufer nimmt die Lieferung entsprechend dem Angebot an.\n\nMerksatz:\n👉 Art. 18 = Annahme."
    },
    {
      "q": "Was passiert bei einer abändernden Annahme nach Art. 19 CISG?",
      "a": "Eine Annahmeerklärung, die Änderungen gegenüber dem Angebot enthält, kann als Gegenangebot gelten.\n\nIm Skript wird insbesondere auf widersprechende AGB hingewiesen.\n\nBeispiel:\nLieferant bietet 100 € an, Käufer antwortet mit 95 € → keine unveränderte Annahme.\n\nMerksatz:\n👉 Art. 19 = Abänderung der Annahme kann Gegenangebot sein."
    },
    {
      "q": "Welche wesentlichen Pflichten hat der Verkäufer nach dem CISG?",
      "a": "• Ware liefern\n• richtige Menge und Qualität liefern\n• erforderliche Dokumente übergeben\n• vereinbarte Verpackung einhalten\n• Eigentum an der Ware übertragen\n\nMerksatz:\n👉 Verkäufer = liefern + Dokumente + Konformität."
    },
    {
      "q": "Welche wesentlichen Pflichten hat der Käufer nach dem CISG?",
      "a": "• Kaufpreis zahlen\n• Ware abnehmen\n• Ware untersuchen\n• Mängel rechtzeitig anzeigen\n\nMerksatz:\n👉 Käufer = zahlen + abnehmen + prüfen + rügen."
    },
    {
      "q": "Wann entspricht die Ware dem Vertrag nach Art. 35 CISG?",
      "a": "Die Ware muss insbesondere der vereinbarten Qualität und Beschreibung entsprechen und die vereinbarte Verpackung erfüllen.\n\nBeispiel:\nBestellt sind 99,9 % Reinheit, geliefert werden nur 98 % → Vertragsabweichung.\n\nMerksatz:\n👉 Art. 35 = Vertragsgemäßheit der Ware."
    },
    {
      "q": "Was regelt Art. 38 CISG?",
      "a": "Der Käufer muss die Ware innerhalb einer angemessenen Frist untersuchen.\n\nBeispiel:\nEin Unternehmen erhält eine Lieferung und überprüft die Ware zeitnah auf erkennbare Mängel.\n\nMerksatz:\n👉 Art. 38 = untersuchen."
    },
    {
      "q": "Was regelt Art. 39 CISG?",
      "a": "Der Käufer muss einen festgestellten Mangel dem Verkäufer innerhalb einer angemessenen Frist anzeigen. Erfolgt die Mängelrüge nicht rechtzeitig, können Rechte verloren gehen.\n\nDas Skript nennt außerdem eine absolute Ausschlussfrist von grundsätzlich zwei Jahren ab Ablieferung, sofern keine Garantie besteht.\n\nBeispiel:\nDer Käufer stellt einen Mangel fest, informiert den Verkäufer aber erst Monate später.\n\nMerksatz:\n👉 Art. 38 = prüfen. Art. 39 = rügen."
    },
    {
      "q": "Wann kann der Käufer den Vertrag nach Art. 49 CISG aufheben?",
      "a": "Bei einer wesentlichen Vertragsverletzung bzw. unter den im CISG vorgesehenen Voraussetzungen.\n\nBeispiel:\nEine erhebliche Falschlieferung macht die vereinbarte Verwendung der Ware unmöglich.\n\nMerksatz:\n👉 Art. 49 = Vertragsaufhebung durch Käufer."
    },
    {
      "q": "Wann liegt nach dem CISG eine wesentliche Vertragsverletzung vor?",
      "a": "Eine Vertragsverletzung ist wesentlich, wenn sie für die andere Partei einen solchen Nachteil verursacht, dass ihr im Wesentlichen entgeht, was sie nach dem Vertrag hätte erwarten dürfen.\n\nBeispiel:\nMassive Qualitätsmängel oder eine Falschlieferung.\n\nMerksatz:\n👉 Wesentlich = Vertragserwartung wird im Wesentlichen verfehlt."
    },
    {
      "q": "Wie unterscheiden sich einfache und wesentliche Vertragsverletzungen?",
      "a": "Einfache Vertragsverletzung:\nz. B. leichte Verspätung oder geringfügige Qualitätsabweichung.\n\nWesentliche Vertragsverletzung:\nz. B. massive Qualitätsmängel, Falschlieferung oder erhebliche Verspätung.\n\nBei einer wesentlichen Vertragsverletzung kann die Vertragsaufhebung möglich sein.\n\nMerksatz:\n👉 Nicht jede Vertragsverletzung berechtigt automatisch zur Aufhebung."
    },
    {
      "q": "Welche Rechte kann der Käufer bei einer Vertragsverletzung des Verkäufers haben?",
      "a": "• Ersatzlieferung\n• Nachbesserung\n• Minderung\n• Schadensersatz\n• bei wesentlicher Vertragsverletzung Vertragsaufhebung\n\nMerksatz:\n👉 Nacherfüllung – Minderung – Schadenersatz – Aufhebung."
    },
    {
      "q": "Was regelt das CISG zum Schadensersatz?",
      "a": "Bei einer Vertragsverletzung kann Schadensersatz verlangt werden. Das Skript nennt dabei direkten und indirekten Schaden einschließlich entgangenem Gewinn.\n\nMerksatz:\n👉 Vertragsverletzung + nachweisbarer Schaden → Schadensersatz prüfen."
    },
    {
      "q": "Welche Bedeutung haben Art. 74–77 CISG?",
      "a": "Diese Artikel regeln den Schadensersatz und die Schadensberechnung.\n\nMerksatz:\n👉 74–77 = Schadensersatz/Schadensberechnung."
    },
    {
      "q": "Welche Bedeutung hat Art. 79 CISG?",
      "a": "Art. 79 betrifft die Befreiung von der Schadensersatzpflicht aufgrund eines Hinderungsgrundes, beispielsweise bei bestimmten Fällen höherer Gewalt.\n\nWichtig aus dem Skript: Die Befreiung betrifft den Schadensersatz, nicht automatisch alle anderen Rechtsbehelfe.\n\nBeispiel:\nEine Naturkatastrophe verhindert die Produktion.\n\nMerksatz:\n👉 Art. 79 = Befreiung von Schadensersatz unter bestimmten Voraussetzungen."
    },

const FAV_KEY = "ffe_favorites_v1";
const categoryNames = Object.keys(data);

let currentCategory = null;
let cards = [];
let order = [];
let pos = 0;
let flipped = false;

const homeView = document.getElementById("homeView");
const studyView = document.getElementById("studyView");
const catList = document.getElementById("catList");
const backBtn = document.getElementById("backBtn");
const studyCatName = document.getElementById("studyCatName");
const cardEl = document.getElementById("card");
const cardStage = document.getElementById("cardStage");
const questionText = document.getElementById("questionText");
const answerText = document.getElementById("answerText");
const progressFill = document.getElementById("progressFill");
const progressText = document.getElementById("progressText");
const progressPct = document.getElementById("progressPct");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const shuffleBtn = document.getElementById("shuffleBtn");
const resetBtn = document.getElementById("resetBtn");
const doneMsg = document.getElementById("doneMsg");
const starBtnFront = document.getElementById("starBtnFront");
const starBtnBack = document.getElementById("starBtnBack");
const emptyFav = document.getElementById("emptyFav");
const controls = document.getElementById("controls");
const shuffleRow = document.getElementById("shuffleRow");

function loadFavorites(){
  try{
    const raw = localStorage.getItem(FAV_KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
function saveFavorites(list){
  localStorage.setItem(FAV_KEY, JSON.stringify(list));
}
function favKey(card){
  return card.q;
}
function isFavorite(card){
  if(!card) return false;
  return loadFavorites().some(f => f.q === card.q);
}
function toggleFavorite(card){
  let list = loadFavorites();
  const idx = list.findIndex(f => f.q === card.q);
  if(idx >= 0){
    list.splice(idx, 1);
  }else{
    list.push({q: card.q, a: card.a, source: currentCategory === "Favoriten" ? (card.source || "") : currentCategory});
  }
  saveFavorites(list);
  updateStar();
  // if currently in Favoriten and we removed the last/current, re-render
  if(currentCategory === "Favoriten"){
    openCategory("Favoriten");
  }
}

function buildHome(){
  catList.innerHTML = "";
  categoryNames.forEach(name => {
    const btn = document.createElement("button");
    btn.className = "cat-tile";
    btn.innerHTML = `<span class="cat-label">${name}</span><span class="cat-count">${data[name].length}</span>`;
    btn.addEventListener("click", () => openCategory(name));
    catList.appendChild(btn);
  });

  const hr = document.createElement("hr");
  hr.className = "cat-divider";
  catList.appendChild(hr);

  const favCount = loadFavorites().length;
  const favBtn = document.createElement("button");
  favBtn.className = "cat-tile favorites";
  favBtn.innerHTML = `<span class="cat-label">Favoriten</span><span class="cat-count">${favCount}</span>`;
  favBtn.addEventListener("click", () => openCategory("Favoriten"));
  catList.appendChild(favBtn);
}

function openCategory(name){
  currentCategory = name;
  if(name === "Favoriten"){
    cards = loadFavorites();
  }else{
    cards = data[name];
  }
  order = cards.map((_, i) => i);
  pos = 0;
  flipped = false;

  homeView.classList.add("hidden");
  studyView.classList.add("active");
  studyCatName.textContent = name;

  if(cards.length === 0){
    cardStage.style.display = "none";
    controls.style.display = "none";
    shuffleRow.style.display = "none";
    emptyFav.style.display = "block";
    progressFill.style.width = "0%";
    progressText.textContent = "0 Karten";
    progressPct.textContent = "";
    doneMsg.textContent = "";
    return;
  }

  cardStage.style.display = "";
  controls.style.display = "";
  shuffleRow.style.display = "";
  emptyFav.style.display = "none";
  render();
}

function goHome(){
  currentCategory = null;
  studyView.classList.remove("active");
  homeView.classList.remove("hidden");
  buildHome();
}

function updateStar(){
  if(!cards.length) return;
  const card = cards[order[pos]];
  const active = isFavorite(card);
  [starBtnFront, starBtnBack].forEach(btn => {
    btn.classList.toggle("active", active);
    btn.textContent = active ? "★" : "☆";
  });
}

function render(){
  if(!cards.length) return;
  const idx = order[pos];
  const card = cards[idx];
  questionText.textContent = card.q;
  answerText.textContent = card.a;
  cardEl.classList.remove("flipped");
  flipped = false;

  const total = cards.length;
  progressFill.style.width = ((pos+1)/total*100) + "%";
  progressText.textContent = `Karte ${pos+1} von ${total}`;
  progressPct.textContent = Math.round((pos+1)/total*100) + "%";

  prevBtn.disabled = pos === 0;
  nextBtn.disabled = pos === total - 1;
  doneMsg.textContent = (pos === total - 1) ? "🎉 Letzte Karte erreicht – gut gemacht!" : "";

  updateStar();
}

function flip(){
  if(!cards.length) return;
  flipped = !flipped;
  cardEl.classList.toggle("flipped", flipped);
}

backBtn.addEventListener("click", goHome);

function onStarClick(e){
  e.stopPropagation();
  if(!cards.length) return;
  toggleFavorite(cards[order[pos]]);
}
starBtnFront.addEventListener("click", onStarClick);
starBtnBack.addEventListener("click", onStarClick);

cardEl.addEventListener("click", (e) => {
  if(e.target.closest(".star-btn")) return;
  flip();
});

prevBtn.addEventListener("click", () => {
  if(pos > 0){ pos--; render(); }
});
nextBtn.addEventListener("click", () => {
  if(pos < cards.length - 1){ pos++; render(); }
});

shuffleBtn.addEventListener("click", () => {
  for(let i = order.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  pos = 0;
  render();
});

resetBtn.addEventListener("click", () => {
  order = cards.map((_, i) => i);
  pos = 0;
  render();
});

document.addEventListener("keydown", (e) => {
  if(!studyView.classList.contains("active")) return;
  if(e.key === "ArrowRight") nextBtn.click();
  if(e.key === "ArrowLeft") prevBtn.click();
  if(e.key === " ") { e.preventDefault(); flip(); }
  if(e.key === "Escape") goHome();
});

try {
  buildHome();
  const loading = document.getElementById("catLoading");
  if (loading) loading.remove();
} catch (err) {
  const list = document.getElementById("catList");
  if (list) {
    list.innerHTML = '<div style="padding:20px;color:#ef4444;background:rgba(239,68,68,0.1);border-radius:12px;font-size:0.9rem;"><strong>Fehler beim Laden</strong><br>' + (err && err.message ? err.message : String(err)) + '<br><br>Bitte die Datei in <strong>Safari</strong> öffnen:<br>Teilen-Button → „In Safari öffnen“.</div>';
  }
  console.error(err);
}
</script>
</body>
</html>
