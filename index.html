<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fachwirt für Einkauf</title>
<style>
  :root{
    --bg:#f4f5f7;
    --card-front:#2563eb;
    --card-front-2:#1d4ed8;
    --card-back:#ffffff;
    --text-dark:#1f2937;
    --text-light:#ffffff;
    --accent:#2563eb;
    --muted:#6b7280;
    --border:#e5e7eb;
    --star:#fbbf24;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#111318;
      --card-back:#1c1f26;
      --text-dark:#f1f3f5;
      --muted:#9aa1ac;
      --border:#2b2f38;
    }
  }
  :root[data-theme="dark"]{
    --bg:#111318;
    --card-back:#1c1f26;
    --text-dark:#f1f3f5;
    --muted:#9aa1ac;
    --border:#2b2f38;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text-dark);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:24px 16px 40px;
  }

  h1{
    font-size:1.4rem;
    margin:8px 0 4px;
    text-align:center;
  }
  .subtitle{
    color:var(--muted);
    font-size:0.9rem;
    margin-bottom:20px;
    text-align:center;
  }

  /* ===== HOME VIEW ===== */
  #homeView{
    width:100%;
    max-width:520px;
    display:flex;
    flex-direction:column;
    align-items:stretch;
  }
  #homeView.hidden{display:none;}

  .cat-list{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .cat-tile{
    font-family:inherit;
    border:1px solid var(--border);
    background:var(--card-back);
    color:var(--text-dark);
    border-radius:14px;
    padding:18px 20px;
    font-size:1rem;
    font-weight:600;
    cursor:pointer;
    text-align:left;
    display:flex;
    align-items:center;
    justify-content:space-between;
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    box-shadow:0 2px 8px rgba(0,0,0,0.06);
    min-height:64px;
  }
  .cat-tile:active{transform:scale(0.98);}
  .cat-tile:hover{border-color:var(--accent);}
  .cat-tile .cat-count{
    font-size:0.8rem;
    font-weight:500;
    color:var(--muted);
    background:var(--bg);
    padding:4px 10px;
    border-radius:999px;
  }
  .cat-divider{
    border:none;
    border-top:1px solid var(--border);
    margin:8px 0 4px;
  }
  .cat-tile.favorites{
    border-style:dashed;
  }
  .cat-tile.favorites .cat-label::before{
    content:"★ ";
    color:var(--star);
  }

  /* ===== STUDY VIEW ===== */
  #studyView{
    width:100%;
    max-width:520px;
    display:none;
    flex-direction:column;
    align-items:center;
  }
  #studyView.active{display:flex;}

  .study-header{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
    gap:12px;
  }
  .btn-back{
    font-family:inherit;
    border:1px solid var(--border);
    background:var(--card-back);
    color:var(--text-dark);
    border-radius:10px;
    padding:8px 14px;
    font-size:0.9rem;
    font-weight:600;
    cursor:pointer;
    flex-shrink:0;
  }
  .btn-back:active{transform:scale(0.96);}
  .study-cat-name{
    font-size:0.95rem;
    font-weight:600;
    color:var(--muted);
    text-align:right;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .progress-wrap{
    width:100%;
    margin-bottom:18px;
  }
  .progress-bar{
    width:100%;
    height:6px;
    background:var(--border);
    border-radius:99px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--accent);
    border-radius:99px;
    transition:width .3s ease;
  }
  .progress-label{
    display:flex;
    justify-content:space-between;
    font-size:0.8rem;
    color:var(--muted);
    margin-top:6px;
  }

  .card-stage{
    width:100%;
    perspective:1600px;
  }

  .card{
    position:relative;
    width:100%;
    min-height:340px;
    cursor:pointer;
    transform-style:preserve-3d;
    transition:transform .5s cubic-bezier(.4,.2,.2,1);
  }
  .card.flipped{
    transform:rotateY(180deg);
  }

  .face{
    position:absolute;
    inset:0;
    -webkit-backface-visibility:hidden;
    backface-visibility:hidden;
    border-radius:18px;
    padding:28px 24px;
    display:flex;
    flex-direction:column;
    box-shadow:0 8px 24px rgba(0,0,0,0.12);
    overflow-y:auto;
  }

  .face-front{
    background:linear-gradient(145deg, var(--card-front), var(--card-front-2));
    color:var(--text-light);
    justify-content:center;
    align-items:center;
    text-align:center;
  }
  .face-front .tag{
    position:absolute;
    top:16px;
    left:20px;
    font-size:0.75rem;
    letter-spacing:.05em;
    opacity:0.75;
    text-transform:uppercase;
  }
  .face-front .q-text{
    font-size:1.25rem;
    font-weight:600;
    line-height:1.4;
  }
  .face-front .hint{
    margin-top:18px;
    font-size:0.8rem;
    opacity:0.7;
  }

  .face-back{
    background:var(--card-back);
    color:var(--text-dark);
    transform:rotateY(180deg);
    border:1px solid var(--border);
    justify-content:flex-start;
  }
  .face-back .tag{
    font-size:0.75rem;
    letter-spacing:.05em;
    color:var(--accent);
    text-transform:uppercase;
    margin-bottom:10px;
    font-weight:600;
  }
  .a-text{
    font-size:1rem;
    line-height:1.55;
    white-space:pre-wrap;
  }

  /* Star button – sits above the card faces */
  .star-btn{
    position:absolute;
    top:12px;
    right:14px;
    z-index:10;
    width:40px;
    height:40px;
    border:none;
    background:rgba(0,0,0,0.25);
    border-radius:50%;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.35rem;
    color:rgba(255,255,255,0.7);
    transition:color .15s ease, background .15s ease, transform .15s ease;
    line-height:1;
    padding:0;
  }
  .star-btn:hover{background:rgba(0,0,0,0.4);}
  .star-btn.active{
    color:var(--star);
    background:rgba(0,0,0,0.35);
  }
  .star-btn:active{transform:scale(0.9);}
  .card.flipped .star-btn{
    /* when flipped, star still visible on back side – keep same position */
    color:var(--muted);
    background:rgba(0,0,0,0.06);
  }
  .card.flipped .star-btn.active{
    color:var(--star);
    background:rgba(251,191,36,0.15);
  }

  .controls{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:22px;
  }
  button{
    font-family:inherit;
    border:none;
    border-radius:12px;
    padding:12px 18px;
    font-size:0.95rem;
    font-weight:600;
    cursor:pointer;
    transition:transform .15s ease, opacity .15s ease;
  }
  button:active{transform:scale(0.96);}
  .btn-nav{
    background:var(--card-back);
    color:var(--text-dark);
    border:1px solid var(--border);
    flex:1;
  }
  .btn-nav:disabled{
    opacity:0.4;
    cursor:not-allowed;
  }

  .shuffle-row{
    width:100%;
    display:flex;
    justify-content:center;
    margin-top:14px;
    gap:8px;
  }
  .btn-shuffle{
    background:transparent;
    color:var(--muted);
    border:1px solid var(--border);
    font-size:0.85rem;
    padding:8px 16px;
  }

  .done-msg{
    text-align:center;
    color:var(--muted);
    font-size:0.85rem;
    margin-top:10px;
    min-height:1.2em;
  }

  .empty-fav{
    text-align:center;
    color:var(--muted);
    padding:40px 20px;
    font-size:0.95rem;
    line-height:1.5;
  }

  @media (max-width:480px){
    .card{min-height:380px;}
    .face{padding:22px 18px;}
    .face-front .q-text{font-size:1.1rem;}
    .a-text{font-size:0.95rem;}
  }
</style>
</head>
<body>

<!-- ========== HOME ========== -->
<div id="homeView">
  <h1>📚 Fachwirt für Einkauf</h1>
  <div class="subtitle">Kategorie wählen</div>
  <div class="cat-list" id="catList"></div>
</div>

<!-- ========== STUDY ========== -->
<div id="studyView">
  <div class="study-header">
    <button class="btn-back" id="backBtn">← Zurück</button>
    <div class="study-cat-name" id="studyCatName"></div>
  </div>

  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label">
      <span id="progressText">Karte 1 von 1</span>
      <span id="progressPct">0%</span>
    </div>
  </div>

  <div class="card-stage" id="cardStage">
    <div class="card" id="card">
      <button class="star-btn" id="starBtn" title="Als Favorit speichern" aria-label="Favorit">☆</button>
      <div class="face face-front">
        <div class="tag">Frage</div>
        <div class="q-text" id="questionText"></div>
        <div class="hint">Tippen für Antwort</div>
      </div>
      <div class="face face-back">
        <div class="tag">Antwort</div>
        <div class="a-text" id="answerText"></div>
      </div>
    </div>
  </div>

  <div class="empty-fav" id="emptyFav" style="display:none;">
    Noch keine Favoriten.<br>Tippe auf den Stern bei einer Karte, um sie hier zu speichern.
  </div>

  <div class="controls" id="controls">
    <button class="btn-nav" id="prevBtn">← Zurück</button>
    <button class="btn-nav" id="nextBtn">Weiter →</button>
  </div>

  <div class="shuffle-row" id="shuffleRow">
    <button class="btn-shuffle" id="shuffleBtn">🔀 Mischen</button>
    <button class="btn-shuffle" id="resetBtn">↺ Von vorne</button>
  </div>

  <div class="done-msg" id="doneMsg"></div>
</div>

<script>
const data = {
  "Recht": [
    {q:"Was bedeutet „anwendbares Recht“?", a:"Das anwendbare Recht bestimmt, nach welcher Rechtsordnung ein Vertrag beurteilt wird. Bei internationalen Verträgen muss geklärt werden, welches nationale Recht bzw. welches internationale Kaufrecht gilt.\n\nBeispiel:\nEin deutsches Unternehmen kauft Ware bei einem Unternehmen in Vietnam. Es stellt sich die Frage, welches Recht bei einem Streit gilt.\n\nMerksatz:\n👉 Anwendbares Recht = Nach welchem Recht wird der Vertrag beurteilt?"},
    {q:"Was ist das CISG?", a:"Das CISG (UN-Kaufrecht) ist ein internationales Übereinkommen über den grenzüberschreitenden Warenkauf. Es regelt unter anderem die Pflichten von Käufer und Verkäufer, Vertragswidrigkeiten und die Rechte bei Pflichtverletzungen.\n\nBeispiel:\nEin deutsches Unternehmen kauft Waren bei einem Hersteller in Vietnam. Beide Länder sind CISG-Vertragsstaaten.\n\nMerksatz:\n👉 CISG = internationales Kaufrecht für Waren"},
    {q:"Was regelt Art. 1 CISG?", a:"Art. 1 CISG regelt, wann das CISG auf einen internationalen Warenkauf angewendet wird. Nach Art. 1 Abs. 1 lit. a ist es grundsätzlich anwendbar, wenn die Parteien ihre Niederlassungen in verschiedenen CISG-Vertragsstaaten haben.\n\nBeispiel:\nEin deutsches Unternehmen kauft bei einem vietnamesischen Unternehmen. Beide Staaten sind Vertragsstaaten → Art. 1 CISG prüfen.\n\nMerksatz:\n👉 Art. 1 = Wann gilt das CISG?"},
    {q:"Was regelt Art. 6 CISG?", a:"Art. 6 CISG ermöglicht es den Vertragsparteien, die Anwendung des CISG auszuschließen oder von einzelnen Bestimmungen abzuweichen.\n\nBeispiel:\nIm Vertrag steht: „Es gilt deutsches Recht unter Ausschluss des CISG.“ → Das CISG wird ausgeschlossen.\n\nMerksatz:\n👉 Art. 6 = CISG ausschließen"},
    {q:"Was regelt Art. 35 CISG?", a:"Art. 35 CISG regelt die Vertragsmäßigkeit der Ware. Der Verkäufer muss grundsätzlich Waren liefern, die der vereinbarten Beschaffenheit entsprechen und für den vorgesehenen bzw. gewöhnlichen Zweck geeignet sind.\n\nBeispiel:\nBestellt der Käufer elektrische Geräte mit bestimmten technischen Eigenschaften und erhält Geräte mit anderen Eigenschaften → mögliche Vertragswidrigkeit nach Art. 35 CISG.\n\nMerksatz:\n👉 Art. 35 = Ware muss vertragsgemäß sein"},
    {q:"Was regelt Art. 36 CISG?", a:"Art. 36 CISG regelt die Haftung des Verkäufers für Vertragswidrigkeiten, die bereits bei Gefahrübergang bestanden haben.\n\nBeispiel:\nEin Gerät war bereits bei Gefahrübergang defekt, wird aber erst später beim Käufer als mangelhaft erkannt → Art. 36 CISG kann relevant sein.\n\nMerksatz:\n👉 Art. 36 = Mangel schon bei Gefahrübergang vorhanden"},
    {q:"Was regelt Art. 38 CISG?", a:"Art. 38 CISG regelt die Untersuchungspflicht des Käufers. Der Käufer muss die Ware innerhalb einer so kurzen Frist untersuchen, wie es die Umstände erlauben.\n\nBeispiel:\nEin Großhändler erhält eine Lieferung mit 500 Geräten. Er muss die Ware zeitnah auf erkennbare Mängel untersuchen.\n\nMerksatz:\n👉 Art. 38 = Ware untersuchen"},
    {q:"Was regelt Art. 39 CISG?", a:"Art. 39 CISG regelt die Mängelanzeige des Käufers. Der Käufer muss dem Verkäufer die Vertragswidrigkeit innerhalb einer angemessenen Frist mitteilen. Andernfalls kann er seine Rechte wegen des Mangels verlieren.\n\nBeispiel:\nDer Käufer entdeckt einen Mangel, informiert den Verkäufer aber erst Monate später, obwohl eine frühere Meldung möglich gewesen wäre → problematisch nach Art. 39 CISG.\n\nMerksatz:\n👉 Art. 39 = Mangel rechtzeitig rügen"},
    {q:"Was regeln Art. 45 ff. CISG?", a:"Art. 45 ff. CISG regeln die Rechtsbehelfe des Käufers, wenn der Verkäufer seine vertraglichen Pflichten nicht erfüllt. Je nach Voraussetzungen kommen beispielsweise Nacherfüllung, Preisminderung, Schadensersatz oder Vertragsaufhebung infrage.\n\nBeispiel:\nDer Verkäufer liefert mangelhafte Ware → der Käufer prüft seine Rechte nach Art. 45 ff. CISG.\n\nMerksatz:\n👉 Art. 45 ff. = Rechte des Käufers"},
    {q:"Was regelt Art. 25 CISG?", a:"Art. 25 CISG definiert die wesentliche Vertragsverletzung. Sie liegt vor, wenn dem Vertragspartner im Wesentlichen das entzogen wird, was er nach dem Vertrag erwarten durfte.\n\nBeispiel:\nEine speziell für einen Produktionsprozess bestellte Maschine ist für diesen Zweck völlig ungeeignet → eine wesentliche Vertragsverletzung kann vorliegen.\n\nMerksatz:\n👉 Art. 25 = Wesentliche Vertragsverletzung"},
    {q:"Was regeln Art. 74 ff. CISG?", a:"Art. 74 ff. CISG regeln den Schadensersatz bei Vertragsverletzungen. Unter den Voraussetzungen des CISG können Schäden ersetzt werden, die durch die Vertragsverletzung entstanden sind.\n\nBeispiel:\nDurch eine mangelhafte Lieferung entstehen dem Käufer zusätzliche Kosten → Schadensersatz nach Art. 74 ff. CISG kann geprüft werden.\n\nMerksatz:\n👉 Art. 74 ff. = Schadensersatz"},
    {q:"Was bedeutet „Durchsetzbarkeit von Ansprüchen“?", a:"Die Durchsetzbarkeit beschreibt, ob ein bestehender Anspruch tatsächlich gegenüber dem Vertragspartner durchgesetzt und vollstreckt werden kann.\n\nEin Anspruch kann also bestehen, obwohl seine praktische Durchsetzung im Ausland schwierig ist.\n\nBeispiel:\nEin deutsches Unternehmen hat einen Anspruch gegen einen vietnamesischen Lieferanten. Laut Sachverhalt werden deutsche Urteile in Vietnam nicht anerkannt → die Durchsetzung ist problematisch.\n\nMerksatz:\n👉 Anspruch haben ≠ Anspruch durchsetzen können"},
    {q:"Was ist das New Yorker Übereinkommen?", a:"Das New Yorker Übereinkommen von 1958 erleichtert die Anerkennung und Vollstreckung ausländischer Schiedssprüche.\n\nBesonders wichtig sind Art. II zur Schiedsvereinbarung und Art. III zur Anerkennung und Vollstreckung.\n\nBeispiel:\nEin deutsches Unternehmen und ein vietnamesisches Unternehmen vereinbaren ein Schiedsverfahren. Der Schiedsspruch soll später auch im Ausland vollstreckt werden.\n\nMerksatz:\n👉 New Yorker Übereinkommen = internationale Durchsetzung von Schiedssprüchen"},
    {q:"Was ist eine Schiedsvereinbarung?", a:"Eine Schiedsvereinbarung legt fest, dass Streitigkeiten zwischen den Vertragsparteien durch ein Schiedsgericht und nicht durch ein staatliches Gericht entschieden werden.\n\nBeispiel:\n„Alle Streitigkeiten aus diesem Vertrag werden nach den Regeln der ICC durch ein Schiedsgericht entschieden.“\n\nMerksatz:\n👉 Schiedsvereinbarung = Streit durch Schiedsgericht"},
    {q:"Was bedeutet ICC?", a:"ICC steht für International Chamber of Commerce (Internationale Handelskammer). Sie stellt unter anderem Regeln für internationale Schiedsverfahren bereit und ist Herausgeberin der Incoterms®.\n\nBeispiel:\nZwei internationale Unternehmen vereinbaren, dass Streitigkeiten nach den ICC-Schiedsregeln entschieden werden.\n\nMerksatz:\n👉 ICC = Internationale Handelskammer"},
    {q:"Was regelt die Rom-I-Verordnung?", a:"Die Rom-I-Verordnung (EG) Nr. 593/2008 regelt, welches nationale Recht auf einen internationalen Vertrag angewendet wird.\n\nBeispiel:\nEin deutsches Unternehmen schließt einen Vertrag mit einem Unternehmen aus Vietnam. Es wurde keine Rechtswahl getroffen → die Rom-I-Verordnung kann bei der Bestimmung des anwendbaren Rechts relevant sein.\n\nMerksatz:\n👉 Rom-I = Welches nationale Recht gilt?"},
    {q:"Was regelt Art. 3 Rom-I?", a:"Art. 3 Rom-I regelt die Rechtswahl. Die Vertragsparteien können grundsätzlich selbst bestimmen, welches Recht auf ihren Vertrag angewendet werden soll.\n\nBeispiel:\n„Es gilt deutsches Recht unter Ausschluss des CISG.“\n\nMerksatz:\n👉 Art. 3 Rom-I = Rechtswahl"},
    {q:"Was regelt Art. 4 Rom-I?", a:"Art. 4 Rom-I enthält die Regeln für das anwendbare Recht, wenn keine Rechtswahl getroffen wurde. Beim Warenkauf ist grundsätzlich das Recht am gewöhnlichen Aufenthalt des Verkäufers relevant.\n\nBeispiel:\nEin deutsches Unternehmen kauft bei einem vietnamesischen Verkäufer und im Vertrag steht nichts zum anwendbaren Recht → Art. 4 Rom-I ist zu prüfen.\n\nMerksatz:\n👉 Art. 4 = Keine Rechtswahl → welches Recht gilt?"},
    {q:"Welche Rechtsgrundlagen sind bei einem Kaufvertrag mit einem deutschen Lieferanten wichtig?", a:"Bei einem deutschen Kaufvertrag sind insbesondere die Vorschriften des BGB-Kaufrechts relevant. Besonders wichtig sind §§ 433, 434 und 437 BGB.\n\nBeispiel:\nEin deutscher Lieferant liefert mangelhafte Ware → BGB-Kaufrecht prüfen.\n\nMerksatz:\n👉 Deutscher Kaufvertrag = BGB-Kaufrecht"},
    {q:"Was regelt § 433 BGB?", a:"§ 433 BGB regelt die wesentlichen Pflichten aus dem Kaufvertrag. Der Verkäufer muss dem Käufer die Sache übergeben und sie grundsätzlich frei von Sach- und Rechtsmängeln verschaffen.\n\nBeispiel:\nEin Lieferant verkauft elektrische Geräte. Er muss diese grundsätzlich mangelfrei liefern.\n\nMerksatz:\n👉 § 433 = Pflichten aus dem Kaufvertrag"},
    {q:"Was regelt § 434 BGB?", a:"§ 434 BGB bestimmt, wann eine Kaufsache einen Sachmangel hat. Dabei spielen unter anderem die vereinbarte Beschaffenheit, die vereinbarte Verwendung und die objektiv erforderliche Beschaffenheit eine Rolle.\n\nBeispiel:\nElektrische Geräte werden mit einer nicht ordnungsgemäßen CE-Kennzeichnung geliefert → ein Sachmangel ist zu prüfen.\n\nMerksatz:\n👉 § 434 = Wann liegt ein Sachmangel vor?"},
    {q:"Welche Bedeutung hat die CE-Kennzeichnung bei der Aufgabe?", a:"Die CE-Kennzeichnung zeigt die Konformität eines Produkts mit den einschlägigen EU-Anforderungen an. Eine nicht ordnungsgemäße CE-Kennzeichnung kann deshalb dazu führen, dass die Ware nicht den erforderlichen bzw. vereinbarten Anforderungen entspricht.\n\nBeispiel:\nEin Lieferant liefert elektrische Geräte nach Deutschland, deren CE-Kennzeichnung nicht ordnungsgemäß ist → ein Sachmangel ist zu prüfen.\n\nMerksatz:\n👉 CE = Konformität mit den relevanten EU-Anforderungen"},
    {q:"Was regelt § 437 BGB?", a:"§ 437 BGB regelt die Rechte des Käufers bei einem Sachmangel. Dazu gehören insbesondere Nacherfüllung, Rücktritt, Minderung und Schadensersatz – jeweils unter den gesetzlichen Voraussetzungen.\n\nBeispiel:\nEin Lieferant liefert mangelhafte Ware → der Käufer prüft seine Rechte nach § 437 BGB.\n\nMerksatz:\n👉 § 437 = Rechte des Käufers"},
    {q:"Was regelt § 439 BGB?", a:"§ 439 BGB regelt die Nacherfüllung. Der Käufer kann grundsätzlich die Beseitigung des Mangels oder die Lieferung einer mangelfreien Sache verlangen.\n\nBeispiel:\nEine gelieferte Maschine ist defekt → der Käufer verlangt Reparatur oder eine mangelfreie Ersatzmaschine.\n\nMerksatz:\n👉 § 439 = Nacherfüllung"},
    {q:"Welche Bedeutung haben §§ 440, 323 BGB beim Rücktritt?", a:"Diese Vorschriften sind für den Rücktritt wegen einer Pflichtverletzung bzw. eines Mangels relevant. Grundsätzlich muss dem Verkäufer zunächst eine angemessene Möglichkeit zur Nacherfüllung gegeben werden. Unter bestimmten Voraussetzungen ist eine Fristsetzung entbehrlich.\n\nBeispiel:\nEin Lieferant kann einen erheblichen Mangel trotz angemessener Frist nicht beseitigen → ein Rücktritt kann geprüft werden.\n\nMerksatz:\n👉 §§ 440, 323 = Rücktritt prüfen"},
    {q:"Was regelt § 441 BGB?", a:"§ 441 BGB regelt die Minderung des Kaufpreises bei einem Mangel. Der Käufer behält die Ware und kann unter den gesetzlichen Voraussetzungen den Kaufpreis herabsetzen.\n\nBeispiel:\nEin Gerät hat einen Mangel, kann aber weiterhin verwendet werden → der Käufer behält es und verlangt eine Kaufpreisminderung.\n\nMerksatz:\n👉 § 441 = Ware behalten, weniger zahlen"},
    {q:"Was regelt § 280 BGB?", a:"§ 280 BGB ist eine zentrale Vorschrift für Schadensersatz wegen Pflichtverletzung. Wird eine Pflicht verletzt und entsteht dadurch ein Schaden, kann unter den gesetzlichen Voraussetzungen Schadensersatz verlangt werden.\n\nBeispiel:\nEin Lieferant liefert mangelhafte Ware und verursacht dadurch zusätzliche Kosten beim Käufer → Schadensersatz nach § 280 BGB kann geprüft werden.\n\nMerksatz:\n👉 § 280 = Pflichtverletzung + Schaden"},
    {q:"Was regelt § 281 BGB?", a:"§ 281 BGB regelt Schadensersatz statt der Leistung. Grundsätzlich muss dem Schuldner vorher eine angemessene Frist zur Leistung oder Nacherfüllung gesetzt werden.\n\nBeispiel:\nDer Lieferant beseitigt einen Mangel trotz angemessener Frist nicht → Schadensersatz statt der Leistung kann geprüft werden.\n\nMerksatz:\n👉 § 281 = Schadensersatz statt der Leistung"},
    {q:"Welche Schadenspositionen können bei einer mangelhaften Lieferung entstehen?", a:"Durch eine Pflichtverletzung können verschiedene Folgekosten entstehen. In der Aufgabe werden insbesondere Kundenreklamationen, Schadensdokumentation und Lagerung genannt.\n\nDiese können grundsätzlich als Schaden relevant sein, wenn sie durch die Pflichtverletzung verursacht wurden und die weiteren Voraussetzungen des Schadensersatzrechts erfüllt sind.\n\nBeispiel:\nWegen mangelhafter Ware muss das Unternehmen zusätzliche Reklamationen bearbeiten und die Ware länger lagern.\n\nMerksatz:\n👉 Mangel → Folgekosten → Schadensersatz prüfen"},
    {q:"Was regelt § 377 HGB?", a:"§ 377 HGB regelt die Untersuchungs- und Rügepflicht beim beiderseitigen Handelskauf.\n\nDer Käufer muss die Ware unverzüglich untersuchen und erkennbare Mängel unverzüglich anzeigen. Verdeckte Mängel müssen nach ihrer Entdeckung unverzüglich gerügt werden.\n\nBeispiel:\nEin Großhändler erhält eine Lieferung und entdeckt bei der Wareneingangskontrolle beschädigte Ware → der Mangel muss grundsätzlich unverzüglich gerügt werden.\n\nMerksatz:\n👉 § 377 = Untersuchen & rügen"},
    {q:"Wie kann man internationale Verträge rechtssicherer gestalten?", a:"Wichtige Regelungen sind insbesondere:\n• Rechtswahl\n• Regelung zum CISG\n• Schiedsvereinbarung\n• genaue Qualitäts- und Produktspezifikationen\n• erforderliche Dokumente und Zertifikate\n• Regelungen zu Prüfung und Mängelrüge\n• eindeutige Incoterms\n\nBeispiel:\nEin deutscher Händler vereinbart mit einem ausländischen Lieferanten deutsches Recht, schließt das CISG aus und vereinbart ein ICC-Schiedsverfahren.\n\nMerksatz:\n👉 Internationaler Vertrag = Recht + Streitlösung + Qualität + Lieferung klar regeln"},
    {q:"Was regeln die Incoterms?", a:"Die Incoterms® regeln bei internationalen Warenlieferungen insbesondere die Verteilung von Lieferpflichten, Kosten und Risiken zwischen Käufer und Verkäufer. Je nach Klausel werden auch Transport, Versicherung und Zollpflichten geregelt.\n\nBeispiel:\nBei einer internationalen Lieferung wird DAP vereinbart. Dadurch wird festgelegt, welche Liefer- und Transportpflichten der Verkäufer übernimmt und wann das Risiko übergeht.\n\nMerksatz:\n👉 Incoterms = Wer liefert? Wer zahlt? Wer trägt das Risiko?"},
    {q:"Wie prüfe ich eine IHK-Aufgabe zum anwendbaren Recht systematisch?", a:"Bei einem internationalen Lieferanten:\n1. CISG prüfen → Art. 1\n2. Ausschluss prüfen → Art. 6\n3. Vertragswidrigkeit prüfen → Art. 35/36\n4. Untersuchung prüfen → Art. 38\n5. Mängelrüge prüfen → Art. 39\n6. Rechte prüfen → Art. 45 ff.\n7. Schadensersatz prüfen → Art. 74 ff.\n8. Durchsetzbarkeit prüfen → Gericht/Schiedsgericht\n\nBei einem deutschen Lieferanten:\n1. Sachmangel → § 434 BGB\n2. Käuferrechte → § 437 BGB\n3. Nacherfüllung → § 439 BGB\n4. Rücktritt/Minderung → §§ 440, 323, 441 BGB\n5. Schadensersatz → §§ 280 ff. BGB\n6. Untersuchung/Rüge → § 377 HGB\n\nBeispiel:\nVietnam-Lieferant liefert mangelhafte Ware → zuerst CISG prüfen.\nDeutscher Lieferant liefert mangelhafte Ware → BGB und ggf. HGB prüfen."}
  ],
  "Maverick Buying": [
    {q:"Was versteht man unter Maverick Buying?", a:"Maverick Buying bezeichnet die Beschaffung von Waren oder Dienstleistungen am Einkauf vorbei. Dabei werden die festgelegten Einkaufsprozesse, Lieferanten oder Rahmenverträge des Unternehmens nicht eingehalten.\n\nBeispiel:\nDie Produktion benötigt dringend einen bestimmten Dienstleister und beauftragt diesen direkt, obwohl grundsätzlich der Einkauf für die Beauftragung zuständig ist.\n\nMerksatz:\n👉 Maverick Buying = Einkauf wird umgangen."},
    {q:"Wie berechnet man die Maverick-Buying-Quote?", a:"Maverick-Buying-Quote =\n\nNicht vom Einkauf beschafftes Beschaffungsvolumen\n÷ gesamtes Beschaffungsvolumen\n× 100\n\nBeispiel:\nGesamtes Beschaffungsvolumen: 10 Mio. €\nDavon am Einkauf vorbei: 1 Mio. €\n\n1 Mio. € ÷ 10 Mio. € × 100 = 10 %\n\nMerksatz:\n👉 Am Einkauf vorbei ÷ Gesamtvolumen × 100 = Maverick-Buying-Quote."},
    {q:"Welche Folgen kann Maverick Buying für ein Unternehmen haben?", a:"Mögliche Folgen sind:\n\n• fehlende Preisvergleiche\n• höhere Einkaufspreise\n• schlecht geführte oder fehlende Verhandlungen\n• nicht genutzte Vorteile aus Rahmenverträgen\n• zusätzliche Kosten\n• unabgestimmte Prozesse\n• teure „Schnellschüsse“\n• mangelnde Transparenz über die Gesamtausgaben\n• höhere rechtliche Risiken\n• zusätzlicher Aufwand an internen Schnittstellen\n• schlechtere Außenwirkung gegenüber Lieferanten\n\nBeispiel:\nEine Abteilung bestellt selbst bei einem Lieferanten, obwohl das Unternehmen mit einem anderen Lieferanten einen günstigeren Rahmenvertrag besitzt.\n\nMerksatz:\n👉 Maverick Buying kostet Geld, schafft Aufwand und senkt die Kontrolle."},
    {q:"Welche Gründe führen häufig zu Maverick Buying?", a:"Typische Gründe sind:\n\n• Mitarbeiter kennen die Einkaufsprozesse nicht.\n• Rahmenverträge sind nicht bekannt.\n• fehlendes Wissen über die Gesamtkosten (TCO)\n• Abteilungsegoismus\n• Wunsch nach mehr Geschwindigkeit und Flexibilität\n• mangelndes Vertrauen in den Einkauf\n• fehlende Verfügbarkeit eines gewünschten Produkts/Dienstleisters\n• dringender Bedarf\n• mangelndes betriebswirtschaftliches oder Prozessverständnis\n• schlechte bzw. unpassende Lieferantenbasis\n• Zielkonflikte zwischen Einkauf und Fachabteilungen\n\nBeispiel:\nEine Fachabteilung bestellt selbst, weil sie der Meinung ist, dass der Einkauf „zu lange braucht“.\n\nMerksatz:\n👉 Unwissenheit, Zeitdruck, Egoismus und fehlendes Vertrauen fördern Maverick Buying."},
    {q:"Welche internen Kunden können Maverick Buying betreiben?", a:"Grundsätzlich können verschiedene interne Abteilungen bzw. Mitarbeiter am Einkauf vorbei beschaffen, z. B.:\n\n• Geschäftsführung\n• Produktion\n• Technik / Engineering\n• Labor\n• anwendungstechnische Bereiche\n• andere Fachabteilungen\n\nBeispiel:\nDie Technik benötigt eine spezielle Maschine und bestellt diese direkt beim Hersteller, ohne den Einkauf einzubeziehen.\n\nMerksatz:\n👉 Maverick Buying kann überall entstehen, wo Fachabteilungen selbst beschaffen."},
    {q:"Welche typischen Aussagen bzw. Slogans können Maverick Buying fördern?", a:"Typische Aussagen sind beispielsweise:\n\n• „Einkaufen kann jeder!“\n• „Das geht schneller, wenn ich es selbst mache.“\n• „Der Einkauf braucht zu lange.“\n• „Ich weiß selbst, was ich brauche.“\n\nBeispiel:\nEin Mitarbeiter bestellt einen Artikel direkt beim Lieferanten, weil er glaubt, dass eine Bestellung über den Einkauf unnötig Zeit kostet.\n\nMerksatz:\n👉 „Einkaufen kann jeder!“ = typisches Warnsignal für Maverick Buying."},
    {q:"Welche Maßnahmen können zur Verringerung von Maverick Buying eingesetzt werden?", a:"Mögliche Maßnahmen:\n\n1. Nur der Einkauf darf Bestellungen auslösen.\n2. Rechnungen werden nur bei ordnungsgemäßer Bestellung akzeptiert.\n3. Einkaufsrichtlinie bzw. Einkaufshandbuch einführen.\n4. Einkaufsprozesse klar definieren.\n5. Einkauf frühzeitig in Projekte und Entwicklungen einbinden.\n6. Einkauf bei Investitionsgütern einbinden.\n7. Rahmenverträge abschließen.\n8. Katalogsysteme / E-Procurement einsetzen.\n9. Bereiche mit besonders hohem Maverick Buying analysieren.\n\nBeispiel:\nMitarbeiter können Büromaterial nicht mehr frei bestellen, sondern bestellen aus einem vom Einkauf freigegebenen Katalog.\n\nMerksatz:\n👉 Klare Regeln + einfache Prozesse + Einbindung des Einkaufs = weniger Maverick Buying."},
    {q:"Was kann man gegen Maverick Buying durch Delegation bzw. E-Procurement tun?", a:"Nicht jede Beschaffung muss zwingend individuell durch einen Einkäufer durchgeführt werden. Für geeignete Beschaffungen kann der Einkauf die Bestellung gezielt delegieren, z. B. über:\n\n• Katalogsysteme\n• E-Procurement\n• freigegebene Lieferanten\n• Rahmenverträge\n\nDadurch können Fachabteilungen selbst bestellen, ohne den Einkauf vollständig zu umgehen.\n\nBeispiel:\nEin Mitarbeiter bestellt Standard-Büromaterial selbst aus einem vom Einkauf freigegebenen Online-Katalog.\n\nMerksatz:\n👉 Delegieren ja – aber kontrolliert durch den Einkauf."},
    {q:"Was bedeutet TCO und warum spielt TCO bei Maverick Buying eine Rolle?", a:"TCO = Total Cost of Ownership.\n\nDabei werden nicht nur der Einkaufspreis, sondern alle relevanten Kosten über den gesamten Lebenszyklus eines Produkts oder einer Leistung betrachtet.\n\nMitarbeiter können Maverick Buying betreiben, wenn sie nur den kurzfristigen Einkaufspreis betrachten und die Gesamtkosten nicht kennen.\n\nBeispiel:\nEin günstiger Drucker kostet in der Anschaffung weniger, benötigt aber teure Toner und verursacht hohe Wartungskosten. Der Einkauf würde deshalb möglicherweise ein anderes Modell auswählen.\n\nMerksatz:\n👉 Nicht nur den Preis sehen – die Gesamtkosten zählen."},
    {q:"Was ist bei einer vorgegebenen Maverick-Buying-Zielquote zu beachten?", a:"Eine Zielquote sollte zur Unternehmensgröße und zum Beschaffungsvolumen passen. Eine hohe Quote bedeutet, dass ein erheblicher Teil des Beschaffungsvolumens am Einkauf vorbei erfolgt.\n\nIn der Prüfung wurde beispielsweise eine Quote von 15 % für ein mittelständisches Unternehmen diskutiert. In der Musterlösung wird diese als zu hoch eingeordnet und eine deutliche Reduzierung angestrebt.\n\nBeispiel:\nBei 100 Mio. € Einkaufsvolumen bedeuten 15 % Maverick Buying bereits 15 Mio. €, die nicht über die regulären Einkaufsprozesse laufen.\n\nMerksatz:\n👉 Je größer das Einkaufsvolumen, desto wichtiger ist die Kontrolle des Maverick Buying."},
    {q:"Wie kann man Widerstände gegen den Abbau von Maverick Buying reduzieren?", a:"Mögliche Vorgehensweisen:\n\n• finanzielle Nachteile des Maverick Buying aufzeigen\n• Controlling in die Argumentation einbeziehen\n• Vorteile der Einkaufsprozesse erklären\n• unnötige bürokratische Hürden abbauen\n• Einkaufsprozesse analysieren und vereinfachen\n• einen Code of Conduct einführen\n• rechtliche Risiken verdeutlichen\n• Geschäftsleitung klar hinter die Einkaufsregeln stellen\n\nBeispiel:\nEine Fachabteilung beschwert sich über den Einkaufsprozess. Der Einkauf untersucht daraufhin, welche Schritte tatsächlich unnötig sind, und vereinfacht den Prozess.\n\nMerksatz:\n👉 Widerstand nicht einfach bekämpfen – Ursachen verstehen und Prozesse verbessern."},
    {q:"Welche Rolle spielen Einkaufsrichtlinien und ein Einkaufshandbuch beim Abbau von Maverick Buying?", a:"Sie legen verbindlich fest:\n\n• wer bestellen darf\n• welche Prozesse einzuhalten sind\n• wann der Einkauf einzubeziehen ist\n• welche Lieferanten genutzt werden dürfen\n• welche Genehmigungen erforderlich sind\n\nDadurch werden Verantwortlichkeiten und Abläufe für die Mitarbeiter eindeutig.\n\nBeispiel:\nDie Einkaufsrichtlinie schreibt vor, dass Investitionen ab einer bestimmten Höhe zwingend über den Einkauf abgewickelt werden müssen.\n\nMerksatz:\n👉 Klare Zuständigkeit verhindert freie Beschaffung."},
    {q:"Warum sollte der Einkauf frühzeitig in Entwicklungen und Investitionen eingebunden werden?", a:"Dadurch kann der Einkauf bereits frühzeitig:\n\n• Lieferanten auswählen\n• Preise und Konditionen verhandeln\n• Alternativen prüfen\n• Rahmenverträge nutzen\n• TCO betrachten\n• Beschaffungsrisiken reduzieren\n\nEine späte Einbindung kann dazu führen, dass Fachabteilungen bereits eigenständig Lieferanten ausgewählt oder Aufträge vergeben haben.\n\nBeispiel:\nDie Technik plant eine neue Produktionsanlage. Wird der Einkauf bereits bei der Planung beteiligt, kann er Lieferanten vergleichen und bessere Konditionen verhandeln.\n\nMerksatz:\n👉 Einkauf nicht erst beim Bestellen einschalten – sondern frühzeitig."},
    {q:"Warum ist die Maverick-Buying-Quote eine wichtige Einkaufskennzahl (KPI)?", a:"Die Maverick-Buying-Quote zeigt, wie viel Beschaffungsvolumen außerhalb der vorgesehenen Einkaufsprozesse abgewickelt wird.\n\nSie kann deshalb genutzt werden, um die Einhaltung der Einkaufsprozesse zu kontrollieren und Verbesserungsmaßnahmen abzuleiten.\n\nBeispiel:\nDie Quote steigt von 8 % auf 18 %. Das Unternehmen untersucht daraufhin, welche Abteilungen und Beschaffungen besonders häufig am Einkauf vorbei erfolgen.\n\nMerksatz:\n👉 Die Quote zeigt, wie viel Einkauf am Einkauf vorbeigeht."},
    {q:"Wie könnte eine typische IHK-Aufgabe zur Maverick-Buying-Quote aussehen?", a:"Typischerweise kann die IHK verlangen:\n\n1. Maverick Buying erklären\n2. Maverick-Buying-Quote berechnen\n3. Folgen nennen\n4. Gründe erläutern\n5. Maßnahmen zur Reduzierung nennen\n6. interne Kunden identifizieren\n7. eine Zielquote beurteilen\n8. Widerstände gegen Veränderungen beschreiben und Maßnahmen dagegen nennen\n\nBeispiel:\n„Das Unternehmen hat ein Beschaffungsvolumen von 50 Mio. €, davon werden 7,5 Mio. € am Einkauf vorbei beschafft. Ermitteln Sie die Quote und nennen Sie fünf Maßnahmen zur Verringerung.“\n\nLösung:\n7,5 Mio. € ÷ 50 Mio. € × 100 = 15 %\n\nMerksatz:\n👉 Bei Maverick Buying immer an: Definition → Quote → Folgen → Gründe → Maßnahmen denken."}
  ],
  "Kommunikation, Führung und Zusammenarbeit": [
    {q:"Was versteht man unter Kommunikation?", a:"Kommunikation ist der Austausch von Informationen zwischen mindestens zwei Personen. Sie erfolgt beispielsweise durch:\n\n• Sprache\n• Schrift\n• Zeichen\n• Gestik und Mimik\n• Körpersprache\n• Tonfall\n\nIm beruflichen Umfeld dient Kommunikation insbesondere dazu, Informationen auszutauschen, Aufgaben abzustimmen, Beziehungen zu gestalten und gemeinsame Lösungen zu entwickeln.\n\nBeispiel:\nEin Einkäufer bespricht mit einem Lieferanten eine Lieferverzögerung und vereinbart einen neuen Liefertermin.\n\nMerksatz:\n👉 Kommunikation = Informationen austauschen + Verhalten abstimmen."},
    {q:"Welche fünf Axiome der Kommunikation nach Paul Watzlawick sollten Sie kennen?", a:"1. Man kann nicht nicht kommunizieren.\n2. Jede Kommunikation hat einen Inhalts- und Beziehungsaspekt.\n3. Kommunikation ist immer Ursache und Wirkung – Verhalten löst Reaktionen aus.\n4. Kommunikation erfolgt digital und analog.\n   • digital = Worte/Sprache\n   • analog = Körpersprache, Mimik, Tonfall\n5. Kommunikation ist von individuellen Interpretationen und einem gemeinsamen Kommunikationscode geprägt.\n\nBeispiel:\nEin Mitarbeiter sagt „Ist schon okay“, verschränkt aber die Arme und schaut genervt. Die Worte vermitteln etwas anderes als die Körpersprache.\n\nMerksatz:\n👉 Nicht nur WAS gesagt wird, sondern auch WIE und in welcher Beziehung es gesagt wird."},
    {q:"Was unterscheidet verbale von nonverbaler Kommunikation?", a:"Verbal:\n\n• gesprochene Worte\n• geschriebene Sprache\n\nNonverbal:\n\n• Mimik\n• Gestik\n• Körperhaltung\n• Blickkontakt\n• Stimme/Tonfall\n• Abstand zum Gesprächspartner\n\nBeispiel:\nDer Einkaufsleiter sagt: „Ich bin mit Ihrer Leistung zufrieden“, wirkt dabei aber genervt und vermeidet Blickkontakt. Die verbale und nonverbale Botschaft widersprechen sich.\n\nMerksatz:\n👉 Verbal = Worte. Nonverbal = alles, was zusätzlich mitschwingt."},
    {q:"Welche Phasen sollte ein strukturiertes Mitarbeitergespräch durchlaufen?", a:"1. Vorbereitungsphase\n2. Eröffnungsphase\n3. Erarbeitungsphase\n4. Bewertungsphase\n5. Vereinbarungsphase\n6. Abschlussphase\n\nBeispiel:\nEin Einkaufsleiter führt mit einer Auszubildenden ein Gespräch über ihre Übernahme. Zunächst wird das Gespräch vorbereitet, anschließend werden Probleme und Wünsche besprochen und am Ende konkrete Entwicklungsmaßnahmen vereinbart.\n\nMerksatz:\n👉 Vorbereiten → Eröffnen → Erarbeiten → Bewerten → Vereinbaren → Abschließen."},
    {q:"Welche Punkte sind bei der Vorbereitung eines Mitarbeitergesprächs wichtig?", a:"• geeigneten Zeitpunkt wählen\n• ausreichend Zeit einplanen\n• ruhigen und ungestörten Raum wählen\n• ggf. Agenda erstellen\n• Gesprächsleitfaden/Checkliste vorbereiten\n• Gesprächsinhalte und Ziele festlegen\n\nBeispiel:\nDer Einkaufsleiter reserviert einen Besprechungsraum, plant 60 Minuten ein und bereitet die Themen Übernahme, Entwicklung und Erwartungen vor.\n\nMerksatz:\n👉 Ein gutes Gespräch beginnt vor dem Gespräch."},
    {q:"Wie sollte ein Mitarbeitergespräch sinnvoll eröffnet werden?", a:"• Anlass und Ziel des Gesprächs erklären\n• offene Fragen stellen\n• positive Gesprächsatmosphäre schaffen\n• aktiv zuhören\n• Mitarbeiter ausreden lassen\n• keine unnötigen Vorwürfe\n• Vertrauen schaffen\n\nBeispiel:\nStatt „Warum haben Sie das schon wieder falsch gemacht?“ fragt der Vorgesetzte: „Wie erklären Sie sich, dass es bei diesem Vorgang zu der Abweichung gekommen ist?“\n\nMerksatz:\n👉 Offen fragen statt vorwerfen."},
    {q:"Was bedeutet aktives Zuhören und warum ist es in Mitarbeitergesprächen wichtig?", a:"Aktives Zuhören bedeutet, dem Gesprächspartner aufmerksam zuzuhören und zu zeigen, dass seine Aussagen verstanden wurden.\n\nDazu gehören:\n\n• ausreden lassen\n• Blickkontakt\n• Rückfragen stellen\n• Aussagen zusammenfassen\n• Verständnisfragen stellen\n• Gefühle und Bedürfnisse wahrnehmen\n• nicht sofort bewerten oder unterbrechen\n\nBeispiel:\nMitarbeiter: „Ich komme mit den vielen Aufgaben momentan nicht hinterher.“\n\nVorgesetzter: „Wenn ich dich richtig verstehe, ist momentan vor allem die Menge der Aufgaben das Problem?“\n\nMerksatz:\n👉 Aktiv zuhören = verstehen wollen, nicht nur auf die eigene Antwort warten."},
    {q:"Was ist bei der Erarbeitungsphase eines Mitarbeitergesprächs zu beachten?", a:"• Themen gemeinsam bearbeiten\n• Mitarbeiter seine Situation schildern lassen\n• Meinungen und Wünsche zulassen\n• sachliche und konkrete Kritik äußern\n• Verständnis für Probleme zeigen\n• Wertschätzung und Kritik ausbalancieren\n• bei Problemen gemeinsam Lösungen suchen\n\nBeispiel:\nDer Einkaufsleiter erklärt sachlich, wo er Verbesserungsbedarf sieht, lässt die Auszubildende anschließend ihre Sicht darstellen und entwickelt mit ihr eine Lösung.\n\nMerksatz:\n👉 Nicht über den Mitarbeiter reden – mit ihm Lösungen erarbeiten."},
    {q:"Was wird in der Vereinbarungsphase eines Mitarbeitergesprächs festgelegt?", a:"Gemeinsam werden konkrete:\n\n• Ziele\n• Maßnahmen\n• Weiterbildungen\n• Entwicklungsschritte\n• Meilensteine\n• Feedbacktermine\n\nvereinbart und dokumentiert.\n\nBeispiel:\nDer Mitarbeiter besucht ein Verhandlungstraining, erhält einen Mentor und nach drei Monaten findet ein Feedbackgespräch statt.\n\nMerksatz:\n👉 Am Ende müssen aus dem Gespräch konkrete Maßnahmen entstehen."},
    {q:"Nennen und erklären Sie fünf typische Beurteilungsfehler.", a:"1. Halo-Effekt:\nEin einzelnes Merkmal überstrahlt die gesamte Beurteilung.\n\n2. Milde-/Strenge-/Mitte-Effekt:\nDer Beurteiler bewertet grundsätzlich zu mild, zu streng oder immer durchschnittlich.\n\n3. Nikolaus-/Recency-Effekt:\nDie jüngsten Ereignisse werden überbewertet.\n\n4. Primacy-Effekt:\nDer erste Eindruck beeinflusst die spätere Beurteilung zu stark.\n\n5. Sympathie-/Antipathie-Effekt:\nPersönliche Zu- oder Abneigung beeinflusst die Bewertung.\n\nBeispiel:\nEin Mitarbeiter war die letzten zwei Wochen besonders fleißig. Der Vorgesetzte bewertet deshalb das gesamte Jahr zu positiv → Recency-Effekt.\n\nMerksatz:\n👉 Objektiv beurteilen – nicht nach Gefühl, Sympathie oder dem letzten Eindruck."},
    {q:"Welche Auswirkungen kann ein autoritärer Führungsstil auf Arbeitsergebnisse und Mitarbeitermotivation haben?", a:"Auswirkungen auf Arbeitsergebnisse:\n\n• Mitarbeiter tun nur das Nötigste\n• ineffiziente Zusammenarbeit\n• Rechtfertigungskultur\n• Zuständigkeiten werden hin- und hergeschoben\n• langsame Aufgabenbearbeitung\n• wenig Eigeninitiative\n• kaum neue Ideen\n• Verbesserungsvorschläge bleiben aus\n• Entscheidungen werden nicht selbstständig getroffen\n• hoher Kontrollaufwand\n\nAuswirkungen auf Motivation:\n\n• geringe Motivation\n• innere Kündigung\n• geringe Unternehmensbindung\n• höhere Fluktuation\n• weniger Informationsweitergabe\n• interne Konflikte/Grabenkämpfe\n• höhere Fehlzeiten\n• wenig Bereitschaft für Sonderaufgaben\n\nBeispiel:\nEin Mitarbeiter entscheidet nichts mehr selbst, weil er Angst hat, dass der Chef seine Entscheidung kritisiert. Dadurch wartet er bei jeder Kleinigkeit auf Anweisungen.\n\nMerksatz:\n👉 Zu viel Kontrolle → wenig Eigeninitiative → sinkende Motivation."},
    {q:"Nennen Sie vier geeignete Maßnahmen für eine veränderte Personalführung.", a:"Beispielsweise:\n\n• Vieraugengespräche führen\n• individuelles Training und Coaching\n• Soft-Skill-Seminare\n• Empathie und aktives Zuhören fördern\n• Achtsamkeit und Zeitmanagement trainieren\n• Anreize für Verhaltensänderungen schaffen\n• Mitarbeiter stärker einbeziehen\n\nBeispiel:\nEin Einkaufsleiter besucht mit seinem Team ein Seminar zu Kommunikation und aktivem Zuhören und führt anschließend regelmäßige Feedbackgespräche ein.\n\nMerksatz:\n👉 Moderne Führung = entwickeln, einbeziehen, vertrauen."},
    {q:"Wie lässt sich überprüfen, ob ein neuer Führungsstil erfolgreich ist?", a:"Mögliche Kennzahlen und Methoden:\n\n• Mitarbeiterzufriedenheitsbefragungen\n• Entwicklung der Krankheitstage\n• Entwicklung der Mitarbeiterfluktuation\n• Ergebnisbeitrag des Einkaufs\n• Vergleich mit früheren Zeiträumen\n\nBeispiel:\nVor Einführung des neuen Führungsstils lag die Fluktuation bei 15 %. Nach einem Jahr wird geprüft, ob sich dieser Wert verändert hat.\n\nMerksatz:\n👉 Was sich verändern soll, muss anschließend gemessen werden."},
    {q:"Welche fünf Phasen durchläuft ein Teambildungsprozess nach dem Modell aus der Prüfung 232e?", a:"1. Forming – Findungs- und Orientierungsphase\n2. Storming – Konflikt- und Frustrationsphase\n3. Norming – Stabilisierungs- und Regelungsphase\n4. Performing – Leistungsphase\n5. Adjourning – Auflösungsphase\n\nBeispiel:\nEin neu zusammengestelltes Einkaufsteam lernt sich zunächst kennen, streitet später über Zuständigkeiten, findet anschließend gemeinsame Regeln und arbeitet schließlich sehr leistungsfähig zusammen.\n\nMerksatz:\n👉 Forming → Storming → Norming → Performing → Adjourning."},
    {q:"Was kennzeichnet die Forming-Phase und welches Führungsverhalten ist geeignet?", a:"Forming:\n\n• Team wird neu gebildet\n• Mitglieder lernen sich kennen\n• Unsicherheit\n• Regeln und Rollen sind noch nicht klar\n• Teamleistung zunächst gering\n\nFührungsverhalten:\n\n• Orientierung geben\n• Raum zum Kennenlernen geben\n• erste Regeln und Rahmenbedingungen schaffen\n\nBeispiel:\nEin neues Einkaufsteam wird zusammengestellt. Der Teamleiter stellt die Mitglieder vor und erklärt Aufgaben, Ziele und grundlegende Regeln.\n\nMerksatz:\n👉 Forming = Finden → Führung gibt Orientierung."},
    {q:"Was kennzeichnet die Storming-Phase und wie sollte die Führungskraft reagieren?", a:"Es kommt zu:\n\n• Konflikten\n• Rivalitäten\n• Auseinandersetzungen\n• Diskussionen über Rollen und Aufgaben\n• unterschiedlichen Interessen\n\nDie Führungskraft sollte:\n\n• Regeln aufstellen\n• Konflikte nicht unnötig unterdrücken\n• dem Team zunächst ermöglichen, Konflikte selbst zu lösen\n• bei Bedarf eingreifen\n\nDie Teamleistung stagniert oder sinkt zunächst.\n\nBeispiel:\nZwei Einkäufer wollen beide für dieselbe Warengruppe verantwortlich sein. Der Teamleiter lässt zunächst eine gemeinsame Lösung erarbeiten.\n\nMerksatz:\n👉 Storming = Streit gehört dazu."},
    {q:"Was kennzeichnet die Norming-Phase?", a:"• gemeinsame Regeln entstehen\n• Rollen und Aufgaben sind geklärt\n• Konflikte treten in den Hintergrund\n• Zusammenarbeit verbessert sich\n• Vertrauen entsteht\n• Team unterstützt sich gegenseitig\n• Leistung steigt\n\nDie Führungskraft motiviert und stärkt das Team, lässt es aber zunehmend selbstständig und eigenverantwortlich arbeiten.\n\nBeispiel:\nDas Einkaufsteam hat klare Zuständigkeiten vereinbart und unterstützt sich bei Engpässen gegenseitig.\n\nMerksatz:\n👉 Norming = Regeln gefunden → Zusammenarbeit funktioniert."},
    {q:"Was kennzeichnet die Performing-Phase?", a:"• starkes Wir-Gefühl\n• gemeinsames Ziel\n• Vertrauen\n• wertschätzendes Klima\n• klare Rollen\n• hohe Leistungsfähigkeit\n• selbstständiges Arbeiten\n\nDie Führungskraft delegiert Aufgaben und begleitet das Team nur noch weitmaschig.\n\nBeispiel:\nDas Einkaufsteam organisiert die Beschaffung einer neuen Warengruppe weitgehend selbstständig und informiert die Führungskraft nur über wichtige Entscheidungen.\n\nMerksatz:\n👉 Performing = Team läuft → Führung delegiert."},
    {q:"Was ist die Adjourning-Phase?", a:"Die Adjourning-Phase ist die Auflösungsphase eines Teams.\n\nSie tritt beispielsweise auf, wenn:\n\n• ein Mitarbeiter ausscheidet\n• ein Projekt endet\n• ein Team aufgelöst wird\n\nDie Führungskraft sollte einen geordneten Übergang sicherstellen und darauf achten, dass wichtige Informationen und Wissen erhalten bleiben.\n\nBeispiel:\nEin Projektteam beendet seine Arbeit. Der Teamleiter sorgt dafür, dass wichtige Dokumente und Erfahrungen dokumentiert und übergeben werden.\n\nMerksatz:\n👉 Adjourning = Abschied organisieren und Wissen sichern."},
    {q:"Welche Konfliktarten wurden in der Prüfung 182e abgefragt?", a:"Die Musterlösung nennt:\n\n• interpersonelle Konflikte → Konflikt zwischen mehreren Personen\n• intrapersonelle Konflikte → Konflikt innerhalb einer Person\n\nBeispiel:\n\nInterpersonell: Zwei Einkäufer streiten über die Zuständigkeit für einen Lieferanten.\n\nIntrapersonell: Ein Mitarbeiter ist gleichzeitig unsicher, ob er den Interessen seines Vorgesetzten oder denen eines Kollegen folgen soll.\n\nMerksatz:\n👉 Inter = zwischen Menschen. Intra = innerhalb einer Person."},
    {q:"Was versteht man unter Mediation als Konfliktlösungsmethode?", a:"Mediation ist ein freiwilliges, außergerichtliches Verfahren zur Konfliktlösung.\n\nDabei:\n\n• erarbeiten die Konfliktparteien selbst die Lösung\n• unterstützt sie ein neutraler Mediator\n• entscheidet der Mediator nicht selbst\n• werden gemeinsame, zukunftsorientierte Lösungen entwickelt\n• wird das Ergebnis anschließend festgehalten\n\nBeispiel:\nZwei Abteilungen streiten über Zuständigkeiten. Ein neutraler Mediator führt Gespräche und unterstützt beide Seiten dabei, eine gemeinsame Regelung zu entwickeln.\n\nMerksatz:\n👉 Mediator vermittelt – er entscheidet nicht."},
    {q:"Warum kann Kommunikation bei der Lieferantenbewertung als Bewertungskriterium verwendet werden?", a:"Eine gute Kommunikation beeinflusst die Zusammenarbeit zwischen Unternehmen und Lieferant.\n\nSie ermöglicht beispielsweise:\n\n• schnelle Problemlösung\n• Abstimmung bei Lieferproblemen\n• transparente Informationen\n• bessere Zusammenarbeit\n• frühzeitiges Erkennen von Problemen\n• bessere Reaktion auf Änderungen\n\nBeispiel:\nEin Lieferant informiert den Einkauf bereits drei Tage vorher über eine drohende Lieferverzögerung. Dadurch kann der Einkauf reagieren.\n\nMerksatz:\n👉 Gute Lieferantenkommunikation verhindert Überraschungen."},
    {q:"Wie kann ein Lieferant bei Kommunikations- oder anderen Leistungsproblemen gezielt weiterentwickelt werden?", a:"Bei der Lieferantenerziehung werden zunächst Schwachstellen mit dem Lieferanten besprochen.\n\nAnschließend:\n\n• konkrete Probleme benennen\n• KPIs festlegen\n• Verbesserungsmaßnahmen vereinbaren\n• Zielwerte definieren\n• nächste Bewertung durchführen\n• Fortschritt überprüfen\n\nBeispiel:\nEin Lieferant informiert zu spät über Lieferprobleme. Gemeinsam wird vereinbart, dass Lieferabweichungen künftig mindestens 48 Stunden vorher gemeldet werden.\n\nMerksatz:\n👉 Problem → KPI → Maßnahme → Kontrolle."},
    {q:"Welche Auswirkungen kann die Einführung von E-Commerce auf die Lieferantenkommunikation haben?", a:"Durch die stärkere Digitalisierung können:\n\n• persönliche Kontakte abnehmen\n• Kommunikation automatisierter werden\n• Flexibilität verloren gehen\n• kurzfristige Steuerungsmöglichkeiten eingeschränkt werden\n\nBei einer direkten ERP-System-Verknüpfung läuft vieles automatisiert ab.\n\nBeispiel:\nBestellungen werden automatisch vom ERP-System an den Lieferanten übertragen. Dadurch ist weniger persönlicher Kontakt zwischen Einkäufer und Lieferant erforderlich.\n\nMerksatz:\n👉 Digitalisierung macht Prozesse schneller – aber nicht automatisch persönlicher."},
    {q:"Warum benötigen Einkäufer bei internationalen Geschäftsbeziehungen interkulturelle Kompetenz?", a:"Unterschiedliche Kulturen können sich beispielsweise unterscheiden bei:\n\n• Kommunikationsverhalten\n• Verhandlungsstil\n• Umgang mit Hierarchien\n• Zeitverständnis\n• Entscheidungsprozessen\n• Umgang mit Kritik\n• Geschäftsetikette\n\nDeshalb können Schulungen zur interkulturellen Kompetenz sinnvoll sein.\n\nBeispiel:\nEin deutscher Einkäufer interpretiert eine sehr zurückhaltende Reaktion eines asiatischen Geschäftspartners nicht automatisch als Ablehnung, sondern berücksichtigt kulturelle Unterschiede in der Kommunikation.\n\nMerksatz:\n👉 Andere Kultur ≠ falsche Kommunikation – anders verstehen lernen."},
    {q:"Welche Punkte sollte eine Verhandlungscheckliste enthalten?", a:"Inhaltliche Vorbereitung:\n\n• Verhandlungsziele\n• Marktposition des Lieferanten\n• Unternehmensdaten\n• Kapazitätsauslastung\n• eigene Einkaufsmacht\n• Argumente\n• mögliche Einwände\n• Verhandlungsstil\n\nOrganisatorisch:\n\n• Teilnehmer\n• Termin\n• Reihenfolge\n• Ort\n• Zeit\n\nPersonell:\n\n• Informationen über Verhandlungspartner\n• Interessen und Bedürfnisse\n• gemeinsame Interessen\n\nMarktdaten:\n\n• Branchenentwicklung\n• Rohstoffpreise\n• Wettbewerber\n\nBeispiel:\nVor einer Preisverhandlung prüft der Einkäufer die Rohstoffpreise, die Marktposition des Lieferanten, die eigenen Alternativen und die möglichen Argumente des Lieferanten.\n\nMerksatz:\n👉 Wer gut vorbereitet ist, verhandelt nicht aus dem Bauch heraus."},
    {q:"Welche Verhandlungsstrategien können in Einkaufsverhandlungen eingesetzt werden?", a:"Aus den Prüfungen besonders wichtig:\n\nSteigerungsmethode\n\nDie Argumentation beginnt mit dem schwächsten Argument und steigert sich bis zum stärksten Argument.\n\nSalamitaktik\n\nEine große Forderung wird in viele kleine Teilforderungen zerlegt und schrittweise verhandelt.\n\nBeispiel:\nStatt direkt 5 % Preisnachlass zu fordern, werden nacheinander Frachtkosten, Zahlungsbedingungen, Mengenrabatte und anschließend der Stückpreis verhandelt.\n\nMerksatz:\n👉 Steigerung = Argumente werden stärker. Salami = Forderung wird kleiner geschnitten."},
    {q:"Welche vier Grundprinzipien gehören zum Harvard-Konzept?", a:"1. Menschen und Probleme voneinander trennen.\n→ Sachlich bleiben und persönliche Beziehungen nicht mit dem Problem vermischen.\n\n2. Auf Interessen konzentrieren, nicht auf Positionen.\n→ Herausfinden: „Warum möchte die andere Seite das?“\n\n3. Entscheidungsalternativen zum beiderseitigen Vorteil entwickeln.\n→ Win-Win-Lösungen suchen.\n\n4. Auf objektiven Beurteilungskriterien bestehen.\n→ z. B. Marktpreise, Branchenindizes, Statistiken.\n\nBeispiel:\nLieferant: „Wir brauchen 10 % mehr.“\n\nEinkäufer: „Lassen Sie uns zunächst anschauen, welche Kostenelemente tatsächlich gestiegen sind und wie stark.“\n\nMerksatz:\n👉 Menschen trennen – Interessen klären – Win-Win suchen – objektiv begründen."},
    {q:"Was bedeutet es, bei einer Verhandlung Interessen statt Positionen zu betrachten?", a:"Eine Position ist das, was jemand fordert.\n\nEin Interesse ist der Grund, warum jemand diese Forderung stellt.\n\nDer Einkäufer versucht deshalb herauszufinden:\n\n„Warum möchten Sie diese Bedingung?“\n\nDadurch können möglicherweise gemeinsame Lösungen gefunden werden.\n\nBeispiel:\nLieferant: „Wir brauchen eine höhere Bestellmenge.“\n\nPosition: höhere Bestellmenge.\n\nInteresse: bessere Auslastung der Produktion.\n\nLösung: Der Einkäufer könnte größere Abrufmengen gegen bessere Preise vereinbaren.\n\nMerksatz:\n👉 Position = Was will ich? Interesse = Warum will ich es?"},
    {q:"Wie sollte ein Einkäufer auf einen harten, positionsbezogenen Verhandlungsstil reagieren?", a:"Nicht selbst in einen reinen Macht- oder Positionskampf einsteigen.\n\nStattdessen:\n\n• sachbezogen argumentieren\n• Menschen und Sache trennen\n• Interessen ermitteln\n• objektive Kriterien verwenden\n• Gemeinsamkeiten herausarbeiten\n• Alternativen entwickeln\n• langfristige Zusammenarbeit berücksichtigen\n\nBeispiel:\nDer Lieferant sagt: „10 % Preissteigerung oder wir machen keinen Vertrag.“\n\nDer Einkäufer diskutiert nicht nur über die 10 %, sondern analysiert gemeinsam die Kostenentwicklung und sucht alternative Lösungen.\n\nMerksatz:\n👉 Hart in der Sache – fair und sachlich zum Menschen."},
    {q:"Welche Arten von Argumenten können zur Erreichung von Verhandlungszielen eingesetzt werden?", a:"Beispielsweise:\n\n• eigene Nachkalkulation\n• Marktpreise\n• Rohstoffentwicklung\n• Qualitätsprobleme\n• Lieferprobleme\n• eigene Mehraufwendungen\n• langfristige Geschäftsbeziehung\n• alternative Lieferquellen\n• gemeinsame Produktentwicklung\n• Prozessoptimierung\n• Mengenbündelung\n\nBeispiel:\nDer Lieferant fordert einen höheren Preis, hat aber gleichzeitig eine hohe Fehlerquote. Der Einkäufer weist auf die dadurch entstehenden zusätzlichen Kosten hin.\n\nMerksatz:\n👉 Gute Argumente sind konkret, belegbar und für die andere Seite relevant."},
    {q:"Warum ist ein strukturiertes Onboarding wichtig?", a:"Onboarding stellt sicher, dass ein neuer Mitarbeiter systematisch in das Unternehmen und seine Aufgaben integriert wird.\n\nZiele sind:\n\n• Mitarbeiter fühlt sich willkommen\n• schnellere Produktivität\n• geringere Fehleranfälligkeit\n• bessere Integration\n• stärkere Mitarbeiterbindung\n• weniger Fluktuation\n• positiver Arbeitgeberauftritt\n\nBeispiel:\nEin ehemaliger Auszubildender übernimmt eine Stelle im operativen Einkauf. Durch einen Einarbeitungsplan, Mentor und regelmäßige Feedbackgespräche findet er sich schneller in der neuen Rolle zurecht.\n\nMerksatz:\n👉 Gutes Onboarding = schneller integriert + schneller produktiv + stärker gebunden."},
    {q:"Nennen Sie geeignete Onboarding-Maßnahmen vor der Arbeitsaufnahme.", a:"• Stellenbeschreibung erstellen\n• Arbeitsplatz vorbereiten\n• Hard- und Software bereitstellen\n• Einarbeitungsplan erstellen\n• Mentor/Paten bestimmen\n• Kollegen informieren\n• ggf. Betriebsrat einbeziehen\n• organisatorische Voraussetzungen schaffen\n\nBeispiel:\nDer neue Einkäufer erhält bereits vor seinem ersten Tag einen Arbeitsplatz, Laptop, Zugänge und einen Einarbeitungsplan.\n\nMerksatz:\n👉 Vor dem ersten Tag muss alles bereit sein."},
    {q:"Welche Maßnahmen sind beim Arbeitseinstieg eines neuen Mitarbeiters sinnvoll?", a:"• Begrüßung durch Führungskraft\n• Vorstellung des Teams\n• erstes Gespräch über Erwartungen und Wünsche\n• Mentor/Pate begleitet den Mitarbeiter\n• wichtige Prozesse erklären\n• laufende Projekte vorstellen\n• organisatorische Abläufe erklären\n• Ablage und Informationssysteme zeigen\n\nBeispiel:\nDer neue Mitarbeiter wird am ersten Tag durch den Teamleiter begrüßt und anschließend vom Paten durch die wichtigsten Einkaufsprozesse geführt.\n\nMerksatz:\n👉 Erster Tag = willkommen heißen + Orientierung geben."},
    {q:"Welche Maßnahmen können in den ersten drei bis sechs Monaten durchgeführt werden?", a:"• regelmäßige Feedbackgespräche\n• Teambildungsmaßnahmen\n• Mitarbeitergespräch\n• Personalentwicklungsgespräch\n• Weiterbildungsmaßnahmen vereinbaren\n• Kollegenbefragung\n• jährliche Entwicklungs-/Mitarbeitergespräche festlegen\n\nBeispiel:\nNach drei Monaten spricht der Teamleiter mit dem neuen Einkäufer über seine bisherigen Erfahrungen und legt gemeinsam weitere Entwicklungsmaßnahmen fest.\n\nMerksatz:\n👉 Onboarding endet nicht am ersten Arbeitstag."},
    {q:"Welche Personalentwicklungsmaßnahmen nennt die Musterlösung für die Entwicklung eines ehemaligen Auszubildenden zum operativen Einkäufer?", a:"• Einarbeitungsplan\n• Jobrotation/Hospitation\n• Fachwirt für Einkauf\n• Business-Englisch\n• Schulung Disposition\n• Schulung Verhandlungsführung\n• Training für souveränes Auftreten\n• Training zum Umgang mit Stress\n• Coaching\n\nBeispiel:\nEin ehemaliger Auszubildender arbeitet zunächst in verschiedenen Bereichen mit, besucht ein Verhandlungstraining und erhält anschließend einen erfahrenen Einkäufer als Coach.\n\nMerksatz:\n👉 Fachwissen + Methoden + Persönlichkeit = ganzheitliche Personalentwicklung."},
    {q:"Welche grundlegenden Anforderungen müssen Mitarbeiter erfüllen, wenn sie künftig als Ausbilder eingesetzt werden?", a:"Die Musterlösung nennt:\n\n• persönliche Eignung\n• fachliche Eignung\n\nDie konkreten Anforderungen ergeben sich aus den Vorschriften zur Berufsausbildung.\n\nBeispiel:\nEin fachlich qualifizierter Einkäufer soll künftig Auszubildende betreuen. Neben seiner fachlichen Kompetenz muss er auch persönlich geeignet sein.\n\nMerksatz:\n👉 Ausbilder = fachlich geeignet + persönlich geeignet."},
    {q:"Welche Kriterien können bei der Auswahl eines Bewerbers für eine Stelle im Einkauf herangezogen werden?", a:"Die Musterlösung nennt beispielsweise:\n\n• Fachwissen im Einkauf\n• IT-Kenntnisse\n• Sprachkenntnisse\n• Einkaufskenntnisse\n• Gehaltsvorstellungen\n\nAnschließend können die Kriterien gewichtet und mithilfe einer Nutzwertanalyse bewertet werden.\n\nBeispiel:\nFür einen internationalen Einkauf werden Sprachkenntnisse stärker gewichtet als für eine rein nationale operative Einkaufsstelle.\n\nMerksatz:\n👉 Kriterien festlegen → gewichten → Bewerber objektiv vergleichen."},
    {q:"Welche Schritte sind bei der Übernahme eines Auszubildenden in eine Einkaufsstelle sinnvoll?", a:"• interne Ausschreibung prüfen\n• Vorgesetzten informieren\n• Personalabteilung einbeziehen\n• Entwicklungspfad besprechen\n• Übernahmegespräch führen\n• Arbeitsvertrag vereinbaren\n• Personalentwicklungsmaßnahmen festlegen\n\nBeispiel:\nDer Einkaufsleiter bespricht mit HR und dem Auszubildenden die Übernahme und vereinbart anschließend einen zweijährigen Entwicklungsplan.\n\nMerksatz:\n👉 Übernahme nicht einfach entscheiden – gemeinsam besprechen und entwickeln."},
    {q:"Was bedeutet zielgruppengerechte Kommunikation bei einer Präsentation?", a:"Die Präsentation muss auf die Zielgruppe abgestimmt werden.\n\nWichtig sind:\n\n• verständliche Sprache\n• passende Informationsmenge\n• geeignete Medien\n• klare Struktur\n• nonverbale Kommunikation\n• Konzentration auf das Wesentliche\n• Ziel und Botschaft klar herausstellen\n\nBeispiel:\nEin Einkaufsleiter präsentiert dem Geschäftsführer Einsparpotenziale anders als seinem Einkaufsteam: Die Geschäftsführung erhält vor allem Kennzahlen und Auswirkungen, während das Team zusätzlich konkrete Umsetzungsschritte bekommt.\n\nMerksatz:\n👉 Nicht die Präsentation muss zur Zielgruppe passen – die Präsentation muss sich an der Zielgruppe orientieren."}
  ],
  "Ausbildung & Jugendarbeitsschutzgesetz": [
    {q:"Für wen gilt das Jugendarbeitsschutzgesetz (JArbSchG)?", a:"Das JArbSchG schützt Jugendliche unter 18 Jahren im Arbeitsleben. Bei minderjährigen Auszubildenden müssen deshalb zusätzlich zu den allgemeinen Regeln der Berufsausbildung besondere Schutzvorschriften beachtet werden.\n\nBeispiel:\nEine Auszubildende ist bei Ausbildungsbeginn 16 Jahre alt. Für sie müssen die Vorschriften des JArbSchG berücksichtigt werden.\n\nMerksatz:\n👉 Minderjähriger Azubi = besonderen Jugendarbeitsschutz beachten."},
    {q:"Welche Themen regelt das JArbSchG bei minderjährigen Auszubildenden?", a:"Es enthält besondere Schutzvorschriften, insbesondere zu Arbeitszeiten, Ruhezeiten, Pausen, Urlaub und der Beschäftigung im Zusammenhang mit der Berufsschule.\n\nBeispiel:\nEin 16-jähriger Azubi darf nicht einfach nach denselben Arbeitszeitregeln eingesetzt werden wie ein volljähriger Mitarbeiter.\n\nMerksatz:\n👉 JArbSchG = besonderer Schutz bei Zeit, Erholung und Beschäftigung."},
    {q:"Was ist bei einem 16-jährigen Auszubildenden besonders zu beachten?", a:"Neben den allgemeinen Vorschriften für die Berufsausbildung müssen insbesondere die zusätzlichen Schutzvorschriften des Jugendarbeitsschutzgesetzes berücksichtigt werden.\n\nBeispiel:\nBei der Einsatzplanung eines 16-jährigen Azubis müssen seine besonderen Arbeits- und Ruhezeitvorschriften berücksichtigt werden.\n\nMerksatz:\n👉 Unter 18 = Ausbildung + zusätzlicher Jugendschutz."},
    {q:"Welche Rechtsgrundlagen können bei minderjährigen Auszubildenden relevant sein?", a:"Je nach Sachverhalt insbesondere:\n\n• BBiG – Berufsbildungsgesetz\n• JArbSchG – Jugendarbeitsschutzgesetz\n• ArbZG – Arbeitszeitgesetz\n• BetrVG – Betriebsverfassungsgesetz\n• weitere Jugendschutzvorschriften, soweit sie den Sachverhalt betreffen.\n\nBeispiel:\nGeht es um die Ausbildung selbst, ist das BBiG zentral; beim besonderen Schutz eines 16-Jährigen kommt das JArbSchG hinzu.\n\nMerksatz:\n👉 BBiG = Ausbildung, JArbSchG = Schutz Minderjähriger."},
    {q:"Welche Voraussetzungen muss ein Betrieb erfüllen, um ausbilden zu dürfen?", a:"Der Betrieb muss nach Art und Einrichtung für die Berufsausbildung geeignet sein. Außerdem muss eine geeignete Person als Ausbilder eingesetzt werden.\n\nBeispiel:\nEin Unternehmen möchte erstmals Kaufleute für Büromanagement ausbilden. Die zuständige Stelle prüft, ob die Voraussetzungen erfüllt sind.\n\nMerksatz:\n👉 Ausbildung funktioniert nur mit geeignetem Betrieb + Ausbilder."},
    {q:"Was bedeutet persönliche Eignung eines Ausbilders?", a:"Der Ausbilder darf keine Umstände aufweisen, die ihn für die Ausbildung ungeeignet machen, beispielsweise relevante oder wiederholte Verstöße gegen Ausbildungsvorschriften oder Jugendschutzbestimmungen.\n\nBeispiel:\nWer wiederholt schwerwiegend gegen Vorschriften zum Schutz von Auszubildenden verstößt, kann persönlich ungeeignet sein.\n\nMerksatz:\n👉 Persönliche Eignung = verantwortungsvoller und gesetzeskonformer Umgang mit Azubis."},
    {q:"Was bedeutet fachliche Eignung des Ausbilders?", a:"Der Ausbilder muss über die erforderlichen beruflichen Fertigkeiten, Kenntnisse und Fähigkeiten sowie eine angemessene berufliche Erfahrung verfügen.\n\nBeispiel:\nEin erfahrener Einkäufer bildet einen Auszubildenden im Einkauf aus und vermittelt ihm die notwendigen fachlichen Kenntnisse.\n\nMerksatz:\n👉 Fachliche Eignung = Fachwissen + Berufserfahrung."},
    {q:"Was bedeutet berufs- und arbeitspädagogische Eignung?", a:"Der Ausbilder muss in der Lage sein, die Ausbildung zu planen, durchzuführen, zu kontrollieren und die Auszubildenden methodisch und pädagogisch zu fördern.\n\nBeispiel:\nDer Ausbilder wählt eine geeignete Unterweisungsmethode, statt dem Azubi lediglich die fertige Lösung vorzugeben.\n\nMerksatz:\n👉 Wissen haben reicht nicht – man muss es auch vermitteln können."},
    {q:"Welche Bedeutung hat die AEVO?", a:"Die Ausbilder-Eignungsverordnung (AEVO) regelt den Nachweis der berufs- und arbeitspädagogischen Kenntnisse und Fähigkeiten von Ausbildern.\n\nBeispiel:\nEin Mitarbeiter legt die Ausbildereignungsprüfung bei der IHK ab.\n\nMerksatz:\n👉 AEVO = Nachweis der Ausbildungskompetenz."},
    {q:"Wer prüft die Eignung eines Ausbildungsbetriebs?", a:"Die zuständige Stelle, beispielsweise die IHK, überwacht und unterstützt die Berufsausbildung und prüft die entsprechenden Voraussetzungen.\n\nBeispiel:\nEin Unternehmen möchte erstmals einen kaufmännischen Ausbildungsberuf anbieten und wendet sich an die zuständige IHK.\n\nMerksatz:\n👉 Zuständige Stelle – bei vielen kaufmännischen Berufen: IHK."},
    {q:"Was ist eine Ausbildungsordnung?", a:"Sie bildet die rechtliche Grundlage für die betriebliche Ausbildung eines anerkannten Ausbildungsberufs und enthält beispielsweise Berufsbezeichnung, Ausbildungsdauer, Ausbildungsinhalte und Prüfungsanforderungen.\n\nBeispiel:\nDie Ausbildungsordnung legt fest, welche Kompetenzen ein Azubi während seiner Ausbildung erwerben soll.\n\nMerksatz:\n👉 Ausbildungsordnung = rechtlicher Rahmen der Ausbildung."},
    {q:"Was ist der Ausbildungsrahmenplan?", a:"Er ist Bestandteil der Ausbildungsordnung und enthält die sachliche und zeitliche Gliederung der zu vermittelnden Fertigkeiten, Kenntnisse und Fähigkeiten.\n\nBeispiel:\nEr gibt vor, welche Inhalte während der Ausbildung vermittelt werden sollen.\n\nMerksatz:\n👉 Ausbildungsrahmenplan = Was und wann?"},
    {q:"Was ist der betriebliche Ausbildungsplan?", a:"Er überträgt die Vorgaben des Ausbildungsrahmenplans auf die konkreten Gegebenheiten des Ausbildungsbetriebs.\n\nBeispiel:\nEin Unternehmen legt fest, wann ein Azubi Einkauf, Vertrieb, Buchhaltung und Logistik durchläuft.\n\nMerksatz:\n👉 Rahmenplan = Vorgabe → betrieblicher Plan = Umsetzung im Unternehmen."},
    {q:"Wie entsteht der betriebliche Ausbildungsplan?", a:"Grundlage sind die Ausbildungsordnung und der darin enthaltene Ausbildungsrahmenplan. Daraus entwickelt der Betrieb seinen konkreten Ausbildungsplan.\n\nBeispiel:\nDie vorgeschriebenen Lerninhalte werden den passenden Abteilungen des Unternehmens zugeordnet.\n\nMerksatz:\n👉 Ausbildungsordnung → Rahmenplan → betrieblicher Ausbildungsplan."},
    {q:"Was ist ein individueller Ausbildungsplan?", a:"Dabei wird die Ausbildungsplanung an die individuellen Voraussetzungen eines Auszubildenden angepasst.\n\nBeispiel:\nBei einer verkürzten Ausbildung müssen Ausbildungsabschnitte zeitlich angepasst werden.\n\nMerksatz:\n👉 Individueller Plan = Ausbildung auf den Azubi zugeschnitten."},
    {q:"Was ist ein Versetzungsplan?", a:"Er legt fest, wann und wie lange ein Auszubildender bestimmte Abteilungen oder Ausbildungsstationen durchläuft.\n\nBeispiel:\nJanuar–März Einkauf, April–Juni Vertrieb, Juli–September Logistik.\n\nMerksatz:\n👉 Versetzungsplan = Wer ist wann wo?"},
    {q:"Wer kann bei der Erstellung bzw. Umsetzung des Ausbildungsplans beteiligt sein?", a:"Neben Ausbildungsleitung und Ausbildern können insbesondere Fachabteilungen und Betriebsrat beteiligt werden. Der betriebliche Ausbildungsplan wird der zuständigen Stelle entsprechend den Ausbildungsvorgaben vorgelegt.\n\nBeispiel:\nEinkauf und Logistik stimmen ab, wann der Azubi die jeweiligen Abteilungen durchläuft.\n\nMerksatz:\n👉 Ausbildungsplanung = Zusammenarbeit mehrerer Beteiligter."},
    {q:"Welche Aufgaben hat ein Ausbilder?", a:"Er soll Auszubildende anleiten, fördern, unterstützen und beurteilen sowie die notwendigen beruflichen Kompetenzen vermitteln.\n\nBeispiel:\nEin Azubi hat Schwierigkeiten bei einer Aufgabe. Der Ausbilder erklärt den Vorgang erneut und wählt eine andere Lernmethode.\n\nMerksatz:\n👉 Ausbilder = anleiten + fördern + beurteilen."},
    {q:"Wie sollte ein Ausbilder mit Lernschwierigkeiten umgehen?", a:"Er sollte Ursachen erkennen, die Ausbildung möglichst individuell gestalten und geeignete Unterstützungsmaßnahmen einsetzen.\n\nBeispiel:\nEin Azubi versteht einen komplexen Beschaffungsprozess nicht. Der Ausbilder erklärt ihn anhand eines praktischen Beispiels.\n\nMerksatz:\n👉 Bei Lernproblemen: fördern statt nur kontrollieren."},
    {q:"Was ist vor dem Einsatz eines Auszubildenden in gefährdungsrelevanten Arbeitsbereichen wichtig?", a:"Der Auszubildende muss über Gefahren, Verhaltensregeln und notwendige Schutzmaßnahmen unterwiesen werden.\n\nBeispiel:\nVor dem ersten Betreten eines Produktionsbereichs erfolgt eine Sicherheitsunterweisung.\n\nMerksatz:\n👉 Erst unterweisen – dann einsetzen."},
    {q:"Was sollte am ersten Ausbildungstag organisiert werden?", a:"Beispielsweise:\nEmpfang → Betriebsrundgang → Vorstellung wichtiger Personen → Sicherheitsinformationen → Ablauf der Ausbildung → Probezeit → Ausbildungsnachweis.\n\nBeispiel:\nDer neue Azubi lernt seinen Ausbilder, die Kollegen und wichtige Ansprechpartner kennen.\n\nMerksatz:\n👉 Der erste Tag schafft Orientierung und Sicherheit."},
    {q:"Welche wichtigen Personen sollte ein Auszubildender kennenlernen?", a:"Zum Beispiel Ausbilder, Kollegen, Vorgesetzte, Betriebsrat und Jugend- und Auszubildendenvertretung (JAV).\n\nBeispiel:\nBeim Betriebsrundgang wird dem Azubi gezeigt, an wen er sich bei Problemen wenden kann.\n\nMerksatz:\n👉 Azubi muss seine Ansprechpartner kennen."},
    {q:"Was ist beim Ausbildungsnachweis zu beachten?", a:"Der Auszubildende muss über das ordnungsgemäße Führen des Ausbildungsnachweises informiert und dabei entsprechend angeleitet werden.\n\nBeispiel:\nDer Ausbilder erklärt zu Beginn, wie das Berichtsheft geführt wird.\n\nMerksatz:\n👉 Ausbildungsnachweis = Ausbildung dokumentieren."},
    {q:"Welche Aufgabe hat die Berufsschule im dualen Ausbildungssystem?", a:"Die Berufsschule vermittelt insbesondere die theoretischen bzw. schulischen Ausbildungsinhalte, während der Ausbildungsbetrieb die praktische Berufsausbildung übernimmt.\n\nBeispiel:\nIn der Schule lernt der Azubi Grundlagen der Beschaffung; im Betrieb wendet er diese praktisch an.\n\nMerksatz:\n👉 Dual = Berufsschule + Ausbildungsbetrieb."},
    {q:"Welche Personen und Institutionen können an einer Ausbildung beteiligt sein?", a:"Insbesondere:\nAuszubildender, Ausbilder, Ausbildungsbetrieb, Berufsschule, zuständige Stelle/IHK sowie ggf. Betriebsrat und JAV.\n\nBeispiel:\nDer Betrieb übernimmt die Praxis, die Berufsschule die Theorie und die IHK begleitet die Ausbildung als zuständige Stelle.\n\nMerksatz:\n👉 Ausbildung ist ein Zusammenspiel mehrerer Beteiligter."},
    {q:"Wie können Prüfungen in Ausbildungsberufen aufgebaut sein?", a:"Je nach Ausbildungsordnung kann beispielsweise eine gestreckte Abschlussprüfung vorgesehen sein, bei der die Prüfung in Teil 1 und Teil 2 aufgeteilt wird.\n\nBeispiel:\nTeil 1 findet bereits während der Ausbildung statt, Teil 2 zum Ende der Ausbildung.\n\nMerksatz:\n👉 Gestreckte Prüfung = Teil 1 + Teil 2."},
    {q:"Wie oft kann eine nicht bestandene Abschlussprüfung wiederholt werden?", a:"Eine nicht bestandene Abschlussprüfung kann grundsätzlich zweimal wiederholt werden.\n\nBeispiel:\nBesteht ein Azubi die Abschlussprüfung nicht, hat er grundsätzlich weitere Prüfungsversuche.\n\nMerksatz:\n👉 Nicht bestanden = 2 Wiederholungsmöglichkeiten."},
    {q:"Wann kann sich das Ausbildungsverhältnis bei nicht bestandener Abschlussprüfung verlängern?", a:"Auf Verlangen des Auszubildenden kann sich das Berufsausbildungsverhältnis bis zur nächstmöglichen Wiederholungsprüfung, höchstens um ein Jahr, verlängern.\n\nBeispiel:\nDer Azubi besteht die Abschlussprüfung nicht und verlangt die Verlängerung bis zum nächsten Prüfungstermin.\n\nMerksatz:\n👉 Nicht bestanden → auf Verlangen Verlängerung bis zur Wiederholungsprüfung."},
    {q:"Welche drei zentralen Anforderungen gelten für einen Ausbilder?", a:"Ein Ausbilder benötigt:\n1. persönliche Eignung\n2. fachliche Eignung\n3. berufs- und arbeitspädagogische Eignung\n\nBeispiel:\nEine erfahrene Einkäuferin besitzt Fachwissen und Berufspraxis, ist persönlich geeignet und verfügt über die erforderlichen Ausbildungskompetenzen.\n\nMerksatz:\n👉 Ausbilder = persönlich + fachlich + pädagogisch geeignet."},
    {q:"Was ist der grundlegende Unterschied zwischen BBiG und JArbSchG?", a:"Das BBiG regelt grundsätzlich die Durchführung der Berufsausbildung. Das JArbSchG enthält zusätzliche Schutzvorschriften für minderjährige Beschäftigte bzw. Auszubildende.\n\nBeispiel:\nDer Ausbildungsablauf richtet sich nach den Ausbildungsvorschriften des BBiG; bei einem 16-jährigen Azubi müssen zusätzlich die besonderen Jugendarbeitsschutzvorschriften eingehalten werden.\n\nMerksatz:\n👉 BBiG = Ausbildung, JArbSchG = Schutz Minderjähriger."}
  ]
};

const FAV_KEY = "ffe_favorites_v1";
const categoryNames = Object.keys(data);

let currentCategory = null;
let cards = [];
let order = [];
let pos = 0;
let flipped = false;

const homeView = document.getElementById("homeView");
const studyView = document.getElementById("studyView");
const catList = document.getElementById("catList");
const backBtn = document.getElementById("backBtn");
const studyCatName = document.getElementById("studyCatName");
const cardEl = document.getElementById("card");
const cardStage = document.getElementById("cardStage");
const questionText = document.getElementById("questionText");
const answerText = document.getElementById("answerText");
const progressFill = document.getElementById("progressFill");
const progressText = document.getElementById("progressText");
const progressPct = document.getElementById("progressPct");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const shuffleBtn = document.getElementById("shuffleBtn");
const resetBtn = document.getElementById("resetBtn");
const doneMsg = document.getElementById("doneMsg");
const starBtn = document.getElementById("starBtn");
const emptyFav = document.getElementById("emptyFav");
const controls = document.getElementById("controls");
const shuffleRow = document.getElementById("shuffleRow");

function loadFavorites(){
  try{
    const raw = localStorage.getItem(FAV_KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
function saveFavorites(list){
  localStorage.setItem(FAV_KEY, JSON.stringify(list));
}
function favKey(card){
  return card.q;
}
function isFavorite(card){
  if(!card) return false;
  return loadFavorites().some(f => f.q === card.q);
}
function toggleFavorite(card){
  let list = loadFavorites();
  const idx = list.findIndex(f => f.q === card.q);
  if(idx >= 0){
    list.splice(idx, 1);
  }else{
    list.push({q: card.q, a: card.a, source: currentCategory === "Favoriten" ? (card.source || "") : currentCategory});
  }
  saveFavorites(list);
  updateStar();
  // if currently in Favoriten and we removed the last/current, re-render
  if(currentCategory === "Favoriten"){
    openCategory("Favoriten");
  }
}

function buildHome(){
  catList.innerHTML = "";
  categoryNames.forEach(name => {
    const btn = document.createElement("button");
    btn.className = "cat-tile";
    btn.innerHTML = `<span class="cat-label">${name}</span><span class="cat-count">${data[name].length}</span>`;
    btn.addEventListener("click", () => openCategory(name));
    catList.appendChild(btn);
  });

  const hr = document.createElement("hr");
  hr.className = "cat-divider";
  catList.appendChild(hr);

  const favCount = loadFavorites().length;
  const favBtn = document.createElement("button");
  favBtn.className = "cat-tile favorites";
  favBtn.innerHTML = `<span class="cat-label">Favoriten</span><span class="cat-count">${favCount}</span>`;
  favBtn.addEventListener("click", () => openCategory("Favoriten"));
  catList.appendChild(favBtn);
}

function openCategory(name){
  currentCategory = name;
  if(name === "Favoriten"){
    cards = loadFavorites();
  }else{
    cards = data[name];
  }
  order = cards.map((_, i) => i);
  pos = 0;
  flipped = false;

  homeView.classList.add("hidden");
  studyView.classList.add("active");
  studyCatName.textContent = name;

  if(cards.length === 0){
    cardStage.style.display = "none";
    controls.style.display = "none";
    shuffleRow.style.display = "none";
    emptyFav.style.display = "block";
    progressFill.style.width = "0%";
    progressText.textContent = "0 Karten";
    progressPct.textContent = "";
    doneMsg.textContent = "";
    return;
  }

  cardStage.style.display = "";
  controls.style.display = "";
  shuffleRow.style.display = "";
  emptyFav.style.display = "none";
  render();
}

function goHome(){
  currentCategory = null;
  studyView.classList.remove("active");
  homeView.classList.remove("hidden");
  buildHome();
}

function updateStar(){
  if(!cards.length) return;
  const card = cards[order[pos]];
  const active = isFavorite(card);
  starBtn.classList.toggle("active", active);
  starBtn.textContent = active ? "★" : "☆";
}

function render(){
  if(!cards.length) return;
  const idx = order[pos];
  const card = cards[idx];
  questionText.textContent = card.q;
  answerText.textContent = card.a;
  cardEl.classList.remove("flipped");
  flipped = false;

  const total = cards.length;
  progressFill.style.width = ((pos+1)/total*100) + "%";
  progressText.textContent = `Karte ${pos+1} von ${total}`;
  progressPct.textContent = Math.round((pos+1)/total*100) + "%";

  prevBtn.disabled = pos === 0;
  nextBtn.disabled = pos === total - 1;
  doneMsg.textContent = (pos === total - 1) ? "🎉 Letzte Karte erreicht – gut gemacht!" : "";

  updateStar();
}

function flip(){
  if(!cards.length) return;
  flipped = !flipped;
  cardEl.classList.toggle("flipped", flipped);
}

backBtn.addEventListener("click", goHome);

starBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  if(!cards.length) return;
  toggleFavorite(cards[order[pos]]);
});

cardEl.addEventListener("click", (e) => {
  if(e.target === starBtn || starBtn.contains(e.target)) return;
  flip();
});

prevBtn.addEventListener("click", () => {
  if(pos > 0){ pos--; render(); }
});
nextBtn.addEventListener("click", () => {
  if(pos < cards.length - 1){ pos++; render(); }
});

shuffleBtn.addEventListener("click", () => {
  for(let i = order.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  pos = 0;
  render();
});

resetBtn.addEventListener("click", () => {
  order = cards.map((_, i) => i);
  pos = 0;
  render();
});

document.addEventListener("keydown", (e) => {
  if(!studyView.classList.contains("active")) return;
  if(e.key === "ArrowRight") nextBtn.click();
  if(e.key === "ArrowLeft") prevBtn.click();
  if(e.key === " ") { e.preventDefault(); flip(); }
  if(e.key === "Escape") goHome();
});

buildHome();
</script>
</body>
</html>
